<html lang="zh-CN">

<title>品牌架构 · 物料体系 · 交互图谱</title>
<style>

    --bg:#FFFFFF; --paper:#FBF9F5; --ink:#2B2620; --sub:#6B6459;

  html,body{height:100%;overflow:hidden}
  body{font-family:"PingFang SC","HarmonyOS Sans","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  #app{position:relative;height:100vh;overflow:hidden;

      radial-gradient(900px 600px at 50% 48%,rgba(243,233,215,.5),rgba(255,255,255,0) 70%),
      radial-gradient(500px 320px at 12% 42%,rgba(243,233,215,.35),rgba(255,255,255,0) 70%),
      radial-gradient(520px 320px at 88% 42%,rgba(243,233,215,.3),rgba(255,255,255,0) 70%),
      #FFFFFF;}

  /* 工具栏 */
  .bar{position:absolute;top:0;left:0;right:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
  .bar .t{font-weight:800;font-size:15px}
  .bar .t small{display:block;font-size:9.5px;color:var(--gold-deep);letter-spacing:.25em;font-weight:700}
  .stats{display:flex;gap:6px}
  .stat{background:var(--paper);border-radius:99px;font-size:11px;font-weight:700;color:var(--sub);padding:4px 12px}
  .stat b{color:var(--gold-deep)}
  .bar .sp{flex:1}
  .lg{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--sub);flex-wrap:wrap}
  .lg i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:4px;vertical-align:-1.5px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--sub);font-family:inherit;font-size:11.5px;font-weight:700;padding:6px 14px;border-radius:99px;cursor:pointer;transition:all .2s}
  .btn:hover{border-color:var(--gold);color:var(--ink);transform:translateY(-1px)}
  .btn.on{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
  .back{position:absolute;top:68px;left:16px;z-index:20;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:99px;padding:7px 17px;font-size:12px;font-weight:700;color:var(--gold-deep);text-decoration:none;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(43,38,32,.06);transition:all .2s}
  .back:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(201,154,60,.2)}

  #svg{width:100%;height:100%;cursor:grab;touch-action:none;display:block}
  #svg.drag{cursor:grabbing}

  /* 详情面板 */
  .panel{position:absolute;right:18px;bottom:18px;z-index:20;width:330px;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(43,38,32,.16);backdrop-filter:blur(12px);display:none}
  .panel.on{display:block;animation:pin .28s cubic-bezier(.2,.8,.3,1)}
  @keyframes pin{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1}}
  .panel .ph{height:5px;background:linear-gradient(90deg,var(--gold),var(--gold-deep))}
  .panel .pb{padding:18px 20px 20px}
  .panel .pt{font-size:10px;color:var(--gold-deep);letter-spacing:.22em;font-weight:800}
  .panel h3{font-size:20px;margin:3px 0 6px}
  .panel .st{display:inline-block;font-size:10px;border-radius:99px;padding:2px 11px;font-weight:700;margin-bottom:8px}
  .panel .st.done{background:var(--ok-bg);color:var(--ok)}
  .panel .st.wait{background:var(--gold-soft);color:var(--warn)}
  .panel p{font-size:12.5px;color:var(--sub);line-height:1.75}
  .panel .lk{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-top:8px;font-size:12px;font-weight:700;transition:all .2s}
  .panel .lk:hover{border-color:var(--gold);background:#FFFDF8;transform:translateX(2px)}
  .panel .lk .ico{width:28px;height:28px;border-radius:8px;background:var(--gold-soft);color:var(--gold-deep);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
  .panel .lk .go{margin-left:auto;color:var(--gold-deep)}
  .panel .x{position:absolute;top:12px;right:14px;border:none;background:none;font-size:17px;color:#A39B8E;cursor:pointer;font-family:inherit;transition:color .2s}
  .panel .x:hover{color:var(--ink)}
  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:15;font-size:11px;color:#A39B8E;background:rgba(255,255,255,.92);border-radius:99px;padding:6px 18px;pointer-events:none;box-shadow:0 2px 10px rgba(43,38,32,.05)}

  /* SVG 元素 */
  .edge{stroke:var(--gold);stroke-width:1.4;fill:none;opacity:.4;transition:all .3s}
  .edge.hot{stroke:var(--gold-deep);stroke-width:2.6;opacity:1;stroke-dasharray:7 5;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-12}}
  .dim .edge:not(.hot){opacity:.06}
  .nlabel{font-size:12.5px;font-weight:800;fill:var(--ink);text-anchor:middle;pointer-events:none}
  .nsub{font-size:8.5px;fill:var(--sub);text-anchor:middle;pointer-events:none}
  .alabel{font-size:9.5px;fill:var(--gold-deep);text-anchor:middle;font-weight:800;opacity:.8;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .nd{cursor:pointer;transition:opacity .3s}
  .dim .nd{opacity:.12}
  .dim .nd.hot{opacity:1}
  .box{fill:#fff;stroke:var(--gold);stroke-width:1.8;filter:drop-shadow(0 2px 5px rgba(43,38,32,.07));transition:all .25s}
  .nd:hover .box{stroke:var(--gold-deep);stroke-width:2.6;filter:drop-shadow(0 6px 14px rgba(201,154,60,.3))}
  .nd:hover{transform:translateY(-2px)}
  .box.core{fill:url(#gcore)}
  .box.idea{fill:url(#gidea)}
  .box.person{fill:#FFFDF8;stroke-dasharray:5 3}
  .box.asset{fill:var(--paper);stroke-width:1.3}
  .nd.hot .box{stroke:var(--gold-deep);stroke-width:2.6}
  .badge-dot{fill:var(--ok);stroke:#fff;stroke-width:1.2}
  .badge-dot.w{fill:var(--warn)}
  .icon-t{font-size:11px;text-anchor:middle;pointer-events:none}
  .halo{fill:none;stroke:rgba(201,154,60,.28);stroke-width:1.2}
</style>
</head>

N.forEach(n=>{

    const r=n.ang*Math.PI/180;
    n.x=CX+Math.cos(r)*R1*1.35;n.y=CY-Math.sin(r)*R1;
  }
});
const byOwner={};
A.forEach((a,i)=>{(byOwner[a.o]=byOwner[a.o]||[]).push({...a,idx:i});});
Object.keys(byOwner).forEach(o=>{
  const own=N.find(n=>n.id===o);
  const ang0=Math.atan2(CY-own.y,own.x-CX);
  const list=byOwner[o];const spread=0.55;
  list.forEach((a,k)=>{
    const t=ang0+(list.length===1?0:(spread*(k/(list.length-1)-0.5))*2);
    const dist=215+((k%2)?30:0);
    a.x=Math.max(95,Math.min(VW-95,own.x+Math.cos(t)*dist));
    a.y=Math.max(80,Math.min(VH-70,own.y-Math.sin(t)*dist));
    EDGES.push({f:o,to:'a'+a.idx,asset:true});
    N.push({id:'a'+a.idx,t:'asset',name:a.n,st:'done',asset:a,x:a.x,y:a.y});
  });
});
const NM={};N.forEach(n=>NM[n.id]=n);

const svg=document.getElementById('svg'),world=document.getElementById('world');
svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
function curve(x1,y1,x2,y2){
  const mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  return 'M'+x1+' '+y1+' Q'+(mx+(-dy/len)*len*0.08)+' '+(my+(dx/len)*len*0.08)+' '+x2+' '+y2;
}
EDGES.forEach((e,i)=>{
  const p=NM[e.f],q=NM[e.to];
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',curve(p.x,p.y,q.x,q.y));
  path.setAttribute('class','edge');path.dataset.eid=i;
  world.appendChild(path);
  if(e.l){
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',(p.x+q.x)/2);t.setAttribute('y',(p.y+q.y)/2-6);
    t.setAttribute('class','alabel');t.textContent=e.l;
    world.appendChild(t);
  }
});

    const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
    t1.setAttribute('x',n.x);t1.setAttribute('y',n.y+(n.en?3:5));t1.setAttribute('class','nlabel');
    if(n.t==='core'){t1.style.fill='#fff';t1.style.fontSize='15.5px';}
    if(n.t==='idea'){t1.style.fontSize='13.5px';t1.style.fill='#6E5314';}
    t1.textContent=n.name;g.appendChild(t1);
    if(n.en){
      const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
      t2.setAttribute('x',n.x);t2.setAttribute('y',n.y+17);t2.setAttribute('class','nsub');
      if(n.t==='core')t2.style.fill='rgba(255,255,255,.88)';
      if(n.t==='idea')t2.style.fill='rgba(110,83,20,.75)';
      t2.textContent=n.en;g.appendChild(t2);
    }
    if(n.t==='sub'||n.t==='person'){
      const d=document.createElementNS('http://www.w3.org/2000/svg','circle');
      d.setAttribute('cx',n.x+w/2-6);d.setAttribute('cy',n.y-h/2+7);d.setAttribute('r',4.5);
      d.setAttribute('class','badge-dot'+(n.st==='wait'?' w':''));g.appendChild(d);
    }
  }
  g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id);});
  world.appendChild(g);
});

let sel=null;
function select(id){
  if(sel===id){clear();return;}
  sel=id;document.body.classList.add('dim');
  document.querySelectorAll('.nd').forEach(g=>g.classList.remove('hot'));
  document.querySelectorAll('.edge').forEach(e=>e.classList.remove('hot'));
  const n=NM[id];
  document.querySelector('.nd[data-id="'+id+'"]')?.classList.add('hot');
  EDGES.forEach((e,i)=>{
    if(e.f===id||e.to===id){
      document.querySelector('.edge[data-eid="'+i+'"]')?.classList.add('hot');
      const other=e.f===id?e.to:e.f;
      const og=document.querySelector('.nd[data-id="'+other+'"]');
      if(og&&other!=='core')og.classList.add('hot');
      else if(og&&id!=='core')og.classList.add('hot');
    }
  });
  showPanel(n);
}
function clear(){
  sel=null;document.body.classList.remove('dim');
  document.querySelectorAll('.nd.hot,.edge.hot').forEach(e=>e.classList.remove('hot'));
  document.getElementById('panel').classList.remove('on');
}
function showPanel(n){
  const p=document.getElementById('panel');
  const typeMap={core:'核心 · 母品牌',idea:'思想层',person:'人物层',sub:'子品牌',asset:'物料'};
  document.getElementById('pType').textContent=typeMap[n.t];
  document.getElementById('pName').textContent=n.name;
  const st=document.getElementById('pSt');
  if(n.t==='asset'){st.style.display='none';}
  else{st.style.display='inline-block';st.className='st '+(n.st==='done'?'done':'wait');st.textContent=n.st==='done'?'✓ 已定案':'待选';}
  document.getElementById('pDesc').textContent=n.asset?n.asset.d:n.desc;
  const links=document.getElementById('pLinks');links.innerHTML='';
  if(n.asset){
    const a=document.createElement('a');a.className='lk';a.href=n.asset.h;
    a.innerHTML='<div class="ico">'+n.asset.i+'</div>打开 '+n.asset.n+'<span class="go">›</span>';
    links.appendChild(a);
  }else{
    const own=A.filter(x=>x.o===n.id);
    const title=document.createElement('div');
    title.style.cssText='font-size:11px;color:#A39B8E;margin-top:10px;font-weight:700';
    title.textContent='关联物料 '+own.length+' 件';
    links.appendChild(title);
    own.forEach(x=>{
      const a=document.createElement('a');a.className='lk';a.href=x.h;
      a.innerHTML='<div class="ico">'+x.i+'</div>'+x.n+'<span style="margin-left:auto;color:#A39B8E;font-weight:400">'+x.d+'</span>';
      links.appendChild(a);
    });
  }
  p.classList.add('on');
}
document.getElementById('px').onclick=clear;
svg.addEventListener('click',e=>{if(e.target===svg||e.target.id==='world')clear();});
svg.addEventListener('dblclick',e=>{if(e.target===svg||e.target.id==='world'){clear();fitView();}});

let vx=0,vy=0,vs=1;
function apply(){world.setAttribute('transform','translate('+vx+','+vy+') scale('+vs+')');}
function fitView(){
  const r=svg.getBoundingClientRect();
  const s=Math.min(r.width/VW,r.height/VH)*0.96;
  vs=s;vx=(VW-VW*s)/2;vy=(VH-VH*s)/2;apply();
}
function resetView(){clear();fitView();}
document.getElementById('reset').onclick=resetView;
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  const sx=(e.clientX-r.left)/r.width*VW,sy=(e.clientY-r.top)/r.height*VH;
  const k=e.deltaY<0?1.12:0.89;
  const ns=Math.min(3.2,Math.max(0.35,vs*k));
  vx=sx-(sx-vx)*(ns/vs);vy=sy-(sy-vy)*(ns/vs);vs=ns;apply();
},{passive:false});
let drag=null,moved=0;
svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx,vy};moved=0;svg.classList.add('drag');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=svg.getBoundingClientRect();
  const kx=VW/r.width,ky=VH/r.height;
  const dx=(e.clientX-drag.x)*kx,dy=(e.clientY-drag.y)*ky;
  moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
  vx=drag.vx+dx;vy=drag.vy+dy;apply();
});
svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('drag');});
world.addEventListener('click',e=>{if(moved>6)e.stopPropagation();},true);
addEventListener('resize',()=>fitView());

function filter(mode){
  document.querySelectorAll('.nd').forEach(g=>{
    const n=NM[g.dataset.id];
    let show=true;
    if(mode==='brand')show=n.t!=='asset';
    if(mode==='asset')show=n.t==='asset'||n.t==='core';
    g.style.transition='opacity .3s';g.style.display=show?'':'none';
  });
  document.querySelectorAll('.edge').forEach(e=>{
    const ed=EDGES[+e.dataset.eid];
    let show=true;
    if(mode==='brand')show=!ed.asset;
    if(mode==='asset')show=ed.asset;
    e.style.display=show?'':'none';
  });
  clear();
}
document.getElementById('fAll').onclick=()=>{setF('fAll');filter('all');};
document.getElementById('fBrand').onclick=()=>{setF('fBrand');filter('brand');};
document.getElementById('fAsset').onclick=()=>{setF('fAsset');filter('asset');};
function setF(id){['fAll','fBrand','fAsset'].forEach(x=>document.getElementById(x).classList.toggle('on',x===id));}
fitView();
// 嵌入 iframe 时隐藏返回按钮
if(window.self!==window.top){document.querySelector('.back')?.style.setProperty('display','none');}
</script>
