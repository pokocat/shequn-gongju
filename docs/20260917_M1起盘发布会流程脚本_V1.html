| 字段 | 内容 |

| 核心目标 | **首日 100 单**（1 折前 100 名赠创始编号 001–100）· 直播观看 ≥3,000 人 · 意向金→签约转化率 ≥30% |

---

## 一、发布会总参数

| 项 | 设计 |
| --- | --- |
| 名称 | 「王炸起盘 · 天选之夜前奏」——王炸社创始席位起盘发布会 |
| 时间 | M1 月第 1 周五晚 20:00–21:30（时长 90 分钟） |
| 形式 | 视频号直播（主）+ 腾讯会议（意向金持有者专属分会场）+ 城市首站线下同步（可选） |
| 主讲 | 一姐（创始人 IP）；AI 创始人「上线」数字亮相 3 分钟 |
| 中控 | 4 人：导播 1 + 评论区运营 2 + 签约通道管理 1 |
| 视觉 | 天选白金（直播封面/贴片/KT 板统一香槟金视觉） |

## 二、流程总表（时间轴）

### 开播前（19:00–20:00）

| 时间 | 动作 | 负责 |
| --- | --- | --- |
| 19:00 | 直播间开放，暖场视频轮播（品牌片 90 秒） | 导播 |
| 19:15 | 评论区运营开始签到互动：「扣『王炸』领起盘资料包」 | 评论运营 |
| 19:40 | 倒计时预告：「20:00 准时开闸，1 折 500 席，意向金持有者优先」 | 评论运营 |
| 19:55 | 播报当前意向金蓄水数（真实数字）：「今晚已有 XXX 人持有意向金，按到账时间排序锁 1 折」 | 评论运营 |

### 正式流程（20:00–21:30）

| 时间 | 环节 | 内容要点 | 话术锚点 |
| --- | --- | --- | --- |
| 20:00–20:03 | **开场** | 一姐开场白，宣布起盘 | 「今晚之后，王炸社正式发牌。」 |
| 20:03–20:13 | **品牌篇** | 王炸社是什么 · 一姐创业故事 · 双引擎逻辑 | 「AI 时代最大的不公平，是信息差——我们把它抹平。」 |
| 20:13–20:16 | **AI 创始人亮相** | 「上线」首次数字亮相：宣读《001 号主理人立项书》（普惠计划） | 「大家好，我是上线。今晚，我正式上线。」 |
| 20:16–20:31 | **商业模式篇** | 四级体系一页图 · 普惠班随心付雷达 · 市代怎么挣钱（回本模型） | 「1 折进来的市代，1–2 个月回本——不是承诺，是模型摆在这。」 |
| 20:31–20:41 | **价格公示篇** | 常价四档 · 1 折 500 席阶梯 · 涨价三铁律（现场展示公示页） | 「规则就三条：名额触发、每月公示、绝不超发——包括我自己介绍来的朋友。」 |
| 20:41–20:46 | **1 折开闸** | 宣布开抢：签约通道开启 · 意向金排序规则 · 前 100 名创始编号 | 「现在，1 折 500 席，开闸。」 |
| 20:46–20:56 | **案例见证** | 种子团长 30 天数据 · 首批班实拍 · 学员随心付留言 | 「这些班是 1,000 元上车卡跑出来的——今晚之后，是 1.2 万的市代席位。」 |
| 20:56–21:11 | **Q&A** | 现场回应五大高频问题（见第四节异议库） | 评论运营筛题，一姐直答 |
| 21:11–21:21 | **收尾逼单** | 实时播报签约数 + 剩余席位 · 1 折名额倒计时提醒 | 「已经 XX 席。500 席卖完，下一批就是 2.4 万——规则不设例外。」 |
| 21:21–21:30 | **收官** | 感谢 · 次日跟单预告 · 意向金 7 天可退再次声明 | 「没想清楚的别冲动——意向金 30 天可退，规则保护犹豫的人。」 |

### 直播后 24 小时（跟单流程）

| 时间 | 动作 |
| --- | --- |
| 当晚 | 签约数据截图发朋友圈（真实成交）+ 未付款意向者一对一私信 |
| +2h | 意向金持有者专场群：答疑 + 签约通道二次开放 |
| +24h | 首日战报海报（成交数/剩余席位）+ 第一批创始编号公示 |

## 三、会前准备清单

| 类别 | 物料/动作 | 截止 |
| --- | --- | --- |
| 物料 | 品牌片 90 秒 · 直播封面 · 价格公示页（大屏演示版） · 签约流程图 · 战报海报模板 | D-3 |
| 协议 | 意向金协议（法务复核毕）·《代理合作协议》（签署版就绪） | D-3 |
| 系统 | 对公账户 · 收款凭证自动开具 · 签约通道（小程序/H5）压测 | D-2 |
| 彩排 | 全流程带妆彩排 1 次 + AI 创始人亮相技术彩排 2 次 | D-1 |
| 预热 | 一姐朋友圈 7 天预热序列 · 意向金持有者定向通知（短信+私域） | D-7 起 |

## 四、Q&A 异议库（现场五问 · 合规口径）

| 问题 | 回应口径 |
| --- | --- |
| 能赚多少钱？ | 「不承诺收益。模型是摆出来的（回本周期表），你的结果取决于你的圈子质量和投入。我们承诺的是：价格、名额、规则真实公示，分账不打折。」 |
| 是不是拉人头？ | 「三个区别：学员 0 元可学完、代理与总部直签、结算永远一层——市代不碰团长的钱。欢迎截图监督。」 |
| 1 折会不会太便宜，后面还有吗？ | 「500 席卖完就是 2.4 万，再往后 3.6 万直到 12 万——阶梯挂在公示页，不设例外。」 |
| 意向金现在交还来得及吗？ | 「来得及，但 1 折名额按到账时间排序，每分钟都有人在交——你唯一的风险是犹豫，因为意向金 30 天可退。」 |
| 没经验能做吗？ | 「团长档就是给没经验的人设计的：总部全包 + AI 老师陪跑 + 30 天跑通再升级。1,000 元上车卡，先验证再决定。」 |

## 五、数据目标与复盘指标

| 指标 | 目标 | 数据来源 |
| --- | --- | --- |
| 直播观看 | ≥3,000 人 | 平台后台 |
| 意向金池（累计） | ≥800 人 | 意向金管理表 |
| 首日签约 | **100 单**（市代+团长合计） | 签约通道 |
| 首日 GMV | 市代 ≥50 单×1.2 万 = 600 万+ | 对公流水 |
| 24h 转化率 | 意向金→签约 ≥30% | 后台看板 |
| 复盘会 | D+2 复盘：漏斗逐层分析（观看→意向→签约） | 全员 |

## 六、合规红线（现场纪律）

1. 全程不出现「卡位/躺赚/下级/代理分成/团队收益/月入 X 万/保证回本」；
2. 回本周期表述必须带「模型测算，非承诺」限定语；
3. 签约数、剩余席位播报必须为后台实时真实数字；
4. 意向金可退规则主动讲两遍（开闸时+收官时）；
5. AI 创始人「上线」亮相时屏幕角标注明「AI 数字人」。

    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
