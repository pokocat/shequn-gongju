<script type="text/markdown" id="mdsrc"># 协议法务复核清单 V1（律师问题清单）

> 执行：W1-4 AI 工作包 · 2026-09-18
> 复核对象：《创始席位意向金协议 V1》《代理合作协议 V1（四级分层）》及价格公示页
> 用途：携带本清单咨询律师，逐项要求书面结论后再启用协议

---

## 一、命门问题：特许经营三要素对照（优先级 P0）

《商业特许经营管理条例》三要素，逐项对照我方体系：

| 要素 | 条例要求 | 我方现状 | 命中 |
| --- | --- | --- | --- |
| ① 拥有经营资源 | 注册商标/企业标志/专利/专有技术 | 主理人公社/One&Co 商标**送检中未注册**；课程/SOP 属专有技术 | ⚠️ 部分命中 |
| ② 许可被特许人使用 | 合同形式授权 | 代理协议授予品牌使用+区域权益 | ✅ 命中 |
| ③ 统一经营模式+付费 | 统一模式并收取费用 | 四级代理统一 SOP/分账规则+1-12 万费用 | ✅ 命中 |

**若被认定为商业特许经营**：需「两店一年」（两家直营店+满一年）+ 商务部备案——**新公司不满足，招商即违规**，罚款 1-10 万+协议可撤销。

**问律师**：
1. 我方协议措辞（合作推广/服务采购/区域合作伙伴）能否有效区别于特许经营？关键改写点在哪几条？
2. 「商标未注册先授权」是否本身就构成风险？是否应等商标受理后（TM 标）再签区域授权？
3. 若必须走特许经营路径：以「海南女王城堡」（2019 年成立，满年限）作为招商主体是否可行？利弊？

## 二、意向金协议复核要点（P1）

| 条款 | 问题 |
| --- | --- |
| 2.1 优先购买资格 | 「到账排序锁定 1 折资格」的法律性质——是预约合同还是意向金收据？违约后果如何写最稳？ |
| 3.x 退款时效 | 「30 天内未签约、7 个工作日全额退」——与《民法典》定金规则的冲突？建议改「意向金（非定金）」表述是否已到位？ |
| 电子签 | 电子合同效力（如 e签宝/法大大）对本案是否足够？ |
| 涨价联动 | 价格公示页「售罄即涨」构成要约还是要约邀请？跳档承诺的效力？ |

## 三、代理合作协议复核要点（P1）

| 条款 | 问题 |
| --- | --- |
| 1.4 卡位期 | 「1-3 折签约=授权受限+区域意向锁定 6 个月」——意向锁定（非独家）期间的违约责任是否对称？ |
| 3.x 区域规则 | 市代「一城 3 席」非独家、县代「一区一位」独家——独家条款的边界（品类独家？渠道独家？期限？）如何写防滥用 |
| 4.2 团队计酬红线 | 「下级业绩抽成即解约」条款——表述强度是否足以隔离多级分销认定（《禁止传销条例》三级计酬红线）？团长→县代→市代三层结构+推荐费是否安全？ |
| 6.1 冷静期 | 「3 天无条件解约退款」与已开始交付的服务如何折算？ |
| 4.3 服务年卡 | 与代理资格解绑的表述是否彻底（防止「变相入门费」认定）？ |
| 收款条款 | 对公收款主体与协议甲方一致性；随心付 50% 月结的合同依据（补充协议 or 分账条款） |

## 四、关联物料复核（P2）

1. **价格公示页**：「不承诺投资回报」免责声明位置与充分性；回本模型的「模型测算非承诺」限定是否够；
2. **招商手册/PPT**：女王城堡历史数据（25 万女性）的引用是否需留存佐证材料清单；
3. **教育资质**：线上 AI 课程（非学科类）是否需要办学许可证/ICP 备案/网络文化经营许可？（一般非学科不需要办学许可，但需 ICP+可能的教育移动应用备案）

## 五、给律师的交付包

| 材料 | 文件 |
| --- | --- |
| 协议两份 | 20260917_创始席位意向金协议_V1 · 20260917_代理合作协议_V1_四级分层 |
| 商业模式说明 | 20260917_招商运营总蓝图_V1（内部版，重点看四级结构与分账） |
| 收款方案 | 20260918_主体与收款落地方案_V1 |
| 本清单 | 逐项要求书面结论 |

## 六、预算与时限建议

- 咨询+修订：合同律师 5,000-15,000（两份协议+清单结论）；
- 时限：本周内完成首次咨询（意向金协议 W2 蓄水前必须定稿）；
- 风险底线：**律师未出特许经营结论前，代理合作协议不对外签署**（意向金协议风险低可先行）。

<script>
// 硬编码文件名（由生成脚本写入）
document.getElementById('fname').textContent = '20260918_协议法务复核清单_V1.md';
document.body.classList.add('design');
document.getElementById('plainLink').href = '20260917_文档阅读器.html?file=' + encodeURIComponent('20260918_协议法务复核清单_V1.md');

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
