<script type="text/markdown" id="mdsrc"># 意向金蓄水 SOP V1（目标 ≥800 人）

> 执行：W2-3 AI 工作包 · 2026-09-18
> 目标：W2 结束时意向金名单 ≥800 人（降级线 ≥500）
> 意向金：1,000 元/人 · 30 天可退 · 锁 1 折优先资格（到账排序）

---

## 一、800 人渠道拆解（缺口分配）

| 渠道 | 目标 | 打法 | 依赖 |
| --- | --- | --- | --- |
| 女王城堡老用户 | **300** | 陈彬彬亲发信+老代理名单唤醒 | 历史通讯录 |
| 冷启动视频导流 | 200 | 3 条视频评论区+私信「上线」承接 | W2-1 |
| 种子团长私域 | 150 | 5 团长×30 人接龙预热 | W2-2 |
| 异业合作名单 | 100 | 商会/行业协会/同乡会资源置换 | 1姐人脉 |
| 直播间沉淀 | 50 | 冷启动期 2 场直播+尾场预告 | 视频号 |

## 二、老用户唤醒信（300 人主战场·一姐亲发）

> 「我是陈彬彬。十年前你在我的群里，我们做过女王城堡。这十年我沉了下去，现在带着 AI 回来——主理人公社，教普通人开一家一人公司。第一波只对老姐妹开放：1 折创始席位，1,000 意向金锁定，30 天可退。我知道你被伤过，所以这次：**所有规则公示、钱走对公、随时可退。**想回来的，回『回来』。」

要点：认怂式信任重建（承认被伤过）+ 三重安全垫。

## 三、意向金话术树（含异议库）

```
触达 → 「王炸社 1 折创始批，1,000 意向金锁位，30 天可退」
  ├─「什么项目？」→ 发招商手册链接 +「看完回我，15 分钟语音讲透」
  ├─「1,000 也是钱」→ 「30 天可退+全额抵扣。你买的是 30 天观察权：
  │    看得懂我们再深谈，看不懂退钱走人，你零损失。」
  ├─「是不是拉人头？」→ 「三个区别：①席位只有 1,000 个，卖完就停，
  │    不靠人头扩张；②我们不承诺躺赚，教你做一人公司；
  │    ③规则全部公示，你可以截图监督。」
  ├─「等等再说」→ 「席位按到账排序，1 折 500 席卖完即止。
  │    你等的不是时间，是涨价后的 2 折。」
  └─成交 → 对公/收款码 + 凭证截图 + 意向金协议电子签
```

## 四、每日播报模板（晚 21:30 群发+朋友圈）

> 【王炸社·蓄水日报 · 第 X 天】
> 今日新增意向金 **X** 人，累计 **X/800**。
> 最新席位排序：第 **X** 位（明天 20:00 更新）。
> 距 1 折开放：**X** 天。
> ——规则不变：30 天可退 · 到账排序 · 售罄即涨。

**播报纪律**：数字必须真实（后台台账截图留底）；「新增 0 人」照发（真实感本身就是信任）。

## 五、漏斗监控表（每日 22:00 复盘）

| 环节 | 今日 | 转化率 | 目标线 |
| --- | --- | --- | --- |
| 触达人数 | __ | — | 日均 150 |
| 回复人数 | __ | ≥40% | 日均 60 |
| 深聊（发手册） | __ | ≥50% | 日均 30 |
| 意向金到账 | __ | ≥20% | **日均 57** |

缺口预警：连续 2 天日均 <40 人 → 加启动直播场次+团长拉群加权。

## 六、风控三线

1. **退款响应**：任何退款请求 24h 内原路退（SLA 协议 7 日内，实际争取 1 日）——退款速度是最好的招商广告；
2. **数字真实**：日报/排序/剩余席位全部后台台账单源输出（看板字段表已建）；
3. **话术红线**：不承诺收益、不催「不交就没机会」（用排序事实代替威胁）、公开退款示例。

## 七、W2 每日节奏

| 日 | 主动作 | 播报重点 |
| --- | --- | --- |
| D1 | 老用户信首发（300 人分 3 批） | 老姐妹回归位 |
| D2 | 团长接龙开闸 + 冷启动片 2 导流 | 私域进场 |
| D3 | 异业名单启动 + 晚直播 1 场 | 直播沉淀 |
| D4 | 话术树全渠道轮转 + 复盘调优 | 转化率 |
| D5 | 晚直播 2（1 折规则讲解专场） | 直播间转化 |
| D6 | 缺口冲刺（按漏斗短板加权） | 倒计时 |
| D7 | 达标判定：≥800 开跑 / ≥500 降级 / 其他顺延 | 复盘报告 |

<script>
// 硬编码文件名（由生成脚本写入）
document.getElementById('fname').textContent = '20260918_意向金蓄水SOP_V1.md';
document.body.classList.add('design');
document.getElementById('plainLink').href = '20260917_文档阅读器.html?file=' + encodeURIComponent('20260918_意向金蓄水SOP_V1.md');

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
</script>
