<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三级战略树预览</title>
<style>
:root{--ink:#332719;--muted:#8a7860;--paper:#f6f0e5;--line:#d9c7a7;--gold:#b4883c;--deep:#6b4d25;--green:#55725a;--red:#ae604b;--blue:#5e7187}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 20% 0,#fffaf0 0,#f6f0e5 44%,#eadfce 100%);font-family:"PingFang SC","Microsoft YaHei",sans-serif} .shell{max-width:1500px;margin:auto;padding:28px 34px 44px}.eyebrow{font-size:11px;letter-spacing:.25em;color:var(--gold);font-weight:800}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:10px 0 24px}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:36px;letter-spacing:.04em;margin:0 0 8px}.hero p{margin:0;color:var(--muted);font-size:14px}.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.legend span{border:1px solid var(--line);background:#fffaf2;border-radius:99px;padding:7px 11px;font-size:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--gold)}.legend .l2 i{background:var(--blue)}.legend .l3 i{background:var(--green)}.panel{background:rgba(255,252,245,.82);border:1px solid #e1d2b9;border-radius:18px;box-shadow:0 18px 45px rgba(82,56,23,.08);overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #eadfce}.crumb{font-size:13px;color:var(--muted)}.crumb b{color:var(--deep)}.tools{display:flex;gap:7px}.tools button{border:1px solid var(--line);background:#fffaf2;border-radius:7px;padding:7px 12px;color:var(--deep);font-weight:700;cursor:pointer}.tools button.active,.tools button:hover{background:#f3e7cb;border-color:#b9904d}.canvas{position:relative;min-height:680px;overflow:auto;padding:32px 24px 48px}.tree{min-width:1120px;position:relative}.row{display:flex;justify-content:center;gap:18px;position:relative}.node{position:relative;width:178px;min-height:86px;border:1px solid var(--line);border-radius:13px;background:#fffdf8;padding:13px 14px;box-shadow:0 8px 18px rgba(75,51,23,.08);cursor:pointer;transition:.16s}.node:hover{transform:translateY(-3px);box-shadow:0 14px 24px rgba(75,51,23,.14)}.node.selected{outline:2px solid var(--gold);outline-offset:3px}.node small{display:block;color:var(--muted);font-size:10px;margin-bottom:6px;letter-spacing:.08em}.node strong{font-size:15px}.node em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:7px;line-height:1.4}.n-camp{width:260px;min-height:105px;background:#f8eed8;border-color:#c69b51}.n-type{background:#f4f0e9}.n-platform{background:#f1f5f5;border-color:#aebfc4}.badge{position:absolute;right:10px;top:10px;border-radius:99px;font-size:10px;padding:3px 6px;background:#e8f1e7;color:var(--green)}.badge.warn{background:#fae9df;color:var(--red)}.connector{height:54px;position:relative}.connector:before{content:"";position:absolute;left:50%;top:0;height:54px;border-left:2px solid #ccb487}.split{position:absolute;left:calc(50% - 220px);right:calc(50% - 220px);top:26px;border-top:2px solid #ccb487}.children{display:flex;justify-content:center;gap:28px;position:relative}.children:before{content:"";position:absolute;top:-18px;left:calc(50% - 220px);right:calc(50% - 220px);border-top:2px solid #ccb487}.children .node:before{content:"";position:absolute;top:-20px;left:50%;height:20px;border-left:2px solid #ccb487}.type-zone{margin:34px auto 0;width:1120px;padding:18px;border:1px dashed #d8c39b;border-radius:16px;background:rgba(255,250,240,.55)}.type-zone h3{font-family:Georgia,"Songti SC",serif;margin:0 0 13px;font-size:16px;color:var(--deep)}.account-grid{display:flex;gap:12px;flex-wrap:wrap}.account{width:190px;min-height:105px}.account em{font-size:10px}.fold-note{text-align:center;color:var(--muted);font-size:12px;margin:34px 0 0}.detail{display:none;margin-top:18px;padding:18px 22px;border-top:1px solid #eadfce;background:#fffaf1}.detail.show{display:flex;justify-content:space-between;gap:24px}.detail h3{margin:0 0 7px;font-family:Georgia,"Songti SC",serif}.detail p{margin:4px 0;color:var(--muted);font-size:13px}.metric{min-width:190px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric div{padding:10px;border:1px solid #eadfce;border-radius:9px;background:#fff}.metric b{display:block;font-size:18px;color:var(--deep)}.metric span{font-size:10px;color:var(--muted)}.hint{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body><main class="shell"><div class="eyebrow">ACCOUNT MATRIX / STRATEGIC TREE</div><div class="hero"><div><h1>三级战略树形图</h1><p>先看整个账号类型布局，再下钻平台数量，最后查看每一个旗下账号及其关联信息。</p></div><div class="legend"><span><i></i>战略层</span><span class="l2"><i></i>平台层</span><span class="l3"><i></i>账号层</span></div></div><section class="panel"><div class="toolbar"><div class="crumb" id="crumb">当前视图：<b>战略总览</b></div><div class="tools"><button class="active" onclick="showLevel(1,this)">战略总览</button><button onclick="showLevel(2,this)">平台数量</button><button onclick="showLevel(3,this)">账号明细</button></div></div><div class="canvas"><div class="tree" id="tree"></div><div class="hint">点击任意节点进入下一层；节点之间的关系线表示账号类型、平台和具体账号的归属关系。</div></div><div class="detail" id="detail"><div><h3 id="detailTitle">节点详情</h3><p id="detailText"></p></div><div class="metric"><div><b id="detailCount">—</b><span>当前数量</span></div><div><b id="detailQuota">—</b><span>预设数量</span></div></div></div></section></main>
<script>
const data=[{name:'官方核心',desc:'品牌统一表达、权威背书与主阵地沉淀',quota:21,types:[{name:'品牌官方号',quota:6,platforms:[{name:'视频号',count:2,accounts:['品牌官方主号','品牌活动号']},{name:'公众号',count:1,accounts:['官方服务号']}]},{name:'创始人IP',quota:5,platforms:[{name:'视频号',count:1,accounts:['创始人观点号']},{name:'小红书',count:1,accounts:['创始人生活号']}]}]},{name:'代理赋能',desc:'为代理商提供工具、内容、培训和转化支持',quota:10,types:[{name:'代理工具箱',quota:4,platforms:[{name:'公众号',count:1,accounts:['代理工具箱']},{name:'视频号',count:0,accounts:[]}]},{name:'培训教练号',quota:3,platforms:[{name:'抖音',count:1,accounts:['培训教练号']}]}]},{name:'市场推广',desc:'扩大声量、覆盖人群并承接市场转化',quota:17,types:[{name:'行业内容号',quota:5,platforms:[{name:'抖音',count:2,accounts:['行业趋势号','案例拆解号']},{name:'知乎',count:1,accounts:['专业问答号']}]},{name:'区域推广号',quota:6,platforms:[{name:'小红书',count:1,accounts:['华东区域号']},{name:'视频号',count:0,accounts:[]}]}]},{name:'代理共建',desc:'与代理伙伴共同孵化区域和个人影响力',quota:15,types:[{name:'代理IP号',quota:8,platforms:[{name:'抖音',count:2,accounts:['华南代理IP','华北代理IP']},{name:'视频号',count:1,accounts:['代理伙伴号']}]},{name:'城市社群号',quota:5,platforms:[{name:'公众号',count:1,accounts:['城市社群号']}]}]}];
let level=1;let selected=null;
function totalType(t){return t.platforms.reduce((n,p)=>n+p.count,0)}
function node(cls,eyebrow,title,desc,count,quota,key){let status=count>=quota?'满额':count?'进行中':'待建设';return `<div class="node ${cls}" data-key="${key}" onclick="selectNode('${key}')"><small>${eyebrow}</small><strong>${title}</strong><em>${desc||''}</em><span class="badge ${count<quota?'warn':''}">${count}/${quota} ${status}</span></div>`}
function showLevel(next,btn){level=next;document.querySelectorAll('.tools button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('crumb').innerHTML='当前视图：<b>'+(['','战略总览','平台数量','账号明细'][level])+'</b>';render()}
function render(){let html='';data.forEach((camp,ci)=>{let campCount=camp.types.reduce((n,t)=>n+totalType(t),0);html+=`<div class="row">${node('node n-camp','战略层',camp.name,camp.desc,campCount,camp.quota,'c'+ci)}</div>`;if(level>=2){html+='<div class="connector"><span class="split"></span></div><div class="children">';camp.types.forEach((t,ti)=>{let c=totalType(t);html+=node('node n-type','账号类型',t.name,'点击查看旗下平台分布',c,t.quota,'t'+ci+'-'+ti)});html+='</div>'}if(level>=3){camp.types.forEach((t,ti)=>{html+='<div class="connector"><span class="split"></span></div><div class="children">';t.platforms.forEach((p,pi)=>{html+=node('node n-platform','平台层',p.name,'点击查看具体账号',p.count,p.count+Math.max(0,p.count?0:1),'p'+ci+'-'+ti+'-'+pi)});html+='</div>';html+='<div class="type-zone"><h3>'+t.name+' · 旗下账号</h3><div class="account-grid">';t.platforms.forEach((p,pi)=>p.accounts.forEach((a,ai)=>{html+=node('node account','账号层',a,p.name+'｜关联 '+t.name,1,1,'a'+ci+'-'+ti+'-'+pi+'-'+ai)}));html+='</div></div>'})}});document.getElementById('tree').innerHTML=html}
function selectNode(key){selected=key;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.key===key));let text=key[0]==='c'?'战略层：查看该阵营的总体定位与完成度':key[0]==='t'?'账号类型：查看旗下平台数量与缺口':key[0]==='p'?'平台层：查看该平台下的账号数量':'账号层：查看具体账号、平台与所属账号类型';document.getElementById('detailTitle').textContent='已选择节点';document.getElementById('detailText').textContent=text+'。关系线向上连接到所属父级，向下连接到旗下子级。';document.getElementById('detailCount').textContent='已关联';document.getElementById('detailQuota').textContent='可追溯';document.getElementById('detail').classList.add('show')}
render();
</script></body></html>
