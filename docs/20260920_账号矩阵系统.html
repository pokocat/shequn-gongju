<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号矩阵系统 · 主理人公社</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f3ea;color:#4a443b;min-height:100vh}
.topbar{background:linear-gradient(135deg,#c9a05c,#b98a2f);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:.04em}
.back{background:rgba(255,255,255,.2);border:none;color:#fff;padding:7px 16px;border-radius:16px;cursor:pointer;font-size:12px;font-weight:700}
.back:hover{background:rgba(255,255,255,.3)}
.tabs{display:flex;gap:4px;padding:12px 24px;background:#fff;border-bottom:1px solid #eadfce}
.tab{padding:8px 18px;font-size:13px;font-weight:700;color:#8d8577;border-radius:18px;cursor:pointer;transition:.15s;background:transparent}
.tab:hover{background:#f7f0e0}
.tab.on{background:linear-gradient(135deg,#c9a05c,#b98a2f);color:#fff}
.panel{display:none;padding:20px 24px}
.panel.on{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* 战略导览条 */
.camp-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.camp-chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:#fff;border:1.5px solid #eadfce;cursor:pointer;transition:.15s;font-size:12px;font-weight:700}
.camp-chip:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.camp-chip.on{color:#fff;border-color:transparent}
.camp-dot{width:10px;height:10px;border-radius:50%}
/* 思维导图 */
.mindmap{background:#fff;border:1px solid #eadfce;border-radius:16px;padding:30px;overflow:auto;min-height:500px}
.mm-center{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#c9a05c,#b98a2f);color:#fff;padding:16px 28px;border-radius:30px;font-size:16px;font-weight:800;box-shadow:0 4px 14px rgba(201,160,92,.3);white-space:nowrap}
.mm-camp{margin-top:26px;border:1.5px solid #eadfce;border-radius:14px;overflow:hidden;page-break-inside:avoid}
.mm-camp-head{padding:12px 18px;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.mm-camp-head .cm-sub{font-size:11px;font-weight:600;opacity:.9}
.mm-camp-body{padding:16px 18px;background:#fff}
.mm-group{margin-bottom:14px}
.mm-group:last-child{margin-bottom:0}
.mm-group-title{font-size:12px;font-weight:800;color:#8a6d2f;margin-bottom:8px;padding-left:10px;border-left:3px solid #d4c4a0;line-height:1.4}
.mm-group-title .gn{display:inline-block;background:#fbf6ea;color:#a3762a;font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;margin-left:6px}
.mm-items{display:flex;flex-wrap:wrap;gap:8px;padding-left:14px;align-items:flex-start}
.mm-node{background:#faf7f0;border:1px solid #eee5d3;border-radius:8px;padding:7px 11px 7px 9px;cursor:pointer;transition:.12s;font-size:12px;display:inline-flex;align-items:center;gap:6px;border-left:3px solid #d4c4a0;position:relative}
.mm-node:hover{background:#f7f0e0;border-color:#d4c4a0;transform:translateY(-1px)}
.mm-node.active{background:#fdf6ec;border-color:#c9a05c;font-weight:700;color:#8a6d2f}
.mm-node.lvl-1{border-left-color:#c9a05c;background:#fdf6ec;font-weight:700;box-shadow:0 2px 6px rgba(201,160,92,.12)}
.mm-node.lvl-2{border-left-color:#7a9b5a}
.mm-node.lvl-3{border-left-color:#4a7a9b}
.mm-node.lvl-4{border-left-color:#9b7a5a}
.mm-node.lvl-5{border-left-color:#8d8577}
.mm-node.lvl-6{border-left-color:#b85a9b}
.mm-lvl{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;color:#fff}
.mm-rel{font-size:9px;color:#a3762a;font-weight:700;background:#fbf6ea;padding:1px 5px;border-radius:3px}
.mm-pos{font-size:10px;color:#a39b8e;margin-left:4px}
/* 层级图例 */
.level-legend{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.level-legend .ll{font-size:11px;font-weight:700;color:#8d8577;margin-right:4px}
.level-legend span.lg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff}
/* 层级承接关系总览 */
.lvl-flow{background:linear-gradient(135deg,#fdf6ec,#fbf3df);border:1px solid #eadfce;border-radius:12px;padding:16px 18px;margin-bottom:18px}
.lvl-flow h4{font-size:12px;font-weight:800;color:#a3762a;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.lvl-flow h4::before{content:'';width:3px;height:13px;background:#c9a05c;border-radius:2px}
.lvl-chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lvl-step{display:flex;align-items:center;gap:6px}
.lvl-badge{font-size:11px;font-weight:800;color:#fff;padding:3px 9px;border-radius:6px;white-space:nowrap}
.lvl-desc{font-size:10px;color:#6b6154;font-weight:600;line-height:1.3;max-width:90px}
.lvl-arrow{color:#c9a05c;font-weight:800;font-size:14px}
/* 账号清单层级深度条 */
.lvl-bar{display:inline-block;width:4px;height:14px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* 层级树形图 */
.tree-scroll{background:#fff;border:1px solid #eadfce;border-radius:14px;padding:0;overflow:hidden;min-height:620px;position:relative}
.tree-viewport{position:relative;width:100%;height:620px;overflow:auto}
.tree-stage-inner{position:relative;transform-origin:0 0;transition:transform .18s ease;width:max-content}
.tree-wrap{position:relative;padding:24px;min-width:100%}
/* 固定比例控制 */
.zoom-ctrl{position:absolute;top:14px;right:14px;z-index:30;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.95);border:1px solid #eadfce;border-radius:8px;padding:5px 7px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom-ctrl button{height:28px;min-width:38px;border:1px solid #eadfce;background:#fff;border-radius:6px;cursor:pointer;font-size:11px;font-weight:800;color:#8a6d2f;padding:0 7px;transition:.12s}
.zoom-ctrl button:hover,.zoom-ctrl button.on{background:#fbf6ea;border-color:#c9a05c;color:#8a6d2f}
.zoom-ctrl .z-label{font-size:10px;font-weight:800;color:#8d8577;padding-right:2px}
.zoom-ctrl .z-info{font-size:10px;font-weight:800;color:#a3762a;text-align:center;padding:0 2px;min-width:34px}
/* 空缺位节点 */
.tree-node.empty{border:1.5px dashed #d4c4a0;background:#fafafa;opacity:.8}
.tree-node.empty .tn-name{color:#a39b8e;font-style:italic}
.tree-node.empty .tn-fill{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#c9a05c,#b98a2f);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;margin-top:5px;cursor:pointer}
.tree-node.empty .tn-fill:hover{box-shadow:0 2px 8px rgba(201,160,92,.4)}
/* 配额徽章 */
.quota-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;margin-left:8px}
.quota-badge.full{background:#e8f0d4;color:#6b7a35}
.quota-badge.partial{background:#fbf6ea;color:#a3762a}
.quota-badge.empty{background:#fde8e8;color:#c35a3a}
/* 授权登录弹窗 */
.auth-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;align-items:center;justify-content:center}
.auth-mask.show{display:flex}
.auth-box{background:#fff;border-radius:14px;padding:22px;width:360px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.auth-box h3{font-size:15px;font-weight:800;color:#4a443b;margin-bottom:6px}
.auth-box .ab-sub{font-size:11px;color:#8d8577;margin-bottom:14px}
.auth-platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.auth-pf{border:1px solid #eadfce;border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;transition:.12s;font-size:11px;font-weight:700;color:#4a443b}
.auth-pf:hover{border-color:#c9a05c;background:#fbf6ea}
.auth-pf.on{border-color:#c9a05c;background:#fdf6ec;color:#a3762a}
.auth-input{width:100%;padding:9px 12px;border:1px solid #eadfce;border-radius:8px;font-size:13px;margin-bottom:10px;box-sizing:border-box}
.auth-input:focus{outline:none;border-color:#c9a05c}
.auth-btns{display:flex;gap:8px}
.auth-btns button{flex:1;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.auth-btns .ab-cancel{background:#f0ece4;color:#8d8577}
.auth-btns .ab-ok{background:linear-gradient(135deg,#c9a05c,#b98a2f);color:#fff}
.tree-camp-block{margin-bottom:30px}
.tree-camp-block:last-child{margin-bottom:0}
.tree-camp-title{font-size:13px;font-weight:800;color:#fff;padding:8px 16px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;margin-bottom:16px}
.tree-camp-title .tct-sub{font-size:10px;font-weight:600;opacity:.85}
.tree-stage{position:relative;margin-left:8px}
.tree-node{position:absolute;background:#fff;border:1.5px solid #eadfce;border-radius:10px;padding:8px 12px;width:150px;box-sizing:border-box;cursor:pointer;transition:.15s;z-index:2}
.tree-node:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1);z-index:5}
.tree-node.lvl-1{border-color:#c9a05c;background:linear-gradient(135deg,#fdf6ec,#fff);box-shadow:0 3px 10px rgba(201,160,92,.18)}
.tree-node.lvl-2{border-left:3px solid #7a9b5a}
.tree-node.lvl-3{border-left:3px solid #4a7a9b}
.tree-node.lvl-4{border-left:3px solid #9b7a5a}
.tree-node.lvl-5{border-left:3px solid #8d8577}
.tree-node.lvl-6{border-left:3px solid #b85a9b}
.tree-node .tn-name{font-size:12px;font-weight:800;color:#4a443b;line-height:1.3}
.tree-node .tn-plat{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;margin-top:4px}
.tree-node .tn-lvl{display:inline-block;font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;color:#fff;margin-top:4px;margin-left:4px}
.tree-node .tn-pos{font-size:10px;color:#a39b8e;margin-top:3px;line-height:1.3}
.tree-node .tn-desc{font-size:9px;color:#6b6154;margin-top:3px;line-height:1.35;max-height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;border-top:1px dashed #eee5d3;padding-top:3px}
.tree-node .tn-tip{display:none;position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;width:220px;background:#fff;border:1px solid #c9a05c;border-radius:8px;padding:10px 12px;font-size:11px;color:#4a443b;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:20;pointer-events:none}
.tree-node:hover .tn-tip{display:block}
.tree-node .tn-tip .tt-title{font-weight:800;color:#a3762a;margin-bottom:4px;font-size:11px}
.tree-node .tn-tip .tt-loc{color:#8a6d2f;font-weight:700;margin-bottom:3px}
.tree-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.tree-svg path,.tree-svg line{stroke:#d4c4a0;stroke-width:1.5;fill:none;transition:stroke .15s}
.tree-svg path.lvl-1,.tree-svg line.lvl-1{stroke:#c9a05c;stroke-width:2}
.tree-svg path.lvl-2,.tree-svg line.lvl-2{stroke:#7a9b5a}
.tree-svg path.lvl-3,.tree-svg line.lvl-3{stroke:#4a7a9b}
.tree-svg path.lvl-4,.tree-svg line.lvl-4{stroke:#9b7a5a}
.tree-svg path.lvl-5,.tree-svg line.lvl-5{stroke:#8d8577}
.tree-svg path.lvl-6,.tree-svg line.lvl-6{stroke:#b85a9b}
.tree-node.tree-strategy{border-color:#c9a05c;background:linear-gradient(135deg,#fdf6ec,#fff);box-shadow:0 3px 10px rgba(201,160,92,.18)}
.tree-node.tree-group{border-left:3px solid #7a9b5a;background:#fbfcf8}
.tree-node.tree-platform{border-left:3px solid #4a7a9b;background:#f8fbfc;min-height:56px;padding:8px 12px}
.tree-node.tree-platform .tn-count{margin-top:5px}
.tree-node.tree-group .tn-name,.tree-node.tree-platform .tn-name{font-size:13px}
.tree-node .tn-node-meta{display:inline-block;margin-top:6px;padding:2px 7px;border-radius:5px;background:#f0ece4;color:#8a8073;font-size:9px;font-weight:800}
.tree-node.tree-platform .tn-node-meta{background:#e8f0f5;color:#4a7a9b}
.tree-node.tree-account{border-left:3px solid #9b7a5a}
.tree-node .tn-count{display:inline-flex;font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;margin-top:5px;background:#f0ece4;color:#6b6154}
.tree-node .tn-expand{position:absolute;right:8px;bottom:7px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fbf6ea;color:#a3762a;font-size:12px;font-weight:800;border:1px solid #eadfce}
.tree-node.open .tn-expand{background:#a3762a;color:#fff;transform:rotate(45deg)}
.tree-guide{display:flex;align-items:center;gap:8px;margin:0 0 18px;padding:10px 12px;border:1px solid #eadfce;border-radius:10px;background:#fffcf6;color:#6b6154;font-size:11px;font-weight:700}
.tree-guide b{color:#a3762a}
.tree-guide .tg-arrow{color:#c9a05c}
.tree-legend{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tree-legend .tl{font-size:11px;font-weight:700;color:#8d8577;margin-right:4px}
.tree-legend span.tg{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;color:#fff}
/* 矩阵规划建议 */
.plan-box{margin-top:24px;background:linear-gradient(135deg,#fdf6ec,#fbf3df);border:1px solid #eadfce;border-radius:14px;padding:20px 22px}
.plan-box h3{font-size:14px;font-weight:800;color:#a3762a;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.plan-box h3::before{content:'';width:4px;height:16px;background:linear-gradient(180deg,#c9a05c,#b98a2f);border-radius:2px}
.plan-camps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.plan-card{background:#fff;border:1px solid #eadfce;border-radius:10px;padding:14px;position:relative;overflow:hidden}
.plan-card .pc-bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.plan-card .pc-title{font-size:12px;font-weight:800;color:#4a443b;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.plan-card .pc-title .pc-tag{font-size:9px;font-weight:800;color:#fff;padding:1px 7px;border-radius:5px}
.plan-card ul{list-style:none;padding:0;margin:0}
.plan-card li{font-size:11px;color:#6b6154;line-height:1.6;padding-left:14px;position:relative;margin-bottom:5px}
.plan-card li::before{content:'▸';position:absolute;left:0;color:#c9a05c;font-weight:800}
.plan-card li b{color:#4a443b}
.plan-summary{background:#fff;border:1px solid #eadfce;border-radius:10px;padding:14px 16px}
.plan-summary h4{font-size:12px;font-weight:800;color:#a3762a;margin-bottom:8px}
.plan-summary p{font-size:11px;color:#6b6154;line-height:1.7;margin-bottom:6px}
.plan-summary p b{color:#4a443b}
.plan-summary .ps-priority{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:4px;color:#fff;margin-left:6px}
.plan-summary .ps-high{background:#c35a3a}
.plan-summary .ps-mid{background:#c9a05c}
.plan-summary .ps-low{background:#7a9b5a}
/* 右侧详情 */
.detail{position:fixed;top:0;right:-420px;width:400px;height:100vh;background:#fff;border-left:1px solid #eadfce;box-shadow:-4px 0 20px rgba(0,0,0,.08);transition:right .3s;z-index:200;overflow-y:auto}
.detail.show{right:0}
.detail-head{padding:18px 20px;border-bottom:1px solid #eadfce;display:flex;align-items:center;justify-content:space-between}
.detail-head h3{font-size:16px;font-weight:800;color:#4a443b}
.detail-head .dh-camp{font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:5px;margin-top:4px;display:inline-block}
.detail-close{background:none;border:none;font-size:22px;color:#a39b8e;cursor:pointer}
.detail-body{padding:18px 20px}
.d-row{margin-bottom:14px}
.d-label{font-size:11px;font-weight:800;color:#a39b8e;letter-spacing:.05em;margin-bottom:5px}
.d-val{font-size:13px;color:#4a443b;font-weight:600;line-height:1.5}
.d-tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;margin-right:6px}
.d-tag.green{background:#e8f0d4;color:#6b7a35}
.d-tag.gold{background:#fbf6ea;color:#a3762a}
.d-tag.gray{background:#f0ece4;color:#a39b8e}
.d-tag.blue{background:#e0ebf5;color:#4a7a9b}
.d-tag.purple{background:#ede5f5;color:#7a5a9b}
/* 账号列表 */
.acct-table-wrap{background:#fff;border:1px solid #eadfce;border-radius:12px;overflow:hidden;overflow-x:auto}
.acct-table{width:100%;border-collapse:collapse;min-width:1200px}
.acct-table th{background:#f7f0e0;font-size:11px;font-weight:800;color:#8a6d2f;padding:10px 14px;text-align:left;letter-spacing:.04em;position:sticky;top:0}
.acct-table td{padding:10px 14px;font-size:12px;border-bottom:1px solid #f5efe2}
.acct-table tr:last-child td{border-bottom:none}
.acct-table tr:hover td{background:#fdf9f0}
.acct-table tr.camp-row td{background:#fdf6ec;font-size:12px;font-weight:800;color:#fff;padding:8px 14px;letter-spacing:.04em}
.acct-name{font-weight:700;color:#4a443b}
.acct-platform{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px}
.p-wechat{background:#e8f0d4;color:#6b7a35}
.p-xhs{background:#fde8ee;color:#c3272b}
.p-douyin{background:#fde8e8;color:#c3272b}
.p-bili{background:#e0ebf5;color:#4a7a9b}
.p-zhihu{background:#ede5f5;color:#7a5a9b}
.p-gzh{background:#fbf6ea;color:#a3762a}
.p-toutiao{background:#fde8d8;color:#c9722a}
.p-baijia{background:#d8e8f5;color:#2a5a9b}
.p-mini{background:#e8f0e8;color:#4a7a35}
/* 战略分布统计 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:#fff;border:1px solid #eadfce;border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#c9a05c}
.stat-card.blue::before{background:#4a7a9b}
.stat-card.green::before{background:#7a9b5a}
.stat-card.purple::before{background:#7a5a9b}
.stat-card .sn{font-size:26px;font-weight:800;color:#4a443b}
.stat-card .sl{font-size:12px;color:#8d8577;margin-top:4px}
.stat-card .sa{font-size:10px;color:#a39b8e;margin-top:2px;font-weight:700}
/* 阵营卡片 */
.camp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:20px}
.camp-card{background:#fff;border:1px solid #eadfce;border-radius:14px;padding:18px;position:relative;overflow:hidden}
.camp-card .cc-bar{position:absolute;left:0;top:0;right:0;height:4px}
.camp-card h3{font-size:15px;font-weight:800;color:#4a443b;margin-bottom:4px}
.camp-card .cc-desc{font-size:11px;color:#8d8577;margin-bottom:12px;line-height:1.5}
.camp-card .cc-stats{display:flex;gap:14px;margin-bottom:10px}
.camp-card .cc-stat .n{font-size:20px;font-weight:800}
.camp-card .cc-stat .l{font-size:10px;color:#a39b8e}
.camp-card .cc-groups{display:flex;flex-wrap:wrap;gap:5px}
.camp-card .cc-g{font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;background:#f7f0e0;color:#8a6d2f}
/* 引爆战略说明 */

// 获取某分组通过授权填充的账号列表
function getFilledByGroup(group){
 var f=loadFilled();
 var result=[];
 for(var k in f){
  var parts=k.split('|');
  if(parts.length===3&&parts[2]===group){
   result.push(f[k]);

 }
 return result;
}

function isFilled(a){

 var f=loadFilled();
 return !!f[a.platform+'|'+a.name+'|'+(a._group||'')];
}
// 统计分组填充情况
function groupFillStats(group,items){
 var quota=QUOTA[group]||items.length;
 var origFilled=items.filter(function(a){return isFilled(a)}).length;
 var authFilled=getFilledByGroup(group).length;
 var filled=origFilled+authFilled;
 return {filled:filled,quota:quota,empty:Math.max(0,quota-filled)};
}

function collectGroupAccounts(camp,group){
 var accounts=group.items.map(function(a){
  a._group=group.group;a._camp=camp.short;a._filled=isFilled(a);return a;
 });
 getFilledByGroup(group.group).forEach(function(a){
  a._group=group.group;a._camp=camp.short;a._filled=true;accounts.push(a);
 });
 return accounts;
}
function buildStrategicTree(camp){
 var campFilled=0,campQuota=0;
 var root={kind:'strategy',key:treeKey('c',camp.short),title:camp.name,subtitle:camp.desc,count:0,quota:0,color:camp.color,children:[]};
 camp.groups.forEach(function(group){
  var stats=groupFillStats(group.group,group.items);
  var accounts=collectGroupAccounts(camp,group);
  var groupKey=treeKey('g',camp.short,group.group);
  var groupNode={kind:'group',key:groupKey,title:group.group,subtitle:'',count:stats.filled,quota:stats.quota,color:'#7a9b5a',group:group,children:[]};
  campFilled+=stats.filled;campQuota+=stats.quota;
  if(treeExpanded[groupKey]){
   var platformMap={};
   accounts.forEach(function(a){
    if(!platformMap[a.platform])platformMap[a.platform]=[];
    platformMap[a.platform].push(a);
   });
   var occupied=accounts.length;
   var missing=Math.max(0,stats.quota-occupied);
   if(missing){
    platformMap['待授权']=[];
    for(var i=0;i<missing;i++)platformMap['待授权'].push({name:'空缺位'+(i+1),platform:'待授权',pos:'待授权登录',level:'L2 内容分发',status:'空缺',fans:'—',desc:'授权登录后填充该账号',_group:group.group,_camp:camp.short,_empty:true});
   }
   Object.keys(platformMap).forEach(function(platform){
    var platformKey=treeKey('p',camp.short,group.group,platform);
    var platformAccounts=platformMap[platform];
    var activeCount=platformAccounts.filter(function(a){return !a._empty&&isFilled(a)}).length;
    var platformNode={kind:'platform',key:platformKey,title:platform+' · '+platformAccounts.length,subtitle:'',count:activeCount,quota:platformAccounts.length,color:'#4a7a9b',group:group,children:[]};
    if(treeExpanded[platformKey]){
     platformNode.children=platformAccounts.map(function(a,index){
      return {kind:'account',key:treeKey('a',camp.short,group.group,platform)+'|'+index,title:a._empty?'空缺位':a.name,subtitle:a._empty?'点击授权登录':a.pos,count:a._empty?0:1,quota:1,color:LEVELCOLOR[a.level]||'#9b7a5a',acct:a,group:group,children:[]};
     });
    }
    groupNode.children.push(platformNode);
   });
  }
  root.children.push(groupNode);
 });
 root.count=campFilled;root.quota=campQuota;
 return root;
}
function leafCount(node){
 if(node.children.length===0)return 1;
 return node.children.reduce(function(sum,child){return sum+leafCount(child)},0);
}
function layoutTree(roots){
 var unitW=TREE_NODE_W+TREE_GAP;
 function assign(node,leftX,depth){
  var leaves=leafCount(node);
  node.width=leaves*unitW-TREE_GAP;
  node.x=leftX+node.width/2;
  node.y=TREE_TOP+depth*TREE_LEVEL_H;
  node.depth=depth;
  var nextX=leftX;
  node.children.forEach(function(child){
   assign(child,nextX,depth+1);
   nextX+=leafCount(child)*unitW;
  });
 }
 var currentX=0;
 roots.forEach(function(root){assign(root,currentX,0);currentX+=leafCount(root)*unitW});
}
function getBounds(roots){
 var minX=Infinity,maxX=-Infinity,maxY=-Infinity;
 function walk(node){
  minX=Math.min(minX,node.x);maxX=Math.max(maxX,node.x);maxY=Math.max(maxY,node.y);
  node.children.forEach(walk);
 }
 roots.forEach(walk);
 return {width:Math.max(TREE_NODE_W,maxX-minX+TREE_NODE_W),height:maxY+TREE_NODE_H+TREE_TOP};
}
function createTreeNode(node,camp,stage){
 var div=document.createElement('div');
 div.className='tree-node tree-'+node.kind+(treeExpanded[node.key]?' open':'')+(node.acct&&node.acct._empty?' empty':'');
 div.style.left=(node.x-TREE_NODE_W/2)+'px';div.style.top=node.y+'px';
 var name=document.createElement('div');name.className='tn-name';name.textContent=node.title;div.appendChild(name);
 if(node.kind==='strategy'){
  var strategy=document.createElement('div');strategy.className='tn-pos';strategy.textContent='整体账号类型布局';div.appendChild(strategy);
 }else if(node.kind==='group'){
  var groupMeta=document.createElement('div');groupMeta.className='tn-pos tn-node-meta';groupMeta.textContent='账号类型';div.appendChild(groupMeta);
 }else if(node.kind==='platform'){
  // 数量已合并到标题，不再渲染副标题
 }else if(node.acct&&node.acct._empty){
  var emptyPos=document.createElement('div');emptyPos.className='tn-pos';emptyPos.textContent=node.acct._group;
  var fill=document.createElement('div');fill.className='tn-fill';fill.textContent='授权登录填充';
  fill.onclick=function(event){event.stopPropagation();openAuth(null,node.acct._group,camp.short)};
  div.appendChild(emptyPos);div.appendChild(fill);
 }else if(node.acct){
  var pc=PCOLOR[node.acct.platform]||'p-gzh';
  var platform=document.createElement('span');platform.className='tn-plat '+pc;platform.textContent=node.acct.platform;div.appendChild(platform);
  var level=document.createElement('span');level.className='tn-lvl';level.style.background=LEVELCOLOR[node.acct.level]||'#8d8577';level.textContent=node.acct.level||'';div.appendChild(level);
  var position=document.createElement('div');position.className='tn-pos';position.textContent=node.acct.pos||'';div.appendChild(position);
  var description=document.createElement('div');description.className='tn-desc';description.textContent=node.acct.desc||'';div.appendChild(description);
 }
 if(node.kind!=='account'){
  var count=document.createElement('span');count.className='tn-count';count.textContent='已填 '+node.count+' / '+node.quota;div.appendChild(count);
  var expand=document.createElement('span');expand.className='tn-expand';expand.textContent='+';div.appendChild(expand);
  div.onclick=function(){toggleTreeNode(node.key)};
 }else if(node.acct&&!node.acct._empty){
  div.onclick=function(){showDetail(node.acct,camp)};
 }
 stage.appendChild(div);
 node.children.forEach(function(child){createTreeNode(child,camp,stage)});
}
function renderTree(){
 var wrap=document.getElementById('treeWrap');
 if(!wrap)return;
 wrap.innerHTML='';
 var guide=document.createElement('div');guide.className='tree-guide';
 guide.innerHTML='<b>战略阵营</b><span class="tg-arrow">→</span><b>账号类型</b><span class="tg-arrow">→</span><b>平台配置</b><span class="tg-arrow">→</span><b>账号详情</b>';
 wrap.appendChild(guide);
 CAMPS.forEach(function(camp){
  if(curTreeCamp!=='all'&&curTreeCamp!==camp.short)return;
  var block=document.createElement('div');block.className='tree-camp-block';
  var root=buildStrategicTree(camp);var roots=[root];layoutTree(roots);var bounds=getBounds(roots);
  var title=document.createElement('div');title.className='tree-camp-title';title.style.background=camp.color;
  var titleText=document.createTextNode('◆ '+camp.name+' ');title.appendChild(titleText);
  var sub=document.createElement('span');sub.className='tct-sub';sub.textContent=camp.groups.length+'种账号类型';title.appendChild(sub);
  var quota=document.createElement('span');quota.className='quota-badge '+(root.count>=root.quota?'full':root.count===0?'empty':'partial');quota.textContent='已填 '+root.count+' / '+root.quota;title.appendChild(quota);block.appendChild(title);
  var stage=document.createElement('div');stage.className='tree-stage';stage.style.width=bounds.width+'px';stage.style.height=bounds.height+'px';
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('class','tree-svg');svg.setAttribute('width',bounds.width);svg.setAttribute('height',bounds.height);svg.setAttribute('viewBox','0 0 '+bounds.width+' '+bounds.height);
  function drawLines(node){
   node.children.forEach(function(child){
    var x1=node.x,y1=node.y+TREE_NODE_H,x2=child.x,y2=child.y,midY=(y1+y2)/2;
    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('class','lvl-'+Math.min(6,child.depth+1));path.setAttribute('d','M '+x1+' '+y1+' L '+x1+' '+midY+' L '+x2+' '+midY+' L '+x2+' '+y2);svg.appendChild(path);drawLines(child);
   });
  }
  drawLines(root);stage.appendChild(svg);createTreeNode(root,camp,stage);block.appendChild(stage);wrap.appendChild(block);
 });
 renderPlanSuggestions(wrap);applyTreeTransform();
}

// 矩阵规划建议：基于数据分析给出策略建议
function renderPlanSuggestions(wrap){
 var box=document.createElement('div');box.className='plan-box';
 box.innerHTML='<h3>◆ 矩阵规划建议 · 基于当前账号体系的策略分析</h3>';
 // 按阵营分析
 var campCards=document.createElement('div');campCards.className='plan-camps';
 CAMPS.forEach(function(camp){
  var items=[];
  camp.groups.forEach(function(g){g.items.forEach(function(a){items.push(a)})});
  var running=items.filter(function(a){return a.status==='已运营'}).length;
  var preparing=items.filter(function(a){return a.status==='筹备中'}).length;
  var lvl1=items.filter(function(a){return a.level&&a.level.indexOf('L1')>=0}).length;
  var platforms=new Set(items.map(function(a){return a.platform})).size;
  var suggestions=[];
  if(preparing>0){suggestions.push('当前有 <b>'+preparing+'</b> 个账号筹备中，建议优先启动，形成完整声量')}
  if(lvl1===0){suggestions.push('缺少 <b>L1 核心主号</b>，建议设立阵营主阵地账号作为流量源头')}
  if(platforms<3){suggestions.push('仅覆盖 <b>'+platforms+'</b> 个平台，建议补充抖音/小红书等流量平台')}
  if(running>0&&items.length/running<0.8){suggestions.push('运营率不足 <b>80%</b>，建议集中资源提升已运营账号产出')}
  if(suggestions.length===0){suggestions.push('阵营结构完整，建议持续优化内容质量与互动率')}
  // 阵营定位建议
  var campAdvice={
   '官方':'强化 <b>双主阵地</b>（品牌号+创始人IP）联动，统一品牌叙事',
   '赋能':'素材号需保持 <b>日更频率</b>，确保代理有充足可搬运内容',
   '推广':'5类账号需 <b>差异化定位</b>，避免内容同质化竞争',
   '共建':'代理IP孵化需配套 <b>培训+激励</b>，提升代理自主产出能力'
  };
  suggestions.push(campAdvice[camp.short]||'');
  var card=document.createElement('div');card.className='plan-card';
  card.innerHTML='<div class="pc-bar" style="background:'+camp.color+'"></div>'
   +'<div class="pc-title"><span class="pc-tag" style="background:'+camp.color+'">'+camp.short+'</span>'+camp.name+'</div>'
   +'<ul>'+suggestions.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ul>';
  campCards.appendChild(card);
 });
 box.appendChild(campCards);
 // 全局优先级建议
 var summary=document.createElement('div');summary.className='plan-summary';
 summary.innerHTML='<h4>全域矩阵引爆 · 优先级行动建议</h4>'
  +'<p><b>① 补齐筹备账号</b><span class="ps-priority ps-high">高优先级</span><br>公益品牌号（万物有言/掌灯计划）、华南区域号、代理工具箱小程序尚在筹备，建议在项目启动前完成搭建，避免声量缺口。</p>'
  +'<p><b>② 强化L1-L2流量链路</b><span class="ps-priority ps-high">高优先级</span><br>3个L1核心主号（主理人公社/一姐/上线夜校）需保持周更3次以上，L2分发账号同步搬运，确保品牌声量持续输出。</p>'
  +'<p><b>③ 代理素材日更机制</b><span class="ps-priority ps-mid">中优先级</span><br>零售素材号（小红书/抖音/公众号）需建立日更素材库，代理直接搬运即可获客，降低代理执行门槛。</p>'
  +'<p><b>④ 市场推广5类差异化</b><span class="ps-priority ps-mid">中优先级</span><br>科普/测评/种草/IP/媒体5类账号需明确内容边界，科普做认知、测评做背书、种草抓流量、IP建人设、媒体铺广度。</p>'
  +'<p><b>⑤ 代理IP孵化SOP</b><span class="ps-priority ps-low">低优先级</span><br>为代理提供个人IP孵化SOP（定位→内容→涨粉→变现四步法），配合代理工具箱，实现代理自主造血裂变。</p>';
 box.appendChild(summary);
 wrap.appendChild(box);
}

function showDetail(a,camp){
 var pc=PCOLOR[a.platform]||'p-gzh';
 var st=a.status==='已运营'?'green':a.status==='筹备中'?'gold':'gray';
 var lvlColor=LEVELCOLOR[a.level]||'#8d8577';
 // 查找下级承接账号
 var children=[];
 CAMPS.forEach(function(c){c.groups.forEach(function(g){g.items.forEach(function(x){
  if(x.parent===a.platform||x.parent===a.name){children.push(x)}
 })})});
 // 构建层级链路（向上溯源）
 var chain=[];
 var cur=a;
 while(cur&&cur.parent){
  var found=null;
  CAMPS.forEach(function(c){c.groups.forEach(function(g){g.items.forEach(function(x){
   if(!found&&(x.platform===cur.parent||x.name===cur.parent)){found=x}
  })})});
  if(found){chain.unshift(found);cur=found}else{break}
 }
 document.getElementById('detailTitle').textContent=a.name;
 var dc=document.getElementById('detailCamp');
 dc.textContent=camp?camp.name:'';
 dc.style.background=camp?camp.color:'#8d8577';
 var chainHtml=chain.length?'<div style="font-size:11px;color:#8d8577;margin-top:6px;line-height:1.6">'
  +chain.map(function(p){return '<span style="color:#a3762a;font-weight:700">'+p.name+'·'+p.platform+'</span> <span style="color:#c9a05c">→</span> '}).join('')+'<span style="color:#4a443b;font-weight:800">当前</span></div>':'<span style="color:#a3762a;font-size:11px">★ 流量源头（顶级主号）</span>';
 var childHtml=children.length?'<div style="margin-top:6px">'+children.map(function(ch){
  var chLvlColor=LEVELCOLOR[ch.level]||'#8d8577';
  return '<span style="display:inline-block;margin:3px 4px 3px 0;padding:3px 9px;border-radius:6px;background:#f7f0e0;border-left:3px solid '+chLvlColor+';font-size:11px;font-weight:700;color:#4a443b">'+ch.name+'·'+ch.platform+' <span style="color:'+chLvlColor+';font-size:10px">'+(ch.level||'')+'</span></span>';
 }).join('')+'</div>':'<span style="color:#a39b8e;font-size:11px">无下级承接（末端账号）</span>';
 document.getElementById('detailBody').innerHTML=
  '<div class="d-row"><div class="d-label">所属阵营</div><div class="d-val"><span class="d-tag" style="background:'+(camp?camp.color:'#8d8577')+';color:#fff">'+(camp?camp.name:'—')+'</span></div></div>'
  +'<div class="d-row"><div class="d-label">平台</div><div class="d-val"><span class="acct-platform '+pc+'">'+a.platform+'</span></div></div>'
  +'<div class="d-row"><div class="d-label">账号层级</div><div class="d-val"><span style="display:inline-block;padding:3px 10px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;background:'+lvlColor+'">'+(a.level||'未分级')+'</span></div></div>'
  +'<div class="d-row"><div class="d-label">层级链路 · 向上溯源</div><div class="d-val">'+chainHtml+'</div></div>'
  +'<div class="d-row"><div class="d-label">下级承接账号 · 向下分流</div><div class="d-val">'+childHtml+'</div></div>'
  +'<div class="d-row"><div class="d-label">定位</div><div class="d-val">'+a.pos+'</div></div>'
  +'<div class="d-row"><div class="d-label">负责人</div><div class="d-val">'+a.owner+'</div></div>'
  +'<div class="d-row"><div class="d-label">内容方向</div><div class="d-val">'+a.content+'</div></div>'
  +'<div class="d-row"><div class="d-label">状态</div><div class="d-val"><span class="d-tag '+st+'">'+a.status+'</span></div></div>'
  +'<div class="d-row"><div class="d-label">粉丝量</div><div class="d-val">'+a.fans+'</div></div>'
  +'<div class="d-row"><div class="d-label">账号说明</div><div class="d-val">'+a.desc+'</div></div>';
 document.getElementById('detail').classList.add('show');
}
function closeDetail(){document.getElementById('detail').classList.remove('show')}

renderCampBar();renderMindmap();renderTreeCampBar();renderTree();renderList();renderStat();
