<script type="text/markdown" id="mdsrc"># 四级代理体系 V2 · 团长 1 万起，分公司即基地（修正版）

| 字段 | 内容 |
| --- | --- |
| 文档编号 | 20260916_四级代理体系_团长至省分公司 |
| 状态 | V2 待确认（**取代 V1**：创始人修正——社群团长 = 1 万；OPC 基地 = 省市分公司，合并为一条线） |
| 关联 | [[20260916_社群运营计划_品牌整合版]] · [[20260916_AI普惠计划_随心付分账方案_V2]] · [[20260916_升单课程与变现承接体系]] · [[20260905_主理人公社社群双引擎运营方案_已确认]] |
| 一句话定位 | **结构四级，钱永远一层——团长 1 万起步，分公司即基地。** |

> **V1→V2 修正说明**：① 团长从「0 元申请制」修正为 **1 万正式档**（对齐 V5 已确认的「团长培训 1 万」原始设定）；② 「省分公司 12 万 + 基地 50 万」两层合并为**「省市分公司 = OPC 基地」**（50 万起，六项门槛不变）。既定价格 1/3/12 万三档与定额推荐费 500/1,000/2,000 完全不动。

---

## 一、体系总览（四级 · 修正映射）

| 层级 | 身份名 | 门槛 | 对应既定档位 | 授权范围 |
| --- | --- | --- | --- | --- |
| L1 | **社群团长**（上桌团长） | **1 万** | 团长培训（Tier C） | 授权区县内开班运营；随心付 50% + 课程 30%；可发展预备团长 |
| L2 | **区县代理**（二级） | 3 万 | 社群运营（Tier B） | 区县优先权 + 区县充电站；可发展团长；可卖进阶课 |
| L3 | **市代理**（一级） | 12 万 | 高端共建（Tier A） | 地级市优先 + 天选合伙人身份；可发展区县代理；线下活动主办 |
| L4 | **省市分公司**（= OPC 基地，城市王炸） | 50 万起 | 城市运营中心 | 12 项职能 + 总部势能对接；可推荐市代理；**六项门槛不变** |

**启动通道（既定机制承载）**：1,000 元上车卡（7 天体验、升级全额抵扣）= 预备团长启动位——首批种子团长用上车卡启动开班，30 天跑通后升级 1 万（1,000 全额抵扣），不升级则停止分账授权。

**签约规则（铁律不变）**：所有代理与总部直签；分公司（基地）签《城市运营中心服务合作协议》。

## 二、各级身份与职责

| 层级 | 核心职责 | 时间投入 | 规模要求 |
| --- | --- | --- | --- |
| 团长（1 万） | 开班、陪打卡、朋友圈运营 | 每天 1 小时 | 单社群 50–300 人 |
| 区县代理（3 万） | 本区团长招募与陪跑 + 直接零售 | 兼职可做 | 3–10 位团长 |
| 市代理（12 万） | 市域招商 + 区县代理培训督导 + 线下活动 | 全职 | 3 人+ 团队 |
| 省市分公司（50 万） | 城市运营中心 12 项职能 + 大项目对接 | 公司化 | 注册公司 + 团队 ≥3 人 + 6 个月运营资金（六项门槛） |

## 三、收入结构矩阵（核心 · 合规分润）

> **设计原则**：每级三条收入线——① 自己卖货的佣金 ② 卖给下级的明码服务产品 ③ 一层定额推荐费。**永不设**按下级业绩抽成、团队业绩奖、层级返点。

| 收入来源 | 团长（1万） | 区县代理（3万） | 市代理（12万） | 省市分公司（50万） |
| --- | --- | --- | --- | --- |
| ① 普惠班随心付款 | **50%**（开班团长） | 自开班同享 | — | — |
| ① 课程/会员零售 | 30% | 30% | 30% | 30% |
| ① 进阶课/实战营零售 | 20% | 25% | 25% | 25% |
| ① 线下产品（一日营/闭门会/游学） | — | 联营席位 | 主办方 | 联办 |
| ① 项目承接 | — | 项目劳务 | 项目服务费（合同制） | 大项目联营 |
| ② 服务产品收入 | — | 团长陪跑年卡（卖团长） | 区县陪跑年卡（卖县代） | 市代运营体系年卡（卖市代） |
| ③ 推荐定额费（仅一层·既定） | 推荐团长 500 | 推荐县代 1,000 | 推荐市代 2,000 | 推荐市代 2,000 |
| ~~按下级业绩抽成~~ | **禁止** | **禁止** | **禁止** | **禁止** |

**服务产品定价（明码自愿、签服务协议、开服务发票、不得与代理资格捆绑）**：

| 服务产品 | 卖方→买方 | 价格 | 内容 |
| --- | --- | --- | --- |
| 团长陪跑年卡 | 区县代理→团长 | 1,980/年 | 每月 2 次团长培训 + 开班督导 + 话术更新 |
| 区县陪跑年卡 | 市代理→区县代理 | 5,000/年 | 季度区代集训 + 城市活动联办 + 物料支持 |
| 市代运营体系年卡 | 省市分公司→市代理 | 20,000/年 | 招商支持 + 品牌授权物料 + 区域策略会 |

> 推荐定额费已按新映射对齐既定档位：推荐 1 万团长 500 / 3 万县代 1,000 / 12 万市代 2,000，年封顶 2 万。

## 四、AI 普惠计划在体系中的位置（随心付口径沿用）

```
省市分公司（基地）—— 城市运营中心：线下场地 + 大项目 + 一日营联办
   │
市代理 —— 市域招商 + 区县代理培训督导
   │
区县代理 —— 区内团长招募与陪跑（服务年卡）+ 自开班拿 50%
   │
团长（1万）—— 普惠班主战场：开班 50% 随心付 + 课程成交 30%
```

**随心付雷达四级化用法**（不变）：团长识人 → 县代识团长（班均认可度）→ 市代看城市充电榜招商 → 总部考核依据（只考服务动作）。

## 五、产品带分布（修正：1 万团长即可卖实战营）

| 产品带 | 团长（1万） | 县代（3万） | 市代（12万） | 分公司（50万） |
| --- | --- | --- | --- | --- |
| 普惠班（0 元起随心付） | ✓50% | ✓50% | — | — |
| 会员/工具包（99–699） | ✓30% | ✓30% | ✓30% | ✓30% |
| 实战营（399–1,980） | ✓20% | ✓25% | ✓25% | ✓25% |
| 操盘手营（2,980） | ✓20% | ✓25% | ✓25% | ✓25% |
| 一日营（598）/闭门会（2,980） | 联营席位 | 联营 | 主办方 | 联办 |
| 游学（9,800） | — | 联营 | 联营 | 联办 |
| 师徒制（19,800/49,800） | — | — | 联营 | 联营（资源对接位） |
| 项目货盘（数字人/代运营等） | — | 零售差价 | 服务费合同 | 大项目联营 |

## 六、升级通道与考核

```
预备团长（1,000 上车卡，30 天体验）
  └─ 跑通 1 期班 + 班均认可度达标 → 升级团长（1 万，1,000 抵扣）
团长（1 万）
  └─ 开满 3 期班 + 辖区认可 → 可申请区县代理（3 万，补差价）
区县代理（3 万）
  └─ 辖区团长 ≥5 位 + 服务动作达标 → 可申请市代理（12 万，补差价）
市代理（12 万）
  └─ 履约期满 + 六项门槛 → 可申请省市分公司（OPC 基地，50 万起）
```

**考核只考三样**（不变）：服务动作完成度、学员满意度、合规记录（违规一票否决）。

## 七、招商节奏（四级联动）

| 阶段 | 动作 | 目标 |
| --- | --- | --- |
| 第 1 月 | 市代旗舰招商：首批 10 席天选合伙人（12 万）+ 种子团长（上车卡启动） | 体系启动金 + 首批班开跑 |
| 第 2 月 | 县代跟进（通电大会）+ 团长批量转化（上车卡→1 万） | 普惠班滚动开班 |
| 第 3 月 | 分公司（基地）落地首城 + 掌灯计划/天选之夜 | 案例反哺下一轮 |
| 常态 | 普惠班每月滚动，每期为招商展示 | 一鱼两吃循环 |

## 八、合规红线（八条 · 生命线）

1. **结构可以有金字塔，钱不能有金字塔**——按下级业绩抽成出现即熔断；
2. 所有代理与总部直签，收款全走对公，上级不碰下级合同款；
3. 推荐费只算一层定额（500/1,000/2,000，年封顶 2 万）；
4. 服务年卡自愿选购、开服务发票，不与代理资格捆绑；
5. 升级考核只考服务动作，不与下级销售挂钩；
6. 对外话术禁用：躺赚/下级/代理分成/卡位/团队收益/月入 X 万；
7. 随心付三底线沿用：0 元可学完、不设参考价、付款与权益脱钩；
8. 「分公司」在完成工商注册前对外称「城市运营中心」，不构成主体误导。

function renderDoc(html){

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
