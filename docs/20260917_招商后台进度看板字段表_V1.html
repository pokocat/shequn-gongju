<script type="text/markdown" id="mdsrc"># 招商后台进度看板字段表 V1

| 字段 | 内容 |
| --- | --- |
| 文档编号 | 20260917_招商后台进度看板字段表_V1 |
| 状态 | V1 待确认（系统/小程序开发的数据字典基础） |
| 用途 | 支撑 V6 时间进度表的**控盘杠杆**：人数触发涨价、闸门触发、雷达分层、升级账户——全部以本表字段为准 |
| 使用方 | 招商中控（每日看）· 财务（分账与退款）· 系统开发（建表） |

---

## 一、席位进度表 `seat_progress`（市代/团长/县代通用）

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| level | enum | `district_leader`(团长) / `county`(县代) / `city`(市代) / `branch`(分公司) |
| batch_no | int | 批次号（市代 1–6：1折/2折/3折/4折/5折/常价） |
| batch_name | varchar | 如「创始批（1 折）」 |
| unit_price | decimal | 当批单席价 |
| quota_total | int | 批次总席位（市代：500/200/100/100/50/50） |
| quota_filled | int | 已签约数（实时） |
| quota_intent_locked | int | 意向金已锁定本批席位数（1 折优先队列） |
| status | enum | `upcoming`(未开放) / `recruiting`(招募中) / `sold_out`(售罄) |
| opened_at / closed_at | datetime | 批次开闸/售罄时间（涨价触发留痕） |
| city_limit | int | 一城限购数（市代=3；NULL 为不限） |

**触发器规则**：`quota_filled + quota_intent_locked ≥ quota_total` → 本批 `sold_out` → 下一批 `recruiting`（自动+短信通知中控）。

## 二、意向金管理表 `intent_deposit`

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| intent_id | uuid | 意向金单号 |
| user_id / name / phone | — | 缴纳人 |
| amount | decimal | 固定 1,000 |
| paid_at | datetime | **到账时间（1 折排序唯一依据）** |
| target_level | enum | 意向档位（city/district_leader/county） |
| queue_rank | int | 在目标档 1 折队列中的实时排名 |
| status | enum | `active`(有效) / `converted`(已签约抵扣) / `refunded`(已退) |
| expire_at | datetime | 起盘日+30 天 |
| refund_requested_at | datetime | 退款申请时间（SLA：7 个工作日） |
| refund_completed_at | datetime | 退款完成时间 |

## 三、升级账户流水表 `upgrade_account`

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| account_id / user_id | — | 一人一账户 |
| entry_id | uuid | 流水号 |
| amount_in | decimal | 入账金额（意向金/各级合作款/上车卡全部累计） |
| source | enum | `intent_deposit` / `boarding_card` / `district_leader` / `county` / `city` / `branch` |
| deducted_against | varchar | 抵扣指向（如「市代创始批合作款」） |
| balance | decimal | 账户累计可用抵扣余额 |
| created_at | datetime | — |

> 规则：**所有已付款项全额累计抵扣**（1,000→1,000→…一路抵上来）；升级只补差价，退款按规则原路退。

## 四、普惠班运营表 `class_campaign`

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| class_id | uuid | 班级号 |
| leader_id | — | 开班团长 |
| start_date / day_count | date/int | 开班日/天数（7 天） |
| enrolled / attended | int | 报名/实际打卡人数 |
| tip_total | decimal | 随心付总金额（本班） |
| tip_split_leader / tip_split_hq | decimal | 团长 50% / 总部 50% |
| tier_counts | json | 雷达五层人数 `{t0:.., t1_99:.., t100_499:.., t500_999:.., t1000_plus:..}` |
| conversion | json | 会员/实战营/上车卡成交数 |
| leaderboard_rank | int | 随心榜排名（月度） |

## 五、雷达分层与升单表 `radar_funnel`

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| user_id / class_id | — | — |
| pay_amount | decimal | 该学员随心付金额（分档依据） |
| tier | enum | `T0`(0元) / `T1`(1–99) / `T2`(100–499) / `T3`(500–999) / `T4`(≥1000) |
| follow_up_owner | — | 承接人（T3=团长1v1 / T4=天选姐出面） |
| upgraded_to | enum | 后续成交产品（monthly_member/yearly_member/camp/boarding_card/agent） |
| followup_at / result | — | 跟进记录 |

## 六、闸门与控盘触发器表 `gate_control`

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| gate_id | enum | `leader_gate`(团长闸) / `county_gate`(县代闸) / `price_step`(涨价) / `next_wave`(下一波) |
| trigger_rule | varchar | 如 `city_agents_total ≥ 100` / `leaders_total ≥ 2000` / `batch sold_out` |
| current_value | int | 当前值（实时） |
| threshold | int | 阈值 |
| status | enum | `watching`(监控中) / `triggered`(已触发) / `executed`(已执行) |
| executed_at / operator | — | 触发执行留痕（谁开的闸、何时） |

**预设规则（对接 V6 时间表）**：

| 闸门 | 触发条件 | 执行动作 |
| --- | --- | --- |
| 团长闸 | 市代累计 ≥100 人 | 开放团长 1 折通道（1,000 元） |
| 县代闸 | 团长累计 ≥2,000 人 | 开放团长升级县代补差减半 |
| 涨价 | 各批 `sold_out` | 下一批自动开放+公示 |
| 顺延 | 月进度 < 目标（市代 <250 人/月） | **不涨价**，中控加推动作记录 |
| 下一波 | 市代 1,000 席满 | M9 发布会门槛上调 50% 公示 |

## 七、城市/区域表 `region_control`

| 字段 | 类型 | 说明 |
| --- | --- | --- |
| region_code / name | — | 城市编码/名称 |
| region_level | enum | `county`(区县) / `city`(地级市) |
| quota | int | 区域席位数（县代一区一位=1；市代一城 3 席） |
| locked_by / locked_until | — | 意向锁定人/截止（6 个月释放规则） |
| exclusive_holder | — | 独家授权持有人（补差激活后） |

## 八、权限与合规位

| 项 | 设计 |
| --- | --- |
| 看板角色 | 中控（全量）/ 财务（分账退款）/ 市代（仅自家数据）/ 团长（仅自家班级） |
| 数字真实性 | 对外公示页的所有数字（剩余席位/进度）由本系统单源输出——**一处维护，多处展示** |
| 留痕 | 每次涨价、开闸、退款均留 operator + timestamp（应对质疑的审计链） |
| 敏感数据 | 用户身份信息脱敏展示（中控层可见明细） |

## 九、开发优先级建议

| 优先级 | 模块 | 理由 |
| --- | --- | --- |
| P0 | 席位进度表 + 意向金管理 + 收款凭证 | W1–W2 蓄水即用 |
| P0 | 升级账户流水 | 签约当天就要抵扣 |
| P1 | 普惠班运营 + 雷达分层 | M2 团长闸开启后 |
| P1 | 闸门触发器 | M1 中旬市达 100 人前 |
| P2 | 区域表 + 市代侧看板 | M3 后规模化 |

---

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
