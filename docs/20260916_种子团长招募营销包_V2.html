## 〇、策略页（30 秒读懂这场招募）

| 项 | 内容 |
| --- | --- |
| 目标 | 首期锁定 3–5 位种子团长，7 天内完成招募 |
| 招谁 | 有朋友圈/有群、认可 AI 趋势、想给圈子做点事也想变现的人 |
| 核心卖点 | ① 0 成本启动（不交一分钱）② 总部全包（课程/直播/AI老师/SOP）③ 分润清晰（课程成交 30% 起拿）④ 私域归自己 |
| 一句主话术 | 「你朋友圈里躺着的那些人，就是你的第一笔资产。」 |
| 行动指令 | 私信「团长」两个字 |

## 一、招募长文（朋友圈/公众号主发版）

> 按共鸣→信任→渴望→行动四层写，可直接复制发布。

**你的朋友圈，躺着一笔没取出来的钱。**

加了几百个好友，除了点赞之交，给你带来过什么？
天选姐做社群这些年看明白一件事：**人脉不是认识多少人，是你能为多少人提供一次真实的价值。**

现在这件事有个现成的载体——**AI 普及计划**：

一个 7 天的公益课。教普通人用上 AI：写方案、做图、查资料、管客户。学员 0 元进群，觉得有用随心打赏，打赏流向每月公示。公益是真的公益，课是真的课。

但公益要跑起来，需要有人把班开到自己的圈子里。**这就是我在找的人：团长。**

**团长做三件事**：拉自己的接龙群、每天发课程链接、陪大家打卡。
**总部全包**：课程、直播、话术、还有一个 AI 老师，我的团队一对一陪你跑第一期。

**团长的钱从哪来，一次说清（这可能是你见过最诚实的招募）**：

① 学员打赏——**一分不进团长口袋**，全部进公益池、每月公示。这是规矩，也是你的信任背书；
② 课程成交——你的专属码带来的每一笔会员/课程订单，**你拿 30% 分销佣金**，单层结算、按月到账；
③ 进阶转化——实战营、操盘手营成交，你拿 20%；
④ 想做大——跑通第一期，优先进入正式城市合作通道（1 万起档，赚零售差价）。

**四条线全部写进协议，前三条不需要你花一分钱。**

为什么说这是「资源变现第一步」：第一期跑完，你会拿到一份**你的人脉体检报告**——谁在学、谁在打赏、谁对进阶课有反应，数据告诉你你的圈子里谁最值钱。这份名单，比课程本身值钱。

不承诺收入——**收入取决于你的圈子质量和你的用心程度**，我只承诺：总部不藏课、不藏话术、不藏数据。

**首批只开 5 席。**
有兴趣，私信我「团长」两个字。今晚 8 点，我语音跟你讲 15 分钟。

## 二、朋友圈短文案（三版 · 不同角度）

**版本 A · 资产角度（推荐首发）**

> 你朋友圈里躺着的 500 个人，就是你的第一笔资产。
> 我在找 5 位团长，把它激活：AI 普及公益班，7 天，学员 0 元；你开班，总部出课程出 AI 老师出话术；课程成交你拿 30%。
> 打赏我们一分不分——那是公益的钱。赚的是你该赚的。
> 私信「团长」。

**版本 B · 趋势角度（D-1 预热用）**

> 今晚在给 AI 夜校挑第一批团长。
> 不用懂 AI，不用出镜，不花一分钱。每天 1 小时，把你朋友圈里想学 AI 的人聚起来。
> 总部全包，你的码你的私域你的佣金。
> 首批 5 席，想上车的私信我。

**版本 C · 反套路角度（D+1 追发用）**

> 招团长，先把丑话说完：
> 公益课的打赏，团长一分不拿——那是公示的钱。
> 团长赚三样：课程成交 30% 分销佣金、进阶课 20%、跑通之后的正式合作优先权。
> 0 元启动，但要有圈子、每天 1 小时、先做事。
> 图快钱的别来。私信「团长」。

## 三、一对一私聊五步（升级版 · 含分润位）

**第 1 条 · 共鸣开场**

> 「XX，问你个事。你朋友圈里几百号人，除了点赞，给你带来过什么？我这边有个现成的答案——AI 普及计划，正在选首批开班的团长，我第一个想到你。」

**第 2 条 · 是什么（信任）**

> 「7 天公益课，教普通人用 AI：写方案、做图、查资料。学员 0 元进群，打赏随心、流向每月公示。团长把班开到自己圈子——拉群、发链接、陪打卡，就这三件事。课程直播话术全总部出，还有个 AI 老师叫『上线』帮着答疑。」

**第 3 条 · 分润说明（渴望）**

> 「钱的事直接说清楚，四条线：
> ① 打赏不进团长口袋——公益池，每月公示，这是规矩也是你的口碑；
> ② 你专属码的课程成交，30% 佣金，按月结；
> ③ 进阶课成交，20%；
> ④ 跑通第一期，正式城市合作通道优先给你（那才是赚差价的生意）。
> 全部写协议，前三条 0 成本。」

**第 4 条 · 独家价值（人脉体检）**

> 「还有个隐藏福利：第一期跑完，你会拿到你圈子的『人脉体检报告』——谁在学、谁打赏、谁对进阶课有反应。这份名单，后面做什么都用得上。」

**第 5 条 · 行动指令（限量）**

> 「首批只有 5 席，给你留到今晚 12 点。回「团长」，晚上 8 点语音 15 分钟，讲完你直接定。」

## 四、群发短版（30 秒读完）

> 「跟你说个事：AI 普及公益班招首批团长。学员 0 元学 7 天，你负责把班开到自己圈子（拉群/发链接/陪打卡），总部出全部课程和 AI 老师。打赏不分账（公益公示），你赚课程成交 30% 分销佣金 + 进阶课 20%。有圈子、每天 1 小时、想给自己人脉做点事的，回「团长」我细说。」

## 五、短视频口播脚本（45 秒 · 视频号/抖音）

> **【前 3 秒钩子】**
> 你朋友圈里那 500 个人，正在变成一笔别人抢不走的资产。
>
> **【10 秒 · 背景】**
> 我们做了个 AI 普及计划：7 天公益课，教普通人用 AI——写方案、做图、查资料。学员一分钱不花，打赏随心，流向每月公示。
>
> **【30 秒 · 核心】**
> 但每个圈子，得有人把班开起来——这就是团长。
> 团长干三件事：拉群、发链接、陪打卡。剩下的总部全包：课程、直播、还有个 AI 老师帮你答疑。
> 赚钱说清楚：打赏一分不拿，那是公示的公益钱；你的专属码出了课程订单，30% 佣金按月结；进阶课 20%。跑通了，还有正式合作通道。
>
> **【10 秒 · CTA】**
> 首批就 5 个位置。想把你朋友圈激活的，评论区扣「团长」两个字，我私信你。

## 七、报名引导（承接流程）

```
私信「团长」
  → 自动回复：报名表（3 题填圈子上情况，1 分钟填完）
  → 15 分钟语音沟通（话术包第八节结构）
  → 发团长 SOP + 专属接龙码
  → 下周一统一开营（总部陪跑）
```

function renderDoc(html){

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
