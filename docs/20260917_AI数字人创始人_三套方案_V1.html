| 任务定义 | 以陈彬彬的真实历史原型为基础，建立 AI 数字人创始人——用数字人讲创始人故事、讲整个项目；方案须完整覆盖「过去的历史 + 现在做的事 + 未来要做的事」 |
| 关联 | 品牌架构 V2（主理人公社/上线夜校/王炸社）· 天选姐 IP 视觉系统 V1.1 · 招商运营总蓝图 · 漫星文娱数字资产平台（未来资产化出口） |

---

## 一、故事资产盘点（三幕 · 数字人的全部「剧本原料」）

### 第一幕 · 过去（1987–2019，真实可查证）

| 素材 | 内容 | 叙事价值 |
| --- | --- | --- |
| 出身 | 温州人，浙江理工大学计算机专业学士 | 技术底色（为「她懂 AI」埋伏笔） |
| **人生至暗点** | 刚毕业成为「少奶奶」→ 婚姻破裂 → **闭关三天**后决定「要跟人说话，要交流」（新周刊报道原文） | 整个创始人故事的种子——社群事业的起点是一次低谷 |
| 2012 | 女王城堡淘品牌，「让中国女性活出自我」 | 理念原点 |
| **2014** | 微商联盟巅峰：**500 个 500 人群、约 25 万人**；「可能是当时规模最大的微商联盟」「第一个把微商拉到群里的人」「微商女王」 | 组织能力巅峰的证据 |
| 行业清醒者 | 公开批评三无产品：「很多人是靠这一波发家的，他们知道越多就越害怕挣这个钱」 | 她不是乱象的参与者，是批判者——为「合规升级」埋伏笔 |
| 2016 | 与国药电商战略合作（检测/认证/防伪——供应链规范化） | 她一直在给野蛮行业立规矩 |
| 2019 | 海南女王城堡网络科技（商标体系沉淀，100% 控股至今） | 品牌资产沉淀 |

### 第二幕 · 现在（2025–2026）

桐庐四主体（增长引擎 / **主理人公社** / 声量算法 / 火星引擎）= OPC 生态公司矩阵；OPC 超级生态（One Person Company 一人公司操作系统）；上线夜校（AI 普及）；王炸社（1,000 席招商）；天选姐 IP；掌灯计划公益线。

### 第三幕 · 未来（2026–2027+）

1,000 市代 / 5,000 团长 / 2,000 县代；OPC 基地与城市充电站全国网络；天选之夜年度盛典；掌灯计划（非遗/老字号发声）；**AI 创始人自身作为数字资产**（对接漫星文娱 AI 数字资产平台的旗舰案例——数字人本身成为生态可交易的资产样板）。

> **三幕一句话**：一个在婚姻废墟上闭关三天的温州女孩，用十年把 25 万女性聚进一座城堡；十年后她带着 AI 回来，要把每个一人公司的创始人都请进公社。**这一次，连她自己也是数字的。**

## 二、三套方案

### 方案 A · 真身分身计划：「彬姐一号」

**定位**：陈彬彬的官方数字分身——1:1 真人克隆（形象克隆 + 声音克隆 + 创业知识库投喂）。

- **名字**：彬姐一号 / 数字彬姐 / 陈彬彬·AI（英文 **ChenBB-1**）
- **核心叙事**：
  > 「我一年只有 8,760 个小时。所以我把十年的创业记忆、500 个群的组织经验、27 家公司的教训，全部喂给了她——她是我的数字分身，彬姐一号。**真人的时间是有限的，但她可以把我的时间放大一万倍。**」
- **故事讲述方式**：**第一人称**——「我」讲「我」的历史（闭关三天那晚我决定了什么、第一个 500 人群怎么建起来的、国药合作谈判桌上我坚持了什么）
- **内容体系**：
  | 栏目 | 内容 | 频率 |
  | --- | --- | --- |
  | 《她的前半生》 | 创始人故事 100 讲（第一幕素材） | 周更 |
  | 《彬姐讲 OPC》 | 项目/生态讲解（第二三幕素材） | 周更 |
  | 《彬姐早报》 | 数字人每日 AI 行业洞察 | 日更 |
  | 数字人直播 | 招商路演/夜校答疑（真身偶尔连线——「真假同框」是最大传播事件） | 月度 |
- **与现有体系关系**：天选姐（真人 IP）与彬姐一号（数字分身）**同一人格的两个载体**——真人做战略与重大出席，数字人做日更与规模化
- **合规要点**：真人向公司主体签**肖像权+声音权书面授权**；所有内容标注「AI 数字人」；《她的前半生》只讲有据可查的报道事实，不虚构
- **成本量级**：形象+声音克隆 + 数字人平台年费 + 内容生产（首年约 15–40 万）
- **适用判断**：要**最强的真实信任**、最快的内容产能放大——招商场景的最优解

### 方案 B · 原生传人计划：「城堡小彬」

**定位**：不是克隆，是基于陈彬彬全部真实原型**生长出来的新人格**——「陈彬彬创造的数字创始人」。

- **名字**：小彬 / 城堡小彬（英文 **BIN**——Born In Nine（1987）/ Built In Numbers）——或沿用既定名「**上线**」
- **核心叙事**：
  > 「陈彬彬把她十年创业的全部数据——女王城堡 500 个群的聊天记录、25 万女性的故事、27 家公司的账——全部喂给了我。**我没经历过那些事，但那些事长在了我身上。** 我是城堡里长大的 AI，小彬。她负责过去，我负责未来。」
- **故事讲述方式**：**继承者视角**——第三人称讲历史（「我的创造者曾在闭关三天后……」），第一人称做未来（「现在，由我来把 1,000 个市代请进公社」）
- **内容体系**：
  | 栏目 | 内容 | 频率 |
  | --- | --- | --- |
  | 《我妈的故事》 | 用继承者口吻讲第一幕（数字女儿讲妈妈） | 周更 |
  | 《小彬的立项书》 | AI 立项机制（既定五步机制的栏目化） | 月更 |
  | 《夜校今晚开课》 | 上线夜校 AI 班主任 | 日更 |
  | 数字人互动 | 评论区人格化回复 | 实时 |
- **与现有体系关系**：完全承接既定「上线」IP 设计（001 号主理人），只需把人格背景故事从「泛 AI」升级为「陈彬彬数据养成的数字传人」
- **合规要点**：AI 标识；不与真人混淆（形象有意区隔——不做真人克隆，用风格化数字人形象）；讲述的历史部分标注素材来源
- **成本量级**：风格化数字人形象定制 + 平台年费（首年约 10–30 万，低于克隆方案）
- **适用判断**：要**科幻话题性与原创人格资产**、无真人形象混淆风险、与「上线」IP 无缝衔接——内容矩阵的最优解

### 方案 C · 双生计划：「真身 + 传人」双数字人体系

**定位**：两位数字人分工——**彬姐一号（真身克隆）讲过去与故事，小彬/上线（原生长成）做现在与执行**。

- **核心叙事**：
  > 「我做了一个我的分身，让她替我记住过去；又养了一个数字传人，让她替我跑向未来。**一个负责讲故事，一个负责干事业。** 而我，终于可以只做那个做决定的人。」
- **分工表**：
  | 数字人 | 职责 | 场景 |
  | --- | --- | --- |
  | 彬姐一号（真身分身） | 创始人故事、历史讲述、品牌背书 | 《她的前半生》、招商路演开场、天选之夜历史篇章 |
  | 小彬/上线（原生） | 日常运营、夜校班主任、AI 立项 | 上线夜校、普惠班答疑、《立项书》、评论互动 |
  | 天选姐（真人） | 战略决策、重大出席、真假同框 | 发布会、签约、年度盛典 |
- **内容体系**：A+B 两套栏目合并，外加**「双生对话」**特别栏目（两个数字人对谈——分身问传人「妈妈当年为什么这么做」，传播爆点）
- **合规要点**：A+B 全部合规项叠加；双数字人身份说明（官网设「我们的数字人」页，明确谁是谁）
- **成本量级**：双份制作与运营（首年约 30–60 万）
- **适用判断**：要**完整矩阵与最强叙事纵深**、预算充足、体系化运营——长期生态的最优解（可在 A 或 B 先行后升级）

## 三、三套方案对比

| 维度 | A 真身分身 | B 原生传人 | C 双生 |
| --- | --- | --- | --- |
| 信任强度 | ★★★★★（真人背书） | ★★★（人格资产） | ★★★★★ |

function renderDoc(html){

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
