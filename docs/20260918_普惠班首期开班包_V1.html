<script type="text/markdown" id="mdsrc"># 普惠班首期开班包 V1（5 班齐开执行件）

> 执行：W2-4 AI 工作包 · 2026-09-18
> 组合：团长 SOP 手册 V1 + 七天课件包 V1 + 蓄水 SOP V1
> 验收：5 位种子团长领包即可同日开班

---

## 一、开班前置检查（开班前 1 天，团长逐项打钩）

| # | 检查项 | 依赖 |
| --- | --- | --- |
| 1 | 群建好、群名规范：`上线夜校·AI普及·第X班（团长XX）` | — |
| 2 | 群规+开营词已存草稿 | 本文 §2/§3 |
| 3 | 7 天课程链接每日定时任务设好 | 课件包 |
| 4 | 随心付说明文案存草稿（**不改动一字**） | 本文 §4 |
| 5 | 雷达上报表建好 | 本文 §5 |
| 6 | 首班人数 ≥50（不足 30 延期，不硬开） | 团长 SOP 规则 |
| 7 | 团长侧：AI 老师「上线」点评账号已由总部授权接入 | 总部 |

## 二、群公告三件套

**建群公告（进群即见）**
> 欢迎来到上线夜校 · AI 普及班！
> 我们做什么：7 天，每天 10 分钟，从「完全不会」到「让 AI 替你干活」。
> 三条群规：①每天 8 点发课，当日看完 ②作业发群里，AI 老师上线会点评 ③不刷屏不广告。
> 成本：**0 元，可学完 7 天全部内容。**
> 团长：XX ｜ 主理人公社 One&Co 出品

**每日课程公告（每天 8:00 定时发）**
> 【上线夜校 · Day X】今天的课来了：《XX》（10 分钟）。
> 看完回来扣「1」，作业直接发群里——上线老师 12:30 会点评。
> 昨天的优秀作业：@某某 的 XX（点名表扬，轮着来）。

**结营公告（Day 7 晚）**
> 7 天毕业快乐！今晚 20:00 毕业典礼直播间见——有颁奖、有彩蛋、有下期预告。

## 三、开营词（Day 1 晚 20:00 团长发 + 一姐语音 60 秒）

**团长版**：
> 大家晚上好，我是 XX。这 7 天我只干三件事：每天早上把课发到群里、中午把作业晒出来、晚上陪大家聊 10 分钟。
> 你们不用有任何压力——0 元、每天 10 分钟、学不完没关系，群一直在。
> 但我有一个小要求：**Day 1 今晚就把课看完**。因为明天早上你会发现：AI 比你想象的简单 100 倍。
> 现在，开课！

**一姐语音版（总部统一发）**：
> 「晚上好，我是一姐。今晚，你上线。这 7 天，你的 AI 老师『上线』会全程陪跑——它是我们公社的 AI 创始人，001 号主理人。7 天后，你会拥有一个自己的数字分身。开课！」

## 四、随心付说明话术（固定文案 · 禁改动）

**Day 3 晚（随图课发布后 1 小时，只发一次）**
> 跟大家说明成本这件事：这套课按内容对得起 1000 元的体系（我们的上车卡就是这个价，真实在售）。
> 但普及期一分不收——0 元可以学完 7 天全部内容，这是规则。
> 如果你觉得有用，想支持：随心付，金额你定，付 0 也完全没问题。
> 你的打赏不是给我，是给 AI 老师上线充算力——下一节课的免费，是大家充出来的。

**Day 7 毕业礼（直播间+群同步）**
> 随心付通道今晚正式开启（群公告附收款码）。三句话说清：
> ① 0 元学完全部 7 天——这是承诺，已兑现；
> ② 觉得值，随心付，多少都行——你的算力账单每月公示；
> ③ 不付，一样欢迎留下——下期主题班 9.9 押金制，学完退还。

## 五、雷达上报表（团长 Day 7 晚 22:30 提交总部）

| 层级 | 判定 | 动作 |
| --- | --- | --- |
| T0 未看完 | 课程完成 <3 天 | 下期召回名单，不推荐 |
| T1 学完零付 | 完成 ≥6 天+0 付 | 推 9.9 主题班（养信任） |
| T2 学完小额 | 随心付 1-99 | 推上线会员 99/月 |
| T3 学完中额 | 随心付 100-499 | **团长 1v1**：推上车卡 1,000 |
| T4 学完大额 | 随心付 ≥500 | **报总部，一姐出面**：上车卡+王炸社 Tier 预沟通 |
| 特殊 | 作业优秀/主动要定制数字人 | 单列「重点名单」（Day6 埋点线索） |

**上报表格式**：`班级 / 总人数 / 完成率 / T0-T4 人数 / 随心付总额 / 重点名单（姓名+线索）`。

## 六、5 班并行节奏（总部视角）

| 时间 | 总部动作 |
| --- | --- |
| D-1 | 团长群检查会（§1 逐项过）+ 一姐语音包下发 |
| D1 | 5 班同晚开营 + 总部巡群（随机 2 群潜水观察） |
| D3 | 随心付文案执行抽查（必须原文）+ 冷群预警 |
| D5 | 中期数据：完成率 <50% 的班，团长加推（私聊唤醒模板） |
| D7 | 毕业礼直播间（5 班合流）+ 雷达上报表回收 |
| D8 | 总部复盘：首批 T3/T4 名单转交招商组 + 优秀团长评估（升县代加分） |

## 七、应急预案

- **冷群（Day 2 群消息 <10 条）**：团长发起「晒作业抽奖」——晒作业抽 3 人送一姐 1v1 答疑（总部提供名额）；
- **负面质疑「是不是卖课的」**：照 SOP 坦然话术回应 + 甩真心榜公示链接；
- **随心付翻车（有人嘲讽金额）**：「付 0 元和付 999 的同学，课程和服务完全一样——付多付少是心意，不是门槛。」
- **课程链接失效**：团长群 5 分钟响应（总部值班）。

<script>
// 硬编码文件名（由生成脚本写入）

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
</script>
