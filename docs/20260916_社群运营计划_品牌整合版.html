## 一、品牌与 IP 体系总览

| 层级 | 名称（天选宇宙示例） | 角色 |

| 公司/总品牌 | 王炸社（暂名） | 商务主体、签约主体 |
| 创始人 IP | 天选姐 | 出镜人设：被选中的大女主（视觉系统 V1.1 已建） |
| AI 创始人 | 上线（"我是上线，今天正式上线"） | 第 001 号主理人 · 掌灯计划首席发声官 · 立项官 |
| 公益引流社群 | 追光夜校 | 唯一对外引流入口，永久免费 |
| 公益板块 | 掌灯计划（志愿者＝小太阳） | 为非遗/老字号/实体发声矩阵 |
| 付费产品线 | AI 军师会员卡 / 实战营 / 工具包 / 服务卡 | C 端变现主力 |

| 城市节点 | 充电站 | 授权区域运营载体（3 万档起授） |
| SaaS 系统 | 超导系统 | 中台工具（零损耗连接） |
| 年度活动 | 天选之夜 | 年度盛典 + 案例发布 + 招商收官 |
| 战略项目 | 移山计划 | 长期战略项目（AI 创始人立项首发） |

## 二、C 端会员等级体系（升级叙事：上线 → 天选 → 顶配）

> 设计逻辑：会员等级名直接用你圈选的词，形成「人生游戏化」升级叙事——**先上线，再天选，终顶配**。

| 等级 | 名称 | 对应产品 | 价格 | 权益要点 |
| --- | --- | --- | --- | --- |
| L0 | 夜校学员 | 追光夜校（公益） | 免费·随心打赏 | AI 扫盲 100 问课表 + 直播课 + 学分体系 |
| L1 | **上线会员** | AI 军师会员卡（月） | 99/月 | 工具使用权 + 答疑 + 每周天选开奖（内容福利） |
| L2 | **天选会员** | AI 军师会员卡（年） | 699/年 | L1 全部 + 实战营优先席 + 天选锦囊（专属资料包）+ 结业证书 |
| L3 | **顶配会员** | 服务卡 | 299–999 | L2 全部 + 1v1 陪跑 + 定制方案 + 主场直播间连麦权 |

**辅助产品**（不占等级线）：实战营 399–1,980、工具包 99–499。

**升级钩子**：
- L0→L1：「今晚正式上线」——学完 100 问自动触发；
- L1→L2：「从月度上线到年度天选」——天选会员享天选之夜线下优先席；
- L2→L3：「人生顶配」——顶配会员获天选姐 1v1 诊断（限量）。

**社群内三角色**（非货币晋升，两轨分离铁律不变）：
- 班长（带班）→ 对应「天选班长」；
- 督学（陪跑质检）→ 对应「掌灯人」（掌灯计划志愿者同源）；
- 共建官（传播连接）→ 对应「小太阳」（公益传播者同源）。

## 三、B 端代理等级体系（摘星计划）

> 设计逻辑：招商叙事用牌局语言——**上车 → 上桌 → 主场 → 天选 → 王炸**。价格与权益完全沿用已确认 V5。

| 档位 | 身份名 | 门槛 | 礼包内容 | 区域权益 |
| --- | --- | --- | --- | --- |
| 体验卡 | **上车卡** | 1,000 元 / 7 天 | 训练工具 + 社群共建体验 + 升级全额抵扣 | 无区域授权 |
| Tier C（1 万） | **上桌团长** | 10,000 元 | 团长培训体系 + 夜校运营方法论 + 工具箱 + 陪跑督导 | 社群级运营权（可发展二层小代理） |
| Tier B（3 万） | **主场主理** | 30,000 元 | C 档全部 + 城市充电站授权 + 区域品牌物料 + 联营分润（零售差价+服务费） | 城市/区域独家运营权 |
| Tier A（12 万） | **天选合伙人** | 120,000 元 | B 档全部 + 首批 10 席核心共建（共创会席位 + 案例共署名）+ 移山计划优先参与权 + 天选之夜 VIP | 省级优先 + 基地优先候选权 |
| OPC 基地（50 万起） | **城市王炸** | 500,000 元起 | OPC 城市运营中心 12 项职能 + 总部势能对接 | **≠ 12 万自动升级**，另过六项门槛 |

**OPD 基地六项门槛**（沿用 V5，不变）：① 注册公司主体；② 本地团队 ≥3 人；③ 实体场地；④ 50 万外另证 6 个月运营资金；⑤ Tier A 履约期满且季度考核达标；⑥ 转签《城市运营中心服务合作协议》。

**招商奖励（合规版·不变）**：推荐新代理成交，推荐人获一次性定额服务费——C 档 500 / B 档 1,000 / A 档 2,000 元，单人年度累计封顶 2 万；总部直付、代扣个税、开票「推广服务费」。禁止一切比例分成/持续抽成/团队业绩奖。

## 四、社群五层结构（品牌名更新版）

| 层 | 名称 | 形态 | 作用 |
| --- | --- | --- | --- |
| L0 | 追光夜校 | 每周二四晚直播 + 周日复盘，随心打赏 | 代理的获客武器：无门槛进人、激活区域资源 |
| L1 | 主题班（工具班/行业班） | 免费或 9.9 元押金制（全勤退还），配天选班长 | 出勤/作业筛选真用户 |
| L2 | 付费产品（上线/天选/顶配会员） | 见第二节 | 代理零售货盘：反复变现主力 |
| L3 | 三角色（掌灯人/小太阳/天选班长） | 非货币晋升 | 代理的助手团队 |
| L4 | 项目承接与植入 | 知识付费零售 + OPC 生态项目（过三关评审）+ 会员创业转化 | 最终变现层 |

**两轨分离铁律**（不变）：L3 晋升只给学分、身份、权限；货币化全部走 L4 代理体系。

## 五、运营节奏（五阶段 · 天选化载体）

| 阶段 | 动作 | 天选宇宙载体 |
| --- | --- | --- |
| 1. 预热期 | 内容矩阵铺量 + 创始人 IP 预热 | 天选姐账号矩阵启动（白金/朱砂双视觉）+ 追光夜校开课 + 短视频「今晚上线」系列 |
| 2. 诊断期 | 常设公开课自动筛人 | 夜校活跃/打赏/作业行为 = 天选雷达自动标记 |
| 3. 体验期 | 1,000 元 7 天上车卡 | 「上车站」——体验期内升级全额抵扣 |
| 4. 升级期 | 按资源选 1/3/12 万 | 摘星计划发布会（城市同步「通电大会」） |
| 5. 案例期 | 班级实绩成案例，招下一期 | 案例进天选之夜；老会员召回走「重连行动」 |

**年度节奏锚点**：天选之夜（12.31）= 案例发布 + 招商收官 + 天选锦囊现场开奖（内容福利形式）。

<script>
// 硬编码文件名（由生成脚本写入）

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';

  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
