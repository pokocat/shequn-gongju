## 一、IP 核心定位

**一句话人设**：

> 被选中的大女主——不是等运气的人，是运气本身来认领的人。

**定位关键词**：白金 · 印记 · 掷骰 · 锦囊 · 大女主

**叙事接口**：
- 天选姐（创始人 IP）与 AI 创始人构成「天选组合」：人类创始人＝天选姐；AI 创始人＝天选零（"我是天选零，第 001 号天选者"）；
- 社群语境沿用：天选社 / 天选之夜 / 天选锦囊；
- 对外口号：**天选之人，人生王炸**（与王炸宇宙兼容）。

**人设边界（沿用既定合规红线）**：
- 不做刚性收益承诺、不荐股、不给医疗法律专业意见；
- 「天选」为品牌叙事，不构成对结果的保证；
- 招商物料中「天选」仅表达资格感与稀缺感，禁止暗示「加入必赚」。

---

## 二、三套子视觉系统

### 2.1 天选白金（主视觉 · 日常/商务/B端）

| 项 | 规范 |
| --- | --- |
| 色板 | 纯白 `#FFFFFF` · 香槟金 `#D4B57A` · 暖灰 `#B8B2A6` · 点睛琥珀 `#C99A3C` |
| 服装 | 白色 oversize 高定西装 + 香槟金真丝盘扣衬衫（新中式盘扣） |
| 标志画面 | 眉心金色四角星印记；掌心悬浮金色骰子；鎏金粒子环绕 |
| 光线 | 右上 45° 主光 + 暖金轮廓光 |
| 气质 | 杂志封面级大女主，克制高级感 |
| 应用 | 视频号封面 · 招商手册 · B 端洽谈 · 直播间主形象 |
| 概念图 | `tianxuanjie_visual_main.jpg` |

### 2.2 天选朱砂（公域传播 · 涨粉向/C端）

| 项 | 规范 |
| --- | --- |
| 色板 | 宣纸米白 `#F7F2E8` · 朱砂红 `#C3272B` · 鎏金 `#C9A063` |
| 服装 | 新中式白色盘扣上衣 + 金色发簪 |
| 标志画面 | 手持朱砂红锦囊（天选锦囊，金线流苏）；背景「天选」篆刻印章 + 金色祥云纹 |
| 光线 | 柔和暖光 + 胶片质感 |
| 气质 | 国潮 + 好运叙事——转发的就是锦鲤 |
| 应用 | 小红书/抖音封面 · 节日海报 · 公益物料 · 天选锦囊活动 |
| 概念图 | `tianxuanjie_visual_cinnabar.jpg` |

### 2.3 天选鎏金（高端场合 · Tier A 晚宴/年度盛典）

| 项 | 规范 |
| --- | --- |
| 色板 | 深墨绿 `#14352B` · 鎏金 `#C9A063` · 暗琥珀 `#8C6B2F` |
| 服装 | 墨绿丝绒高定西装 + 鎏金真丝衬衫 + 金色几何星形耳饰 |
| 标志画面 | 托举发光金骰；背景烫金云纹 + 鎏金篆刻印章光影；金色轮廓光 |
| 光线 | 伦勃朗式打光（殿堂级深邃） |
| 气质 | 与 C 套深墨绿殿堂风无缝衔接 |

**三套混用禁令**：朱砂版禁止出现价格与招商话术；鎏金版禁止流入公域短视频；白金版为默认安全款。

## 三、视觉锤（可注册的独占元素）

| 视觉锤 | 规范 | 使用场景 |
| --- | --- | --- |
| **天选印记** | 四角星形金色光印，固定出现于眉心 / 手背 / 道具之上 | 全渠道统一记忆点（直播贴片、封面水印、周边） |
| **金色骰子** | 静态＝掌心悬浮；动效＝旋转定格于「天选之数」 | 海报、片头动效、互动 H5 |
| **天选锦囊** | 朱砂红 + 金线流苏 | 公域福利/彩蛋符号、节日活动 |
| **印章版式** | 封面右下角压朱砂「天选」篆印（正式设计中使用定制篆书） | 所有物料的落款 |

> 概念图中的印章文字为 AI 生成示意，正式设计时替换为定制「天选」篆书，并与商标注册的图形标一并布局。

## 八、海报应用示例（V1.1 新增）

三张海报按子视觉规范各配一个落地场景，均已核验文字渲染与视觉锤齐备：

| 海报 | 应用场景 | 画面要点 | 文件 |
| --- | --- | --- | --- |
| 天选白金 · 直播开播预告 | 视频号/直播间引流、每日开播海报 | 白西装+香槟金盘扣；掌心金骰+眉心星印；金胶囊时间标签「每晚 20:00」；CTA「扫码入群 领天选锦囊」 | `tianxuanjie_poster_baijin.jpg` |
| 天选朱砂 · 天选锦囊活动 | 小红书/抖音涨粉、每周五固定开奖 | 新中式白衫+朱砂锦囊；背景朱砂篆印；竖排对联「转发锦鲤 不如自己成为」；红纸签条「每周五 天选开奖」 | `tianxuanjie_poster_zhusha.jpg` |
| 天选鎏金 · 天选之夜邀请函 | 年度盛典、Tier A 晚宴邀请 | 墨绿丝绒袖+悬浮金骰；鎏金浮雕主标；超大烫金数字「12.31」；金线徽章「仅限 101 位天选者」 | `tianxuanjie_poster_liujin.jpg` |

**使用说明**：
1. 三张均为 AI 生成示意图，正式投放前替换为真人/数字人出镜与定制篆印，二维码为动态插入位；
2. 「每晚 20:00」「每周五」「12.31」「仅限 101 位」为占位信息，按实际运营节奏改写；

<script>
// 硬编码文件名（由生成脚本写入）
document.getElementById('fname').textContent = '20260915_天选姐IP视觉识别系统_V1.md';
document.body.classList.add('design');
document.getElementById('plainLink').href = '20260917_文档阅读器.html?file=' + encodeURIComponent('20260915_天选姐IP视觉识别系统_V1.md');

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
