<script type="text/markdown" id="mdsrc"># 发布会彩排与 24h 转化 SOP V1

> 执行：W2-6 AI 工作包 · 2026-09-18
> 组合：三轮彩排清单（声光电/物料/嘉宾/直播测试） + 应急预案三套（设备故障/嘉宾缺席/直播中断） + 发布会后 24h 转化 SOP（直播间→意向金→上车卡承接路径） + 直播间承接话术包
> 依赖：M1 起盘发布会流程脚本 V1（已换装一姐命名 · 90 分钟时间轴 · 异议库 · 数据目标）
> 验收：①D-1 全流程带妆彩排通过 ②三套应急预案打印贴在导播台 ③24h 转化 SOP 团长人手一份 ④直播间话术包主播/副播/场控各一份

---

## 〇、命名换装声明

M1 发布会脚本 V1 中所有「天选姐」一律换装为「一姐」（创始人 IP 定名 W1-1）。「天选白金」作为视觉风格名保留不变。本文件后续统一使用「一姐」。

---

## 一、三轮彩排清单（D-3 / D-2 / D-1）

### 1.1 D-3 技术彩排（直播前 3 天）

**目标**：验证所有技术链路通不通，不穿妆、不走流程，只测设备。

| # | 检查项 | 负责人 | 通过标准 |
| --- | --- | --- | --- |
| 1 | 视频号直播间开通 + 实名认证 + 小程序挂载 | 渠道 | 后台显示「可直播」+ 小程序卡片可见 |
| 2 | 主摄/副摄/俯拍机三机位画面 + 切换台 | 导播 | 三画面无黑屏无延迟，切换流畅 |
| 3 | 收音麦克风（一姐胸麦 + 副播手麦 + 提词器） | 音控 | 音量峰值 ≤-6dB，无爆音无底噪 |
| 4 | 直播推流码率/分辨率（1080P 30fps 4Mbps） | 导播 | 推流 10 分钟无掉线无卡顿 |
| 5 | AI 创始人「上线」数字人亮相技术测试 | 技术 | 口型同步误差 ≤200ms，3 分钟亮相无穿帮 |
| 6 | 腾讯会议分会场（意向金持有者专属）联调 | 渠道 | 主会场画面同步到分会场延迟 ≤3 秒 |
| 7 | 价格公示页大屏演示版 + 点击跳转小程序 | 技术 | 大屏点击「立即锁席」跳转小程序支付页 |
| 8 | 弹幕抽奖工具 + 红包雨插件 | 运营 | 测试弹幕关键词触发正常，红包雨可发 |
| 9 | 战报海报模板 + 实时数据填充接口 | 设计 | 接口能拉到实时观看人数+意向金数 |
| 10 | 备用网络（4G/5G 移动热点）切换测试 | 导播 | 主网断开 30 秒内切到备用，直播不中断 |

**D-3 彩排签字**：导播 ______  音控 ______  技术 ______

### 1.2 D-2 内容彩排（直播前 2 天）

**目标**：一姐 + 副播 + 场控走一遍流程，不穿妆，测话术节奏和时长。

| 时段 | 环节 | 时长控制 | 通过标准 |
| --- | --- | --- | --- |
| 20:00–20:05 | 开场品牌片 + 一姐亮相 | 5 分钟 | 品牌片准时起准时停，一姐亮相无冷场 |
| 20:05–20:10 | 一姐亲笔信（女王城堡传承叙事） | 5 分钟 | 情绪到位，不超时 |
| 20:10–20:13 | AI 创始人「上线」数字人亮相 | 3 分钟 | 口型同步，彩蛋「今晚你上线」收口干脆 |
| 20:13–20:28 | 商业模式讲解（四级代理+随心付+雷达） | 15 分钟 | 讲透不拖沓，价格公示页大屏同步翻页 |
| 20:28–20:33 | 价格公示页演示 + 1 折开闸 | 5 分钟 | 大屏实时跳数字，弹幕「已锁席」刷屏 |
| 20:33–20:43 | 见证环节（2 位种子团长+1 位学员） | 10 分钟 | 每人 3 分钟，不抢话不冷场 |
| 20:43–20:53 | Q&A 五问（异议库现场答） | 10 分钟 | 答得干脆，合规口径不跑偏 |
| 20:53–21:00 | 逼单环节（1 折名额倒计时） | 7 分钟 | 倒计时牌可见，场控喊「还剩 X 席」节奏准 |
| 21:00–21:25 | 意向金专属答疑（分会场） | 25 分钟 | 分会场问题接得住，不冷场 |
| 21:25–21:30 | 收官 + 战报海报发布 + 下期预告 | 5 分钟 | 战报海报实时生成，下期预告埋钩子 |

**D-2 彩排签字**：一姐 ______  副播 ______  场控 ______

### 1.3 D-1 全流程带妆彩排（直播前 1 天）

**目标**：完全按直播标准走一遍，穿妆+全设备+全流程，发现问题当场改。

| # | 检查项 | 通过标准 |
| --- | --- | --- |
| 1 | 一姐妆造（白金视觉）+ 胸麦 + 提词器 | 妆造无反光，胸麦无摩擦声，提词器字号够大 |
| 2 | AI 创始人「上线」数字人亮相彩排 ×2 次 | 第 1 次测技术，第 2 次测一姐配合节奏 |
| 3 | 三机位切换 + 大屏翻页 + 弹幕触发 | 切换台指令与大屏翻页同步误差 ≤1 秒 |
| 4 | 价格公示页开闸瞬间（1 折名额实时跳数字） | 跳数字流畅，弹幕「已锁席」触发正常 |
| 5 | 见证环节 3 位嘉宾连线（视频号连麦） | 连麦接通 ≤10 秒，画质音质达标 |
| 6 | 倒计时牌 + 场控喊话节奏 | 倒计时牌可见，场控喊话不抢一姐话 |
| 7 | 战报海报实时生成 + 朋友圈分发 | 海报生成 ≤30 秒，分发话术模板就绪 |
| 8 | 腾讯会议分会场画面同步 + 答疑接得住 | 分会场问题 3 秒内有人接，不冷场 |
| 9 | 备用网络切换（模拟主网断开） | 30 秒内切到备用，一姐无感 |
| 10 | 全流程时长控制（90 分钟 ±3 分钟） | 超时环节当场砍内容，不够环节当场补内容 |

**D-1 彩排签字**：一姐 ______  导播 ______  音控 ______  技术 ______  场控 ______  运营 ______

## 二、应急预案三套

### 2.1 设备故障预案

| 故障场景 | 黄色预警（3 分钟内修复） | 红色预警（3 分钟未修复） |
| --- | --- | --- |
| **主摄黑屏** | 副播口播「请大家稍等，我们正在切换画面」，切到副摄 | 切到腾讯会议分会场画面，一姐转语音直播继续 |
| **收音断掉** | 一姐换备用手麦，副播提示「声音恢复中」 | 切到纯图文直播（大屏翻页+字幕），一姐转文字直播 |
| **推流中断** | 立即切备用网络，副播发弹幕「网络恢复中请勿离开」 | 转腾讯会议为主会场，视频号挂「技术恢复中」海报 |
| **AI 数字人穿帮** | 立即切回一姐画面，副播圆场「上线正在充电」 | 砍掉数字人环节，一姐口播「上线今晚身体不适，我们直接进入商业模式」 |
| **大屏翻页卡死** | 切到备用大屏（笔记本直投） | 一姐手持 iPad 演示，副播发小程序链接到弹幕 |
| **弹幕抽奖工具失效** | 改用人工截图抽奖，场控喊「稍后公布」 | 砍掉抽奖环节，直接进入逼单，抽奖延后到朋友圈 |

**应急物资清单**：备用胸麦 ×2 / 备用手麦 ×1 / 备用笔记本 ×1 / 4G 热点 ×2 / 备用 iPad ×1 / U盘拷贝所有物料 ×2

### 2.2 嘉宾缺席预案

| 缺席场景 | 应对方案 |
| --- | --- |
| **见证嘉宾 1（种子团长）缺席** | 启用备选团长（提前备 2 位），副播口播「X 团长今晚临时有事，我们连 Y 团长」 |
| **见证嘉宾 2（学员）缺席** | 一姐口播「这位同学本来要来，但她在群里发了一段话我念给大家听」+ 念学员群留言 |
| **见证嘉宾 3（行业嘉宾）缺席** | 砍掉该环节，补 5 分钟一姐「女王城堡十年回顾」加时版 |
| **一姐本人突发状况** | 副播顶上（副播需全程参与彩排），开场改「一姐今晚失声，我是副播 XX，一姐让我代她宣布一件事」+ 播一姐预录视频 3 分钟 |
| **AI 创始人「上线」技术彻底崩盘** | 砍掉数字人环节，一姐手持 iPad 播放「上线」预录视频，口播「上线今晚在云端看着我们」 |

### 2.3 直播中断预案

| 中断场景 | 应对方案 | 恢复后续接 |
| --- | --- | --- |
| **视频号直播被封** | 立即转腾讯会议为主会场，朋友圈+社群发「直播间被限流，请到腾讯会议 XXX」 | 直播回放剪辑后发视频号/小红书，标题「被封的发布会」做二次传播 |
| **视频号直播卡顿掉线** | 30 秒内重开直播，副播发弹幕「10 秒后回来」 | 重开后一姐第一句「刚才卡掉的那 30 秒，我给大家补一个彩蛋」 |
| **腾讯会议分会场崩溃** | 分会场转微信群语音，公告「分会场转群语音，意向金专属答疑照常」 | 答疑内容整理成文字版，次日发意向金群 |
| **全网断网（极小概率）** | 一姐手持手机录像继续讲（离线录制），副播发朋友圈「直播间断网，一姐在录播，稍后发完整版」 | 录播版次日剪辑发布，标题「断网也没拦住的发布会」做事件营销 |
| **直播间人数断崖式下跌** | 场控发红包雨+弹幕抽奖，一姐喊「刚进来的同学不要走，5 分钟后开闸 1 折」 | 人数回升后继续流程，下跌段内容回放补发 |

**中断恢复话术模板**：

## 三、发布会后 24h 转化 SOP

### 3.1 24h 时间轴

| 时间 | 动作 | 负责人 | 目标 |
| --- | --- | --- | --- |
| **21:30 直播结束** | 战报海报朋友圈分发 + 意向金群发「1 折还剩 X 席」 | 运营 | 制造 FOMO |
| **21:30–22:00** | 分会场答疑延续 + 意向金持有者 1v1 私聊 | 一姐+团长 | 现场转化 |
| **22:00–23:00** | 直播回放剪辑 3 分钟高光版 + 朋友圈二次分发 | 设计+运营 | 触达未到场用户 |
| **23:00–24:00** | 当日数据盘点（观看人数/意向金到账/1 折锁席/上车卡） | 运营 | 漏斗复盘 |
| **D+1 08:00** | 意向金群早安播报 + 「1 折还剩 X 席，今日 24:00 涨 2 折」 | 运营 | 逼单倒计时 |
| **D+1 09:00–12:00** | 未支付意向金用户 1v1 私聊（团长承接） | 团长 | 深聊转化 |
| **D+1 12:00** | 2 折涨价公示（朋友圈+意向金群+小程序首页） | 运营 | 逼单第二波 |
| **D+1 14:00–18:00** | T3/T4 雷达名单 1v1 承接（推上车卡 1,000） | 团长+一姐 | 大额转化 |
| **D+1 20:00** | 意向金群晚间播报 + 「2 折还剩 X 席，明日 24:00 涨 3 折」 | 运营 | 持续逼单 |
| **D+1 21:30** | 24h 数据复盘会（一姐+团长+运营） | 全员 | 转化率复盘 |
| **D+2 00:00** | 3 折涨价公示 | 运营 | 进入 3 折阶段 |

### 3.2 转化漏斗与承接人

```
直播间观看 3,000 人
      ↓ 10% 触达
意向金群 300 人（直播中+直播后 24h）
      ↓ 50% 深聊
深聊 150 人（团长 1v1 承接）
      ↓ 40% 锁席
1 折锁席 60 人（直播中）→ 2 折锁席 30 人（D+1）→ 3 折锁席 15 人（D+2）
      ↓ 雷达 T3/T4 升单
上车卡 15 人（1,000 元 · 一姐+团长 1v1）
      ↓ 上车卡学员中筛代理
代理候选 5 人（招商组接手）
```

**承接人分配**：
- 意向金群播报 + 朋友圈分发 → 运营
- 未支付意向金用户 1v1 → 团长（按班级分配）
- T3/T4 雷达名单 → 一姐（T4）+ 团长（T3）
- 上车卡学员转代理 → 招商组

### 3.3 团长 1v1 承接话术包（24h 内）

**未支付意向金用户（直播中未锁席）**：
> 「同学，今晚发布会你看到了吧？1 折名额今晚 24:00 涨 2 折，你现在锁席还来得及。30 天可退，你唯一的风险是犹豫。要不要我帮你走一下流程？」

**已锁席但未上车卡（1 折→上车卡升单）**：
> 「同学，恭喜你锁到 1 折席！跟你同步个事——你的 1,000 意向金可以抵扣上车卡（1,000 元），等于上车卡白送。上车卡包含 12 节实战课+师徒制+项目承接资格。今晚 12 点前补差价锁上车卡，要不要？」

**T3 雷达（直播中随心付 100-499）**：
> 「同学，看到你直播中的支持了。跟你说个事——一姐的上车卡本月还剩 X 席，你的意向金可以抵扣。今晚语音聊 15 分钟？」

**T4 雷达（直播中随心付 500+）**：
> 一姐私信：「同学，我是上线夜校的一姐。看到你今晚的支持，想亲自说声谢谢。如果你对代理方向有兴趣，我们约个时间深聊？」

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {

  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');

      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }

  }
  return out.join('\n');
}
