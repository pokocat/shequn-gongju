<script type="text/markdown" id="mdsrc"># 种子团长招募投放包 V5（定稿版）

> 执行：W2-2 AI 工作包 · 2026-09-18
> 版本说明：V4 基础上全面换装定案命名（一姐/上线夜校/万物有言），升级为**可直接投放**执行件
> 启动门槛：1,000 元上车卡（30 天体验，升级 1 万团长全额抵扣）· 首批 **5 席**

---

## 一、招募画像（先列名单再发话术）

| 画像 | 去哪找 | 话术侧重 |
| --- | --- | --- |
| 实体店老板娘 | 朋友圈点赞之交、商会 | 人脉激活+门店数字化 |
| 宝妈群主 | 亲子群/社区团购群 | 居家副业+社群经验 |
| 前微商团队长 | 女王城堡老用户（优先！） | 信任直接+打法升级 |
| 知识博主/私域操盘手 | 同行社群 | 分润模型+数据雷达 |
| 保险/地产销售精英 | 行业群 | 人脉变现+转介绍 |

**动作**：今晚列 20 人名单 → 按「关系亲密度×人脉广度」打分 → 前 10 人进私聊名单。

## 二、私聊五步话术（分条发，间隔 10 分钟以上）

**① 开场（一对一）**
> 「在忙吗？占用你 5 分钟。我在做一件事，第一个想到的就是你。」

**② 是什么**
> 「一姐（就是做女王城堡那个陈彬彬）发起了主理人公社——上线夜校，7 天免费教普通人用 AI。第一期开 5 个班，正在选 5 位种子团长。」

**③ 干什么+得什么（分润三条）**
> 「团长三件事：拉个接龙群、每天发发课程链接、陪大家打卡。总部全包，AI 老师上线陪跑。
> 钱的事明说，三条线：
> **学员随心付的每一笔，你拿一半**，按月结算；
> 你专属码的课程成交，30% 佣金；
> 跑通第一期，正式区域合作通道优先给你。全部写协议。」

**④ 门槛**
> 「先别激动，掏 1,000 上车卡——30 天体验期，跑通了升级正式团长，这 1,000 全额抵扣；觉得不合适，30 天内服务照常交付完，你不亏。
> 我只要 5 个人：有圈子、每天 1 小时、连 7 天、先做事再谈回报。」

**⑤ 行动**
> 「感兴趣回『1』，今晚 8 点语音 15 分钟，我把 SOP 和课件给你看。名额留到今晚 12 点。」

## 三、朋友圈三版（配图用 W1-3 视觉四件套截图）

**D-1 预热版（20:00 发布）**
> 十年前我在微信里建了 500 个群。
> 十年后，AI 来了，我在选 5 个人跟我再干一次。
> 明天说。

**D0 主发版（09:00）**
> 招 5 位种子团长。
> 一姐的上线夜校：7 天免费教普通人用 AI，AI 老师叫「上线」。
> 你要做的：拉个群、发发链接、陪打卡。
> 你得的：学员随心付**你拿一半**、课程成交 30%、区域优先权。
> 门槛 1,000 上车卡，30 天跑不通全额抵扣或退出。
> 只聊前 5 位，私信「团长」。

**D+1 追发版（21:00，晒真实进展）**
> 已进 2 位：一位社区团购群主，一位开美容院的姐姐。
> 剩 3 席。今晚 12 点截止——不是营销话术，是 5 个班真的只开 5 个群。

## 四、45 秒口播词（招募视频）

> 「我在招 5 个人。做女王城堡那年，我带过 25 万女性创业——现在我把这套打法升级了，教普通人用 AI 开一人公司。7 天免费课，AI 老师上线全包教，你只要拉个群陪打卡。学员随心付你拿一半，课程成交拿三成。1,000 上车卡锁定，跑不通全额抵扣。我不承诺躺赚——一上来就跟你谈躺赚的，都是想赚你钱的。私信『团长』，只聊前 5 位。」

## 五、限量机制话术（催单用）

- T-3h：「还剩 2 席，今晚 12 点截止。」（数字必须真实）
- 面对犹豫：「你纠结的这三天，价格不会变，但席位会。5 个班只配 5 位团长，这是产品结构，不是饥饿营销——第二期要等一个月。」
- 面对比价：「1,000 你买的是 30 天的验证：你的圈子值多少钱，体验报告会告诉你。这个答案值不止 1,000。」

## 六、报名承接流程（当日闭环）

```
回复「1」→ 8 点语音 15 分钟（结构：她的事 5 分/项目 5 分/分润与门槛 3 分/下一步 2 分）
→ 发三件：团长 SOP+课程设计+招募包本文
→ 收 1,000 上车卡（对公/收款码，发凭证）
→ 拉团长群（5 人小群，一姐亲自致辞）
→ 排班：随 W2-4 普惠班首期同步开班
```

## 七、投放排期（7 天）

| 天 | 动作 |
| --- | --- |
| D1 | 名单 20 人 → 私聊前 10 人（五步话术）+ 朋友圈预热版 |
| D2 | 朋友圈主发 + 私聊后 10 人 + 语音承接 |
| D3 | 5 席锁定 + 团长群建立 + SOP 培训 1 小时 |
| D4 | 追发版（如未满）+ 降级预案（3 席也开班） |
| D5-D6 | 团长各自拉群预热（朋友圈三连发模板已备） |
| D7 | 5 班齐开倒计时 + 承接 W2-3 蓄水 |

## 八、话术纪律（红线）

禁用：躺赚、下级、代理分成、卡位、发展团队收益、保证收入、月入 X 万；
必讲：**打赏/随心付不分账给团长之外任何人**（团长拿一半是公开规则）、「跑不通 30 天退出」主动说；
自检：每条话术发出去前问自己——被截图挂到网上，我敢认吗？

const md = document.getElementById('mdsrc').textContent;

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);

  }, { passive: true });

document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
