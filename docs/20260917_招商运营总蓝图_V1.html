## 一、项目全景一页图

```
品牌层：王炸社（总品牌）· 天选姐（创始人IP）· 上线（AI创始人/001号主理人）
   │
   ├─ B 端四级：团长 1 万 → 县代 3 万 → 市代 12 万 → 省市分公司 50 万
   │     （预备通道：1,000 上车卡 / 体验期 30 天）
   │
   ├─ C 端产品线：普惠班（0元随心付）→ 会员（99/月·699/年）→ 实战营（399-1,980）
   │     → 操盘手营 2,980 → 师徒制（19,800/49,800）→ 项目承接
   │
   ├─ 招商节奏：9 个月三波闸门（M2 团长闸 / M4 县代闸 / 折扣月月涨）
   │
   └─ 运营节奏：普惠班滚动 → 随心付雷达分层 → 升单触发器 → 大事件日历
```

## 二、各级别招募目标总表（9 个月）

| 级别 | 招募目标 | 折扣结构（人数×价格） | 营收 | 到位节奏 |
| --- | --- | --- | --- | --- |
| 市代理 | **1,000 席** | 1折 500×1.2万 / 2折 200×2.4万 / 3折 100×3.6万 / 4折 100×4.8万 / 5折 50×6万 / 原价 50×12万 | **2,820 万** | M1–M8（M1-2 铺 1 折大部队） |
| 社群团长 | **5,000 人** | 同构：1折 2,500×1,000 / 2折 1,000×2,000 / 3折 500×3,000 / 4折 500×4,000 / 5折 250×5,000 / 常价 250×1万 | **1,175 万** | M2–M6（月均 1,000+） |
| 区县代理 | **2,000 区**（一区一位） | 团长升级补差：早批 1,000 区×补 1 万（减半）+ 后批 1,000 区×补 2 万 | **3,000 万** | M4–M7 |
| 省市分公司 | **首城 1–3 席** | 19.8 万卡位起（常价 50 万） | 60–150 万 | M6–M9 |
| **B 端合计** | — | — | **≈7,000 万** | — |

## 三、各级别盈利模型（怎么挣钱 · 多久回本）

### 3.1 社群团长（门槛 1 万 / 1 折进场 1,000）

| 收入线 | 机制 | 月收入模型（活跃团长） |
| --- | --- | --- |
| ① 普惠班随心付 | 学员随心付款的 **50%** | 每月 2 期班×80 人×30% 付款率×50 元均值×50% = **2,000** |
| ② 课程/会员成交 | 专属码成交的 **30%** | 每期 8 单×99 元×30%×2 期 = **475** |
| ③ 进阶课/实战营 | **20%** | 每期 2 单×399×20%×2 期 = **320** |
| 合计 | — | **约 2,800/月**（活跃中位） |

- **回本周期**：1 折进场（1,000）→ 1 期班即回；常价 1 万 → 约 4 个月（中位）/8 个月（保守）
- **头部团长**（班均 150 人+开班 4 期/月）：月 6,000+，1 个月回本
- **升级出口**：优秀团长升县代（M4 后补差减半通道）

### 3.2 区县代理（门槛 3 万 / 折扣期补差 1 万）

| 收入线 | 机制 | 月收入模型（成熟县代） |
| --- | --- | --- |
| ① 自营分润 | 同团长（自开班+零售） | 3,000 |
| ② 团长陪跑年卡 | 卖给辖区团长 1,980/年（自愿购买） | 辖区 30 团长×50% 购买÷12 = **2,475** |
| ③ 推荐费 | 推荐团长 500/人 | 月均 2 人 = 1,000 |
| 合计 | — | **约 6,500/月** |

- **回本周期**：折扣期补差 1 万 → 约 2 个月；全价 3 万 → 约 5 个月
- **关键资产**：辖区团长的开班数据 = 县代的「带兵成绩单」

### 3.3 市代理（门槛 12 万 / 1 折进场 1.2 万）★ 体系核心

| 收入线 | 机制 | 月收入模型（成熟市代） |
| --- | --- | --- |
| ① 自营+直属团队零售 | 自营分润 30% | 3,000 |
| ② 区县陪跑年卡 | 卖给辖区县代 5,000/年 | 10 县代×60%÷12 = **2,500** |
| ③ 推荐费 | 县代 1,000 / 团长 500 | 月均 1 县代+2 团长 = **2,000** |
| ④ 市域活动 | 一日营（598）主办方分成 | 场均 50 人×毛利 200 = 10,000/场×月 1 场 |
| 合计 | — | **约 17,500/月**（含活动） |

- **回本周期**：1 折进场 1.2 万 → **1–2 个月**；2–3 折进场 → 3–5 个月；原价 12 万 → 8–12 个月
- **1 折大部队的价值逻辑**：进场便宜 → 回本极快 → 案例速成 → 吸引后批涨价进场者（50/20/10/10/5/5 结构的自我实现）
- **红线**：市代不拿团长/县代业绩抽成——收入=自营+服务年卡+定额推荐费+活动分成

### 3.4 省市分公司（门槛 50 万 / 卡位 19.8 万）

| 收入线 | 机制 | 年收入模型 |
| --- | --- | --- |
| ① 市代运营体系年卡 | 20,000/年×市代数 | 30 市代×60% = **36 万/年** |
| ② 大项目联营 | 数字人/代运营/行业方案（合同制） | 50–200 万/年 |
| ③ 线下联办 | 游学 9,800/人、天选之夜 | 20–50 万/年 |
| 合计 | — | **100–300 万/年** |

- **回本周期**：卡位 19.8 万 → 12–18 个月；含团队成本 18–24 个月
- 六项门槛不变（注册公司/团队≥3 人/运营资金等）

### 3.5 总部盈利模型

| 收入线 | 9 个月理论值 |
| --- | --- |
| B 端门槛费 | 7,000 万 |
| C 端随心付（50%） | 1,000 万 |
| C 端课程/会员（约 70%） | 670 万 |
| C 端实战营/进阶（80%） | 480 万 |
| 师徒制（19,800/49,800） | 180 万 |
| **合计** | **≈9,300 万**（内部理论满额，含折扣期让利；不含项目线/分公司） |

> C 端测算口径：M2–M9 共 8 个月，5,000 团长×平均开 2 期班×80 人 = **80 万人次学员流水量**；随心付均值 25 元/人次。

## 四、招商节奏深度分析（9 个月三波闸门）

| 闸门 | 触发 | 动作 | 目的 |
| --- | --- | --- | --- |
| 起盘 | W1–W2 意向金蓄水 ≥800 人 | M1 起盘发布会，1 折 500 席开闸（首日目标 100 单） | 大部队低门槛进场 |
| 团长闸 | M1 中旬市达 100 人 | M2 初开（1 折 1,000） | 为市代造兵 |
| 县代闸 | M3 末团长达 2,000 人 | M4 开（团长升级补差减半） | 给团长升级出口 |
| 满员 | M8 市代 1,000 席 | 常价锁定 | M9 天选之夜+下一波（上调 50%） |

**涨价节奏**：M3 起月月涨一档（每月 1 号公示）；**兜底铁律：人数没到不涨价**（顺延不强涨，进度表是基准不是死线）。

**结构自洽性**：1 折进场的人回本最快（市代 1–2 个月）→ 他们的成功案例是 2–5 折进场者的信心来源 → 原价 50 人看到的是已验证的完整体系——**越晚越贵但越稳**，这就是 50/20/10/10/5/5 结构的内在逻辑。

## 五、运营节奏深度分析（三条线并行）

### 5.1 普惠班滚动循环（C 端现金流+雷达）

```
团长开班（7天课）→ 学员随心付 → 雷达分层（0元/1-99/100-499/500-999/≥1000）
   → 低层学分培育 → 中层推9.9主题班 → 高层推会员99/月
   → ≥500触发团长1v1推上车卡 → ≥1000天选姐出面推B端
```

- M3 起普惠班规模化（M4 目标 100 班/月在跑）；
- 随心付三底线：0 元可学完 / 不设参考价 / 付款与权益脱钩。

### 5.2 升单触发器（八层自动承接）

<script>
// 硬编码文件名（由生成脚本写入）
document.getElementById('fname').textContent = '20260917_招商运营总蓝图_V1.md';

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
