<script type="text/markdown" id="mdsrc"># 上线夜校 · 7 天 AI 普及课 课件包 V1（P0）

> 执行：W1-7 AI 工作包 · 2026-09-18
> 依据：AI 普及计划 7 天课程详细设计 V1 · 团长 SOP 手册 V1
> 工具基线：全免费（豆包/DeepSeek/Kimi/即梦/剪映/腾讯文档）——学员零门槛
> 单课时长 10 分钟 · 结构：钩子 0:30 → 原理 2:00 → 演示 4:30 → 作业 1:30 → 预告 1:30

---

## Day 1 · AI 是什么（破冰：会用）

**视频脚本**

| 时间 | 段落 | 口播要点 |
| --- | --- | --- |
| 0:00 | 钩子 | 「你手机里躺着一个不要工资的助理，你却从没使唤过它。」 |
| 0:30 | 原理 | AI 三个比喻：①会接话的鹦鹉（说啥接啥）②见过全网的书虫（答啥都懂点）③越用越懂你的实习生；破除"AI 会取代我"焦虑：取代你的不是 AI，是会用 AI 的同行 |
| 2:30 | 演示 | 简单案例：下载豆包 → 问「帮我给闺蜜写条生日祝福，要幽默」→ 现场改两轮；进阶案例：同一问题问 DeepSeek，看 AI 也会"思考" |
| 7:00 | 作业 | 安装任一 AI App，问出你的第一个问题，截图发群 |
| 8:30 | 预告 | 明晚：一个公式，让 AI 替你写任何东西 |

**讲义 5 点**：①AI=接话鹦鹉+书虫+实习生 ②免费工具清单 ③提问越具体答案越好 ④不满意就追问改 ⑤AI 是杠杆不是威胁。

**作业模板**：`【Day1】姓名+城市：我的第一个问题是____，AI 的回答让我惊讶的是____`。

**上线（AI 老师）点评话术**：好问题：「这个问题问得好——你已经会用 AI 的方式思考了」；普通：「明天教你把它问得更好」；答非所问：「恭喜你发现了 AI 第一个bug：它猜你心思的能力还得练——明晚的公式就是解药」。

## Day 2 · AI 写作（会写：万能公式）

**脚本**：钩子「不会写的人这辈子吃亏：文案、周报、道歉信……」→ 原理：**万能提示词公式 = 角色+任务+要求+示例**，示范拆解每个词 → 演示简单：让 AI 当「10 年文案老手」写水果店开业朋友圈；进阶：给示例让 AI 模仿你的语气写 3 条 → 作业：用公式写一条你自己真实要发的文案 → 预告：明天让 AI 画画。

**讲义**：①公式四件套口诀「给身份、派任务、提要求、给参考」②示例是最好的老师 ③不满意就追加「再来 3 条更口语的」④写完自己念一遍 ⑤公式适用于一切 AI。

**作业**：`【Day2】用公式写一条真实文案：场景____，我给的公式是____，成品____`。

**上线点评**：「注意到了吗？你给的示例越像自己，AI 写得越像你——这就是公式的秘密」。

## Day 3 · AI 做图（会画：文生图公式）

**脚本**：钩子「老板要图、孩子要海报、朋友圈要配图——设计师排期三天，AI 三十秒」→ 原理：**文生图公式 = 主体+场景+风格+光线**，四个词各自的作用 → 演示简单：即梦生成「一杯奶茶」加公式前后对比；进阶：给小卖部做店招（主体招牌+场景店门口+风格国潮+光线暖光）→ 作业 → 预告：明天教你让 AI 替你查资料。

> ⚠️ **当晚团长动作**：发随心付说明（SOP 固定文案，照抄不改）——时点理由：视觉冲击日满意度峰值+距结营 4 天沉淀期，不显功利。

**讲义**：①四词公式 ②风格词库（国潮/极简/胶片/插画风）③同一提示词多生成几次挑最好 ④商用注意平台版权说明 ⑤改局部=追加描述。

**作业**：`【Day3】给你的店/家/朋友圈生成一张图：提示词____，挑出的最好一张____`。

## Day 4 · AI 查资料（会查）

**脚本**：钩子「孩子作业不会、政策看不懂、真假消息分不清」→ 原理：AI 搜索 vs 普通搜索（会总结 vs 给链接）；Kimi/秘塔演示 → 简单：查「杭州灵活就业社保政策」拿整理好的答案；进阶：追问「跟我表姐情况对比一下」→ 作业 → 预告：明天让 AI 算账。

**讲义**：①AI 搜索=自动总结的秘书 ②重要信息务必点开原文核对 ③交叉验证两个 AI ④让它列来源 ⑤查完可让它做成表格。

**作业**：`【Day4】查一个你真实关心的政策/问题：问题____，AI 答案____，我核对后的结论____`。

**上线点评**：「第 4 天了——你已经超过 90% 只把 AI 当聊天玩具的人」。

## Day 5 · AI 表格（会算）

**脚本**：钩子「月底对账、进销存、员工排班——Excel 公式学不会？说人话就行」→ 原理：AI 操作表格=描述需求给 AI（贴数据/传文件）→ 演示简单：一张水果店销售表问「哪天卖最好、哪种利润高」；进阶：让 AI 生成下周进货建议 → 作业 → 预告：明天压轴——做一个你自己的数字分身。

**讲义**：①表格丢给 AI 说人话 ②敏感数据脱敏后再传 ③AI 给结论要求看依据 ④复杂表分段问 ⑤结果导出再微调。

**作业**：`【Day5】一张真实表格+一个真实问题：我的问题是____，AI 的结论____`。

## Day 6 · AI 数字人（会播：压轴+升单埋点）

**脚本**：钩子「明天毕业，今晚送你一个分身」→ 原理：数字人=形象+声音+文稿三件套；剪映数字人免费额度演示 → 简单：用自己的照片+一段文字生成 15 秒数字人视频；进阶：一姐数字人开场白示范「大家好，我是上线——一姐造出来的 AI 创始人」→ **埋点**：想做定制数字人/数字员工的，结营后找团长登记（雷达 T3+ 线索）→ 作业 → 预告：明晚毕业礼。

**讲义**：①三件套 ②免费工具够用起步 ③肖像权只用自己的 ④数字人口播注意 AI 标识合规 ⑤进阶定制=夜校项目承接线。

**作业**：`【Day6】我的数字分身说了一句：____（15 秒视频）`。

## Day 7 · 毕业礼（收口：随心付+升单）

**脚本**（15 分钟特别版）：
- 0:00-3:00 七天回顾快剪；
- 3:00-6:00 优秀作业颁奖（团长提前收集 5 份，点名表扬）；
- 6:00-9:00 **随心付说明**（固定文案：这堂课按内容对得起 1000 元体系，公益期一分不收，觉得有用随心付——你的打赏不是给我，是给「上线」充算力）；
- 9:00-12:00 雷达行动：≥500 私聊团长、≥1000 天选姐出面；
- 12:00-15:00 结营词+下期主题班预告（9.9 押金制）+「今晚，你上线」。

**讲义**：结营证书模板+学习路径图（普惠班→主题班→会员→实战营）。

**上线点评（结营）**：「七天，你的每一次作业我都看过。有人从没装过 AI 到做出自己的数字分身——这就是上线夜校的意义。今晚，你上线。」

    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
</script>
