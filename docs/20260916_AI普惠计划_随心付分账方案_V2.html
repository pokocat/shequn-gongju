<script type="text/markdown" id="mdsrc"># AI 普惠计划 · 随心付分账方案（V2 · 取代公益打赏版）

| 字段 | 内容 |
| --- | --- |
| 文档编号 | 20260916_AI普惠计划_随心付分账方案_V2 |
| 状态 | V2 已确认路线（创始人 2026-09-16 定：随心付路线 + 团长 50% 分账），细节待定稿 |
| 关联 | 取代 [[20260916_AI普及计划_公益接龙打赏方案]]（V1 公益定性版，已废止）· [[20260916_社群运营计划_品牌整合版]] · [[20260916_种子团长招募营销包_V3]] |
| 一句话定位 | **0 元可学完 + 随心付 + 团长分一半——商业定性，明账分钱，无需公示。** |

> **定性变更说明**：V1 的「公益 + 打赏 + 流向公示」路线已废止。原因：打赏要分账给团长，钱的性质即从善款变为课程收入，公益名头与分账不能共存。V2 改为知识付费行业成熟的「随心付（Pay What You Want）」模式：价格自主、0 元起、商业分账。公示义务随之消失。

---

## 一、机制总览（V2）

```
AI 普惠计划（7 天社群课，原价锚 1,000 元）
   ├── 报名：接龙进群，0 元起
   ├── 学习：每日打卡 + 学分（不付费与付费学员课程内容完全一致）
   ├── 付款：「随心付」——觉得值就付，付多少自己定，0 元也能学完
   │     └── 对公/平台统一收款 → 团长 50% / 总部 50%（月结）
   └── 内部：付款金额 × 接龙行为 → 客户分层雷达
         → 团长按分层跟进 → 转化课程/会员/代理
```

**三条底线（取代原「公益三原则」）**：
1. **0 元可学完**——不付一分钱也能上完全部 7 天课程（「免费」承诺的真实基础）；
2. **不设参考价**——任何话术不暗示金额档次、不设默认金额（否则随心付变定价）；
3. **付款与权益脱钩**——付 0 元和付 999 元得到同样的课程；付款者只得荣誉（随心榜公示、结业徽章），不多内容。

## 二、产品包（不变）

7 天课程表沿用 V1（D1 对话/D2 写方案/D3 图视频/D4 查资料/D5 管客户/D6 副业/D7 毕业课）。原价锚依然成立：与 1,000 元上车卡同款课程体系，上车卡真实在售。

## 三、玩法机制（V2 改造版）

### 3.1 接龙报名（保留）

群内接龙 `#AI普惠接龙 第 X 位｜昵称｜城市`，团长专属接龙码（带参二维码）归因到推荐人——社交证明与归因逻辑不变。

### 3.2 随心付话术（替换原「算力」话术）

- 付款按钮文案：**「这门课，你定价」**；
- 话术 A（开课）：「这门课按内容对得起 1,000 元。但普惠期 0 元起随心付——一分不付也能学完；觉得值，付多少你定。」
- 话术 B（结课）：「7 天上完了。值多少，你说了算——付款入口今晚 12 点关闭，不付也欢迎继续蹭课，我们不催。」
- 话术 C（团长招募侧）：「学员随心付的每一笔钱，**开班团长拿一半**，按月结算——你的班你收钱，明明白白。」

### 3.3 随心榜（替换原「充电榜」）

- 付款者自愿晒单上榜（荣誉激励，替代原「算力账单」公示功能）；
- 团长维度「随心榜」城市榜——比拼的不是收款额，是**人均认可度**（总付款 ÷ 学员数），防止团长只追求大额；
- **无需流向公示**——商业收入不走善款公示逻辑；如需透明度加分，可自愿按月发一张经营简报（非义务）。

### 3.4 荣誉体系（保留微调）

全勤打卡→结业证书；付款者→随心榜+小太阳徽章；团长→城市随心榜荣誉旗。

## 四、分账与结算（V2 核心）

| 钱的来源 | 团长 | 总部 | 结算方式 |
| --- | --- | --- | --- |
| **学员随心付款** | **50%** | 50% | 对公/平台统一收款，月结，签协议 |
| 后续课程成交（团长码） | 30% | 70% | 同上 |
| 进阶课成交 | 20% | 80% | 同上 |
| 正式代理通道（1 万起） | 差价+定额推荐费 | — | 走代理协议 |

**结算纪律**：
1. 全部款项走**总部对公/平台**，禁用团长个人收款码直收（税务与归因都乱）；
2. 团长佣金按月结算，走劳务报酬代扣个税或灵活用工平台开票（二选一，签约时定）；
3. 比例写入《团长合作协议》，话术、协议、收款页三处数字一字不差；
4. 退款场景：随心付款 7 天内可申请全额退，团长佣金同步冲回。

## 五、打赏分层雷达（保留，逻辑更顺）

V1 的「打赏分层」升级为「**随心付分层**」——付的本来就是课程款，付费意愿信号更直接：

| 付款区间 | 分层 | 团长跟进动作 |
| --- | --- | --- |
| 0 元 | 内容型 | 学分培育，下期再测 |
| 1–99 | 认可型 | 邀 9.9 主题班 |
| 100–499 | 意向型 | 推上线会员 99/月 |
| 500–999 | 高意向 | 1v1 推上车卡（1,000，体验升级抵扣） |
| ≥ 1,000 | 强意向/强关系 | 天选姐/总部面谈：上车卡升级 + 代理资格预沟通 |

关系强度矩阵（付款 × 接龙速度）与团长人脉评估逻辑沿用 V1。

## 六、合规红线（V2 版 · 五条）

1. 对外**不再使用「公益/捐赠/善款」**表述——随心付是价格自主的课程销售；
2. 「0 元可学完」必须真实（不付款者完整上课，不设隐藏墙）；
3. 不设参考价、不暗示金额档次、付款不挂钩额外课程权益；
4. 高客单（1 万+）对公+合同+冷静期沿用；
5. 团长协议明确单层结算：只有课程佣金与随心付分账，无任何层级计酬。

## 七、30 天启动清单（沿用，替换两个节点）

W1：课程包+接龙工具+**随心付收款通道（对公/平台+分账配置）**+团长协议模板（含 50/30/20 比例）；
W2：3–5 位种子团长开营（总部陪跑）；
W3：**首期随心榜发布** + 分层名单交付团长跟进；
W4：复盘调参 → SOP 定稿 → 全代理开放。

## 八、待确认决策项

| # | 决策项 | 选项 |
| --- | --- | --- |
| 1 | 计划名称 | AI 普惠计划（推荐）/ AI 平权计划 / 免费公开课随心付 |
| 2 | 追光夜校常设直播课是否同步改随心付 | 同步改（统一口径，推荐）/ 夜校保持免费+打赏不分账（总部自营，无分账即无公示压力） |
| 3 | 团长佣金结算通道 | 灵活用工平台（推荐）/ 劳务报酬代扣 |
| 4 | 退款窗口 | 7 天（推荐）/ 3 天 |

---

    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
</script>
