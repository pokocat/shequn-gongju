---

## 〇、方向转向说明

V2.1 的古典系名（明堂社/坤钧社/曦校长）五行对路但**网感不足**——适合挂在营业执照上，不适合被喊出来。V3 转向词根化命名：**选定一个火属性词根，贯穿所有品牌位，形成"命名宇宙"**——传播记忆成本最低、社群黑话自生成。

## 一、网感命名三原则

1. **能开口喊**——名字要能当称呼喊出来（"燃姐来了"比"明堂创始人来了"传播效率高一个量级）；
2. **能造身份词**——社员叫什么比社群叫什么更决定传播（燃友 / 追光者）；
3. **自带一句话**——每个名字配一句能直接发朋友圈的钩子，并支持话题标签（#今晚燃灯 / #追光的人）。

---

## 二、燃系宇宙（词根：燃 · 焰 · 灯）

| 品牌位 | 名字 | 五行 | 传播钩子 / 口号 |
| --- | --- | --- | --- |
| 社群母品牌 | **燃社** | 火金 | "进燃社，做燃的事" · 社员称呼＝**燃友**（谐音网友） · #燃友集合 |
| AI 夜校 | **燃灯夜校** | 火火 | "每晚八点，燃一盏灯" · 学员＝**燃灯者** · 群打卡仪式＝"今晚燃灯" · #今晚燃灯 |
| 创始人 IP | **燃姐** | 火火 | 人设一句话："冷场的地方，燃姐来了" |
| AI 创始人 | **焰零** | 火火 | "燃姐造的焰零，从 0 开始烧" · 公社第 001 号主理人 |
| 公益总品牌 | **掌灯计划** | 金火 | "为没被听见的人，掌一盏灯"（与掌灯人意象同源，火属性） |
| 招商/年度活动 | **燃之夜** / 焰遇大会 | 火火 | "最热的一夜" · 焰遇＝谐音艳遇，"最美好的相遇是焰遇"（遇属木，正式启用前可只作活动名） |
| SaaS 系统 | **焰阵** | 火火 | "焰阵系统"——阵（array）自带科技感，火焰矩阵 |
| 年度收官 | 燃灯者大会 | 火火木 | 一年燃灯者线下大聚会（校属木为人设保留词，显著性在前缀） |

**宇宙总口号**：把冷日子点燃。

## 五、身份词系统（传播的真正引擎）

| 词根宇宙 | 社员称呼 | 学员称呼 | 打卡仪式 | 大会 |
| --- | --- | --- | --- | --- |
| 燃系 | 燃友 | 燃灯者 | "今晚燃灯" | 燃之夜 |
| 光系 | 追光者 | 追光生 | "今天追光" | 光年大会 |

---

## 六、在先使用提示（正式检索前必看）

- **追光**：追光动画（影视知名）——社群/教育类需检索，影视动画类别避让；
- **光年**：AI 圈曾有"光年之外"（已停运），"光年"为常见词——9/42 类需检索；
- **灯塔**：教育领域在先使用较多；
- **充电**：教育语境常用词，描述性偏强，宜组合注册；
- **燃社 / 焰零 / 焰阵 / 曜零**：造词感强，通过概率相对更高（仍需检索）；
- **超新星**：天文/文娱常见词，检索后启用。

## 七、待确认决策项

| # | 决策项 | 选项 |
| --- | --- | --- |
| 1 | 主词根宇宙 | 燃系 / 光系 / 两套混搭 |
| 2 | 散名是否插入 | 如「充电夜校」替换「追光夜校」 |
| 3 | 确认后动作 | 锁定第一批送检名单（主选+备选） |

    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
</script>
