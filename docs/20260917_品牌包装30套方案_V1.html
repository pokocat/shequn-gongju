## 一、七大家族总览

| 家族 | 商标 | 气质 | 善意融合总方向 |
| --- | --- | --- | --- |
| A | **One&Co** | 一个人的精品公司，「&」是温度 | Co = Company/Commune/**Care**（关怀）——善意写进词根 |
| B | **OPC Planet** | 星球文明，超级个体的家园 | 善意是这颗星球的「法律」 |
| C | **OPC Lab** | 实验室，一人公司试验场 | 善意经济学是常设课题 |
| D | **GO-OPC** | 行动派，说干就干 | 每一次 GO 都是一次善意举动 |
| E | **NEO-OPC** | 新纪元，新商业文明 | 善意经济 = 新商业文明 |
| F | **OPC CLUB** | 俱乐部，会员制的尊贵 | 善意是社章（入社即承诺） |
| G | **S-OPC** | 超级一人公司 | 善意是超能力 |

## 二、30 套方案总表

### A · One&Co 家族（#1–7）

**#1（本组推荐）**：**One&Co CLUB**｜主理人公社｜艺名**一姐**｜数字人**蔻蔻（Co-1）**｜slogan「一个人，一家公司，一群同路人」｜善意机制：**社章制**——入社签「善意经营承诺」，善意账户积分可视化｜气质：温暖商务。一姐=One Person 的中文双关（行业头牌）。

**#2**：One&Co｜主理人公社｜**堡主**｜蔻蔻｜「十年前一座城堡，今天一家公司」｜善意机制：**城堡新法**——女王城堡升级叙事，城堡的新规矩就是善意经济｜气质：传承叙事。

**#3**：One&&Care（One and Care）｜善意公社｜**善姐**｜**善善**｜「把关怀写进名字」｜善意机制：**品牌本体**——Care 直接入名，随心付三底线就是品牌底线｜气质：治愈系。

**#4**：One&Co Lab｜一人公司实验室｜一姐｜蔻蔻｜「把自己当成一家公司来做实验」｜善意机制：**课题制**——每季一个善意经济学公开实验（如「0 元课能不能活」）｜气质：理性实验。

**#5**：ONE&CO｜主理人公社｜**社长**｜蔻蔻｜「社长，也是 One 长」｜善意机制：**社长责任**——社长带头日更善意（创始人 IP 的善意示范义务）｜气质：社团制。

**#6**：One&Co｜一人公司联盟｜一姐｜蔻蔻｜「One 是你，Co 是我们」｜善意机制：**互补制**——一人公司互为客户/互为伙伴（善意内循环）｜气质：联盟感。

**#7**：One&Co Club｜掌灯公社｜**掌门**｜蔻蔻｜衔接掌灯计划公益线｜善意机制：**掌灯制**——每位主理人认领一盏灯（公益发声任务）｜气质：公益融合。

### B · OPC Planet 星球家族（#8–12）

**#8（本组推荐）**：**OPC Planet**｜一人公司星球｜艺名**星主**｜数字人**小星（Planet-1）**｜「每个一人公司，都是一颗自带引力的星」｜善意机制：**星球公约**——善意是星球引力（利他者聚人）；善意账户=「星力值」｜气质：浪漫宏大。

**#9**：OPC Planet｜主理人星球｜**舰长**｜小星｜「一人驾驶，星际远航」｜善意机制：**领航制**——老主理人为新人领航（善意传承的具象化）｜气质：冒险探索。

**#10**：OPC Planet｜善意星球｜星主｜小星｜「善意是这个星球的氧气」｜善意机制：**星球生态**——公益项目=星球生态建设（掌灯计划=种树）｜气质：理想主义。

**#11**：OPC Planet｜曦光公社｜**曦姐**（八字喜火沿用）｜小星｜「每个日出，都是上线」｜善意机制：**日出口号**——善意如晨光，日更即日出｜气质：晨光温暖。

**#12**：OPC Planet｜一人星｜**球长**｜小星｜「一人一星，星球成海」｜善意机制：**星海制**——个人善意汇成星海（公益数据可视化大屏）｜气质：科幻社区。

### C · OPC Lab 实验室家族（#13–16）

**#13（本组推荐）**：**OPC Lab**｜一人公司实验室｜艺名**所长**｜数字人**阿博（Lab-1）**｜「把创业当成可实验的科学」｜善意机制：**公开实验**——善意经济学每个公式都做公开实验并公示结果（透明=善意）｜气质：科学严谨。

**#14**：OPC Lab｜善意实验室｜所长｜阿博｜「善意是可以被实验和复制的」｜善意机制：**善意配方**——把「善意→回报」做成可复制的标准动作库（SOP 化的善意）｜气质：方法论感。

**#15**：OPC Lab｜主理人研究所｜**主理员**｜阿博｜「研究自己这家公司」｜善意机制：**样本共享**——成员的一人公司数据匿名共享，集体研究（互助式善意）｜气质：智库感。

**#16**：OPC Lab｜一号实验室｜**一号**｜阿博｜「你是自己人生的一号研究员」｜善意机制：**001 编号**——每位主理人有编号，001 号主理人是 AI 创始人（沿用既定叙事）｜气质：编号仪式感。

### D · GO-OPC 行动家族（#17–20）

**#17（本组推荐）**：**GO-OPC**｜出发公社｜艺名**队长**｜数字人**小G（GO-1）**｜「一个人，也要立刻出发」｜善意机制：**GO 即善意**——每次行动绑定一个利他动作（开班=公益科普）｜气质：行动力爆棚。

**#18**：GO-OPC｜一人出发｜队长｜小G｜「GO，就是一个人最好的公司」｜善意机制：**同行制**——出发者必须带一个同行者（老带新的善意结构）｜气质：互助热血。

**#19**：GO-OPC｜善意出发地｜**G 姐**｜小G｜「从善意出发，向回报抵达」｜善意机制：**起终点**——善意是 GO 的起点，商业回报是自然终点（善意飞轮的动词化）｜气质：公路片感。

**#20**：GO-OPC｜上线公社｜**上线姐**｜**上线**（数字人沿用名）｜「今晚，你上线」｜善意机制：**上线仪式**——每晚上线学习=日行一善（知识普惠）｜气质：夜行动感。

### E · NEO-OPC 新纪元家族（#21–23）

**#21（本组推荐）**：**NEO-OPC**｜新一人公司纪元｜艺名**Neo 姐**｜数字人**妮奥（Neo-1）**｜「旧商业已死，善意是新纪元的货币」｜善意机制：**新旧对照**——零和博弈（旧）vs 共生共赢（新），善意经济即新纪元宪法｜气质：宣言感。

**#22**：NEO-OPC｜善意新纪元｜Neo 姐｜妮奥｜「第一次，善意成了硬通货」｜善意机制：**善意货币**——善意账户积分可兑换权益（善意资本化的游戏化）｜气质：经济实验。

**#23**：NEO-OPC｜新主理人公社｜**新姐**｜妮奥｜「每天都是新的公司」｜善意机制：**日新制**——每日一善（日更善意的组织化）｜气质：日日新哲学。

### F · OPC CLUB 俱乐部家族（#24–27）

**#24（本组推荐）**：**OPC CLUB**｜主理人俱乐部｜艺名**社长**｜数字人**小欧（CLUB-1）**｜「一人公司创始人的私人俱乐部」｜善意机制：**社章誓言**——入社宣誓善意经营（仪式感+约束力+传播素材）｜气质：会员尊贵。

**#25**：OPC CLUB｜善意俱乐部｜**会长**｜小欧｜「以善意为会费」｜善意机制：**善意会费**——会员资格的维持=持续善意行为（替代金钱会费的资格设计）｜气质：荣誉社团。

**#26**：OPC CLUB｜一人公司俱乐部｜社长｜小欧｜「一个人，但不孤单」｜善意机制：**陪伴制**——俱乐部成员一对一守望（一人公司最大的痛是孤独，善意=陪伴）｜气质：温度社交。

**#27**：OPC CLUB｜主理人社｜**社姐**｜小欧｜「社交的社，善意为社」｜善意机制：**社交即善意**——所有社群活动的第一目标设定为利他（次级目标才是转化）｜气质：轻社交。

### G · S-OPC 超级家族（#28–30）

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
