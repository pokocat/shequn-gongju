## 〇、变现总图（0 元 → 师徒 → B 端一张图）

```
L0 公益普及班（0 元，7 天）
      │ 毕业课钩子：今晚正式上线
      ▼
L1 主题班（9.9 元押金，全勤退）── 工具包（99 元）── 上线会员（99/月）
      │ 结业钩子：天选会员
      ▼
L2 天选会员（699/年：全部课 + 天选锦囊 + 结业证书）
      │ 按兴趣分流
      ▼
L3 实战营（399–1,980，三大主题营）
      │ 优秀学员
      ▼
L4 操盘手营（2,980 进阶）── 线下：城市一日营（598）/ 深绿闭门会（2,980）
      │ 想创业 / 想做大
      ▼
L5 上车卡（1,000 元 7 天共建体验，升级全额抵扣）
      │ 验证通过 → B 端
      ▼
L6 B 端三档：上桌团长（1 万）→ 主场主理（3 万）→ 天选合伙人（12 万）
      │ 高客单人群另走
      ▼
L7 师徒制：掌灯门徒（1.98 万/年）· 天选门徒（4.98 万/年，限量）
      │ 全程并行
      ▼
L8 项目承接：生态项目分销（合规零售差价 + 服务费）
```

| 2 | AI 工具包 | 99–499 | 永久 | 提示词库 + 工具清单 + 模板 | 会员免费含 → 推会员 |
| 3 | 上线会员 | 99/月 | 月 | 工具权 + 答疑 + 天选开奖（内容福利） | 月付转年付 |

| 5 | AI 办公营 | 399 | 7 天 | 汇报/文案/PPT/表格 AI 化 | 办公场景毕业 → 私域营 |

## 四、师徒制（「收徒」合规版）

> **改造说明**：「收徒」若带「徒弟再收徒、徒弟能抽成」就是层级计酬红线。本方案把收徒设计为**明码标价的高客单服务产品**：钱买的是天选姐的时间与资源，不买「发展权」。

| 档位 | 名称 | 价格 | 权益 | 限量 |
| --- | --- | --- | --- | --- |
| 一档 | **掌灯门徒** | 19,800/年 | 团队 1v1 商业诊断 ×4/年；全部课程任学；案例共署名；城市合作通道优先 | 每期 30 席 |
| 二档 | **天选门徒** | 49,800/年 | 天选姐本人 1v1 ×12/年；漫星文娱/OPC 生态资源对接；联营项目优先权；深绿闭门会终身席 | 每年 9 席（编号 M01–M09） |

**师徒纪律（四条）**：
1. 门徒推荐新门徒：**零报酬**（只有荣誉致谢）——服务产品不设任何推荐计酬；
2. 门徒与代理是两套体系：门徒可另走代理通道，但按代理规则来，不叠加；
3. 不承诺任何收益、资源置换结果；
4. 天选姐 1v1 时间真实交付（每次留痕），卖的是服务不是身份。

## 五、变现项目承接（项目环，沿用三关评审）

**评审三关（不变）**：合规关 → 品质关（总部试用 ≥4.5/5）→ 分润关（只走零售差价 + 服务费）。

**首批候选项目类型**：

| 类型 | 形态 | 承接方 | 变现方式 |
| --- | --- | --- | --- |
| AI 数字人定制 | 个人/门店数字人 | 漫星文娱 | 代理零售差价 |
| 非遗/老字号数字化 | 数字资产+传播 | 漫星文娱+掌灯计划 | 项目服务费（与公益分账分离） |
| AI 广告代运营 | 短视频矩阵托管 | 星枢影像 | 月度服务费 |
| 行业 AI 方案 | 法律/财税/母婴定制 | OPC 生态 | 项目制 |
| 白牌货盘分销 | 电商货品 | 操盘团队 | 零售差价（经销商体系） |

**承接规则**：项目在社群每成交一单都是活广告（成交即招商展示）；代理卖货赚差价 + 做项目赚劳务，永远与拉人头无关。

## 八、合规红线（五条）

1. 师徒制 = 服务产品，门徒间零计酬、零层级；

<script>
// 硬编码文件名（由生成脚本写入）
document.getElementById('fname').textContent = '20260916_升单课程与变现承接体系.md';
document.body.classList.add('design');
document.getElementById('plainLink').href = '20260917_文档阅读器.html?file=' + encodeURIComponent('20260916_升单课程与变现承接体系.md');

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
