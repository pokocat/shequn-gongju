## 一、课程总架构

| 天 | 主题 | 一句话钩子 | 教学目标（学员毕业时能…） |
| --- | --- | --- | --- |
| Day 1 | AI 是什么 | 「AI 不神秘，就是个特别好用的工具」 | 装好工具，和 AI 完成第一次对话 |
| Day 2 | AI 写作 | 「让 AI 替你写，你只管改」 | 用万能提示词公式写文案/周报 |
| Day 3 | AI 做图 | 「一句话，出一张图」 | 生成海报/头像/电商图 |
| Day 4 | AI 查资料 | 「3 分钟读完 30 页报告」 | 长文档总结/对比/翻译 |
| Day 5 | AI 处理表格 | 「表格的活，交给它」 | 整理名单/数据/生成公式 |
| Day 6 | AI 数字人与视频 | 「给自己做个数字分身」 | 录 15 秒数字人问候+写短视频脚本 |
| Day 7 | 毕业礼 | 「7 天，你已经超过 90% 的人」 | 建立技能地图，进入进阶路径 |

**课程衔接逻辑**：破冰（会用）→ 输入输出（会写会画）→ 效率（会查会算）→ 声量（会播）→ 收口（知道下一步学什么）。

## 二、单课结构模板（10 分钟视频）

```
0:00–0:30   钩子：一个真实场景痛点（"周五交周报，你还在憋字吗？"）
0:30–3:00   原理 2 分钟：今天这个能力是什么（3 个生活化比喻）
3:00–7:30   演示 4 分半：屏幕录制，真实操作 2 个案例（一个简单+一个进阶）
7:30–9:00   作业讲解：今天的作业模板怎么填、发群里怎么发
9:00–9:30   明日预告：「明天，让你一句话出一张图」+ AI 老师「上线」的一句话点评
```

**素材包**（总部统一制作，每课四件）：视频 MP4 · 文字版讲义（通勤可读）· 作业模板（可复制填空）· 群发文案（团长直接转发）。

## 三、每日详细设计

### Day 1 · AI 是什么（认知破冰日）

- **原理**：大模型 = 读遍了图书馆的实习生（比喻一）/ 计算器 vs 算盘（比喻二）/ 它不会读心，会听话（比喻三）
- **演示案例**：① 装工具（免费 AI 助手，手机 3 分钟）② 第一句对话：「帮我用大白话解释什么是 AI」→ 追问三层
- **作业**：让 AI 自我介绍 + 问它三个关于你行业的问题，截图发群
- **互动设计**（团长午间晒）：最有趣对话截图评选

### Day 2 · AI 写作（万能公式日）

- **原理**：万能提示词公式 = **角色 + 任务 + 要求 + 示例**（「你是一位资深文案，帮我写一条朋友圈，要求口语化 50 字内，示例：……」）
- **演示案例**：① 朋友圈卖货文案（改 3 版对比）② 工作周报（从流水账到汇报体）
- **作业**：用公式写一条自己业务的朋友圈文案，发群互评
- **雷达埋点**：优秀作业次日由 AI 老师「上线」点评（示范 AI 能力，为随心付铺垫）

### Day 3 · AI 做图（视觉冲击日）

- **原理**：文生图提示词 = **主体 + 场景 + 风格 + 光线**（「一只橘猫，咖啡馆窗边，水彩风格，午后暖光」）
- **演示案例**：① 节日海报（改风格词对比）② 电商产品图/头像
- **作业**：生成一张自己的节日海报，发群
- **★ 晚间固定动作**：团长发「随心付说明」（SOP 3.6 模板，照抄不改动，只发一次）——选在 Day 3 的原因：视觉冲击日满意度峰值，且距结营还有 4 天沉淀期，不显功利

### Day 4 · AI 查资料（效率震撼日）

- **原理**：长文档三步法 = **贴全文 → 要结构化总结 → 追问细节**
- **演示案例**：① 30 页行业报告 → 1 页要点（表格化）② 两个产品对比分析 ③ 中英互译保持语气
- **作业**：把一份自己行业的报告/文章让 AI 总结成 5 条要点

### Day 5 · AI 处理表格（职场刚需日）

- **原理**：「不用学公式，用说的」——描述需求让 AI 出公式/出整理方案
- **演示案例**：① 客户名单去重分类 ② 数据透视逻辑生成 ③ Excel 公式即问即得
- **作业**：用 AI 整理一份自己的客户/好友名单（行业+城市+备注）

### Day 6 · AI 数字人与视频（未来感日）

- **原理**：数字人 = 你的声音+形象+AI 的大脑；短视频脚本的「黄金 3 秒」结构
- **演示案例**：① 用平台录一段 15 秒数字人问候 ② 一条带货口播脚本的 AI 生成过程
- **作业**：录一段 15 秒数字人问候发群
- **内容边界**：本课展示的数字人能力由总部平台提供，团员若有定制需求 → **雷达 T3+ 线索**（升单通道：数字人定制属项目承接）

### Day 7 · 毕业礼（收口日）

- **内容**：7 天技能地图（一页图回顾六项能力）· 每人电子毕业证书 · 优秀学员榜
- **进阶路径展示**（对应升单承接）：主题班 9.9（写作/做图深化）→ 上线会员 99/月（AI 军师工具）→ 实战营 399+
- **20:00 随心付通道开启**（SOP 3.8）· 21:00/22:00 随心榜播报 · 22:30 雷达上报

## 四、AI 老师「上线」的角色设计（贯穿 7 天）

| 时点 | 动作 |
| --- | --- |
| 每日 12:30 | 群内点评 1–2 份优秀作业（AI 生成+标注） |
| 每日晚间 | 回答 3 个高频问题（答疑精选） |
| Day 2/5 | 发 1 条「技能彩蛋」（课外的实用小技巧） |
| 全程 | 群昵称「AI 老师·上线」，所有内容由数字人形象发出+角标「AI 数字人」 |

**价值**：学员对 AI 的信任 = 对课程的信任 = 对随心付的认可——AI 老师本身就是课程最大的成果展示。

## 五、玩法闭环（收口确认 · 与既定方案一字不差）

```
接龙报名（0 元）→ 7 天课（0 元可学完）
→ Day 3 晚随心付说明（只发一次照抄）→ Day 7 随心付通道+随心榜
→ 22:30 雷达五层上报（T4≥1000 天选姐出面 / T3 上车卡 1v1 / T2 9.9 主题班）
→ 次月结算：团长 50% / 总部 50%
```

三底线（铁律）：0 元可学完 · 不设参考价 · 付款与权益脱钩。

document.getElementById('plainLink').href = '20260917_文档阅读器.html?file=' + encodeURIComponent('20260917_AI普及计划_7天课程详细设计_V1.md');

// 从内嵌 script 读取 md 原文并渲染
const md = document.getElementById('mdsrc').textContent;
renderDoc(render(md));

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    if (h.tagName === 'H3') a.className = 'h3';
    toc.appendChild(a);
  });
  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
