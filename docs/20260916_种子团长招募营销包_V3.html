## 一、招募长文（朋友圈/公众号主发版）

> 共鸣→信任→渴望→行动四层，可直接复制发布。

**你的朋友圈，躺着一笔没取出来的钱。**

加了几百个好友，除了点赞之交，给你带来过什么？
天选姐做社群这些年看明白一件事：**人脉不是认识多少人，是你能为多少人提供一次真实的价值。**

现在这件事有个现成的载体——**AI 普惠计划**：

一个 7 天的课，教普通人用上 AI：写方案、做图、查资料、管客户。原价锚 1,000 元的课，普惠期 **0 元起随心付**——一分不付也能学完；觉得值，付多少学员自己定。

但每个圈子，得有人把班开起来。**这就是我在找的人：团长。**

**团长做三件事**：拉自己的接龙群、每天发课程链接、陪大家打卡。
**总部全包**：课程、直播、话术，还有个 AI 老师，我的团队一对一陪你跑第一期。

**团长的钱从哪来，三条线一次说清：**

① **学员随心付的每一笔钱，开班团长拿一半**——按月结算，你的班你收钱，明明白白；
② 你的专属码带来的课程/会员成交，**30% 佣金**；
③ 进阶课成交，20%；跑通第一期，正式城市合作通道优先给你（1 万起，赚零售差价）。

**三条线全部写进协议，第一条就够你把班开起来的劲头拉满。**

为什么说这是「资源变现第一步」：第一期跑完，你会拿到你的人脉体检报告——谁在学、谁在付、谁对进阶课有反应，数据告诉你你的圈子里谁最值钱。这份名单，比课程本身值钱。

不承诺收入——收入取决于你的圈子质量和用心程度，我只承诺：**总部不藏课、不藏话术、不藏数据、分账不打折。**

**首批只开 5 席。**
私信我「团长」两个字。今晚 8 点，语音 15 分钟。

## 二、朋友圈短文案（三版）

**版本 A · 资产角度（首发）**

> 你朋友圈里躺着的 500 个人，就是你的第一笔资产。
> 我在找 5 位团长，把它激活：AI 普惠计划，7 天课，学员 0 元起随心付；你开班，总部出课程出 AI 老师出话术；**学员随心付的钱你拿一半**，课程成交再拿 30%。
> 不承诺收入，只承诺分账写进协议。
> 私信「团长」。

**版本 B · 趋势角度（D-1 预热）**

> 今晚在给 AI 普惠计划挑第一批团长。
> 不用懂 AI，不用出镜，不花一分钱。每天 1 小时，把朋友圈里想学 AI 的人聚起来。
> 总部全包，你的码你的私域你的分账。
> 首批 5 席，想上车的私信我。

**版本 C · 反套路角度（D+1 追发）**

> 招团长，先把账算明白：
> 学员随心付的钱，团长拿一半，月结；
> 课程成交 30%，进阶课 20%；
> 跑通第一期，正式合作通道优先。
> 0 元启动，但要有圈子、每天 1 小时、先做事。
> 图快钱的别来。私信「团长」。

## 三、一对一私聊五步

**第 1 条 · 共鸣开场**

> 「XX，问你个事。你朋友圈里几百号人，除了点赞，给你带来过什么？我这边有个现成的答案——AI 普惠计划，正在选首批开班的团长，我第一个想到你。」

**第 2 条 · 是什么（信任）**

> 「7 天课，教普通人用 AI：写方案、做图、查资料。原价锚 1,000 元，普惠期 0 元起随心付——一分不付也能学完，觉得值付多少自己定。团长把班开到自己圈子：拉群、发链接、陪打卡，就这三件事。课程直播话术全总部出，还有个 AI 老师叫『上线』帮着答疑。」

**第 3 条 · 分润说明（渴望）**

> 「钱的事直接说清，三条线：
> ① 学员随心付的每一笔，**你拿一半**，按月结算；
> ② 你专属码的课程成交，30% 佣金；
> ③ 进阶课 20%，跑通第一期还有正式合作通道优先。
> 全部写协议，0 成本启动。」

**第 4 条 · 独家价值（人脉体检）**

> 「还有个隐藏福利：第一期跑完，你会拿到你圈子的『人脉体检报告』——谁在学、谁付了款、谁对进阶课有反应。这份名单，后面做什么都用得上。」

**第 5 条 · 行动指令（限量）**

> 「首批只有 5 席，给你留到今晚 12 点。回「团长」，晚上 8 点语音 15 分钟，讲完你直接定。」

## 四、群发短版（30 秒读完）

> 「跟你说个事：AI 普惠计划招首批团长。7 天课学员 0 元起随心付，你负责把班开到自己圈子（拉群/发链接/陪打卡），总部出全部课程和 AI 老师。**学员随心付的钱你拿一半**（月结），课程成交再拿 30%。有圈子、每天 1 小时、想给自己人脉做点事的，回「团长」我细说。」

## 五、短视频口播脚本（45 秒）

> **【前 3 秒钩子】**
> 你朋友圈里那 500 个人，正在变成一笔别人抢不走的资产。
>
> **【10 秒 · 背景】**
> 我们做了个 AI 普惠计划：7 天课，教普通人用 AI——写方案、做图、查资料。原价锚一千，普惠期 0 元起随心付，不付也能学完。
>
> **【30 秒 · 核心】**
> 每个圈子得有人把班开起来——这就是团长。
> 团长干三件事：拉群、发链接、陪打卡。课程、直播、AI 老师，总部全包。
> 赚钱说清楚：**学员随心付的每一笔，团长拿一半**，月结；你的码出了课程订单，再拿 30%。跑通了，还有正式合作通道。
>
> **【10 秒 · CTA】**
> 首批就 5 个位置。想把你朋友圈激活的，评论区扣「团长」。

## 六、招募海报文案（配天选白金视觉）

| 区块 | 文案 |
| --- | --- |
| 主标 | 激活你的朋友圈 |
| 副标 | AI 普惠计划 · 首批团长招募 |
| 卖点 1 | 0 元启动 · 总部全包课程与 AI 老师 |
| 卖点 2 | **学员随心付 · 团长分一半** · 按月结算 |
| 卖点 3 | 课程成交 30% · 私域归自己 · 人脉体检报告 |
| CTA 条 | 私信「团长」· 首批仅 5 席 |

## 七、报名引导（承接流程）

```
私信「团长」
  → 报名表（3 题圈子情况，1 分钟）
  → 15 分钟语音（话术包面谈结构）
  → 发团长 SOP + 专属接龙码 + 《团长合作协议》（含 50/30/20 分账条款）
  → 下周一统一开营（总部陪跑）
```

首批 5 席，截止后 48 小时内城市随心榜公布名单。

## 八、发布节奏（7 天 · 沿用）

// 从内嵌 script 读取 md 原文并渲染

// 渲染后：生成目录 + 绑定滚动
function renderDoc(html){
  document.getElementById('content').innerHTML = html;
  const toc = document.getElementById('toc');
  const hs = [...document.querySelectorAll('#content h2,#content h3')];
  hs.forEach((h, i) => {
    h.id = 'sec' + i;
    const a = document.createElement('a');
    a.href = '#' + h.id;

    if (h.tagName === 'H3') a.className = 'h3';

  if (hs.length > 0) toc.classList.add('has');
  const ta = [...toc.querySelectorAll('a')];
  addEventListener('scroll', () => {
    const d = document.documentElement;
    document.getElementById('readbar').style.width = (d.scrollTop / (d.scrollHeight - d.clientHeight) * 100) + '%';
    document.getElementById('top-btn').classList.toggle('on', d.scrollTop > 400);
    let cur = -1;
    hs.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    ta.forEach((a, i) => a.classList.toggle('on', i === cur));
  }, { passive: true });
}
document.getElementById('top-btn').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function inline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--gold-deep)">$1</a>');
  return s;
}
function render(md) {
  const lines = md.split('\n');
  let out = [], i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (/^```/.test(L)) { let buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); i++; continue; }
    if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?$/.test(lines[i + 1])) {
      let rows = []; let head = L.split('|').slice(1, -1);
      i += 2;
      while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i].split('|').slice(1, -1)); i++; }
      let h = '<table><tr>' + head.map(c => '<th>' + inline(c.trim()) + '</th>').join('') + '</tr>';
      rows.forEach(r => { h += '<tr>' + r.map(c => '<td>' + inline(c.trim()) + '</td>').join('') + '</tr>'; });
      out.push(h + '</table>'); continue;
    }
    if (/^#{1,4}\s/.test(L)) {
      const m = L.match(/^(#{1,4})\s+(.*)/);
      const lv = m[1].length, txt = inline(m[2]);
      out.push('<h' + lv + '>' + txt + '</h' + lv + '>'); i++; continue;
    }
    if (/^>\s?/.test(L)) { let buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + buf.map(b => inline(b)).join('<br>') + '</blockquote>'); continue; }
    if (/^(---|\*\*\*)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
    if (/^[-*]\s/.test(L)) { let buf = []; while (i < lines.length && /^[-*]\s/.test(lines[i])) { buf.push(lines[i].replace(/^[-*]\s/, '')); i++; }
      out.push('<ul>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ul>'); continue; }
    if (/^\d+\.\s/.test(L)) { let buf = []; while (i < lines.length && /^\d+\.\s/.test(lines[i])) { buf.push(lines[i].replace(/^\d+\.\s/, '')); i++; }
      out.push('<ol>' + buf.map(b => '<li>' + inline(b) + '</li>').join('') + '</ol>'); continue; }
    if (/^\s*$/.test(L)) { i++; continue; }
    let buf = [L]; i++;
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|>|\||```|[-*]\s|\d+\.\s|---)/.test(lines[i])) { buf.push(lines[i]); i++; }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
