}

.rows{ display: flex; flex-direction: column; gap: 8.027px; }
.row-t{ font-size: var(--fs-h3); font-weight: 700; color: var(--ink-900); }

.contact{ display: flex; align-items: center; gap: 10.32px; padding: 13.76px; }
