<style>.mcard{
  position: relative; overflow: hidden;
  border-radius: 20.067px; padding: 16.053px;
  background: var(--grad-hero);
  border: 0.573px solid var(--line-signal);
  box-shadow: 0 10.32px 40.133px rgba(126, 92, 150, 0.15), var(--sheen);
}

.mcard::after{
  content: ""; position: absolute; right: -40.133px; top: -29.813px;
  width: 220.16px; height: 220.16px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(168, 85, 247, 0.22), rgba(168, 85, 247, 0));
  pointer-events: none;
}
.mcard-h{ font-size: var(--fs-h4); font-weight: 700; color: var(--signal-800); }
.mcard-pro{
  font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-meta);
  color: var(--on-signal); padding: 4.013px 12.04px; border-radius: 8.027px;
  background: linear-gradient(120deg, var(--signal-500), var(--signal-600));
  box-shadow: 0 4.013px 12.04px rgba(109, 40, 217, 0.3);
}
.mcard-name{ font-size: 24.08px; font-weight: 700; color: var(--ink-900); }
.mc-role{
  display: inline-block; margin-top: 5.733px;
  font-size: var(--fs-meta); color: var(--signal-800);
  padding: 2.867px 12.04px; border-radius: var(--r-pill);
  background: rgba(255, 255, 255, 0.5); border: 0.573px solid var(--line-strong);
}
.mc-info{ display: flex; flex-direction: column; gap: 9.173px; }
.mc-row{ display: flex; align-items: center; gap: 8.027px; }
.mc-l{ font-size: var(--fs-sec); color: var(--ink-700); flex: 0 0 64.213px; }
.mc-v{
  flex: 1; min-width: 0; font-size: var(--fs-sec); color: var(--ink-900); font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mcard-side{ flex: 0 0 96.32px; display: flex; flex-direction: column; align-items: center; gap: 8.027px; }
.mcard-code{
  display: flex; flex-direction: column; align-items: center; gap: 3.44px;
  padding: 8.027px 12.04px; border-radius: 10.32px;
  background: rgba(255, 255, 255, 0.6); border: 0.573px solid var(--line-strong);
}
.mcard-code-t{ font-size: var(--fs-tiny); color: var(--signal-800); }


.chain{ display: flex; align-items: flex-start; }
.chain-p{ flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5.733px; }
.chain-label{ font-size: var(--fs-meta); color: var(--ink-600); }
.chain-name{
  font-size: var(--fs-body); font-weight: 700; color: var(--ink-900);
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chain-role{ font-size: var(--fs-tiny); color: var(--ink-600); }
.chain-arrow{ flex: 0 0 16.053px; margin-top: 32.107px; }

.chain-dot{
  height: 16.053px; display: flex; align-items: center; justify-content: center;
}
.chain-dot::after{
  content: ""; width: 4.587px; height: 4.587px; border-radius: 50%; background: var(--line-strong);
}

.upline-note{
  display: flex; align-items: center; gap: 9.173px;
  margin-top: 11.467px; padding-top: 10.32px; border-top: 0.573px solid var(--line-soft);
}


.ben-grid{ display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6.88px; }
.ben-tile{
  position: relative; min-width: 0; border-radius: var(--r-box); padding: 9.173px 17.2px 9.173px 9.173px;
  min-height: 83.707px; box-sizing: border-box;
  background: rgba(255, 252, 246, 0.7); border: 0.573px solid var(--line);
}
.bt-t{
  display: -webkit-box; margin-top: 4.587px; font-size: var(--fs-meta); font-weight: 700;
  color: var(--ink-900); line-height: 1.3; -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; overflow: hidden;
}
.bt-d{
  display: block; min-width: 0; margin-top: 2.293px; font-size: var(--fs-micro);
  color: var(--ink-600); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}


.expiry{ font-size: 18.92px; font-weight: 700; color: var(--ink-900); }
.day-pill{
  display: inline-block; margin-top: 8.027px;
  font-size: var(--fs-tiny); color: var(--signal-800);
  padding: 2.867px 10.32px; border-radius: var(--r-pill);
  background: var(--sunk-3); border: 0.573px solid var(--line-signal);
}
.growth-v{ display: block; margin-top: 5.733px; font-size: 25.8px; font-weight: 700; color: var(--ink-900); }
.member-actions{
  position: relative; bottom: auto; margin-top: 8.027px;
  padding-bottom: 13.76px;
}</style>
