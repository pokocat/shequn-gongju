<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>主理人公社｜邀请与升级闭环预览</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2b241d;background:#f6f1e8}body{margin:0;min-height:100vh}main{max-width:1100px;margin:0 auto;padding:40px 24px 72px}.hero{background:#2b241d;color:#fff7ea;border-radius:22px;padding:30px 34px;margin-bottom:24px;box-shadow:0 16px 36px #2b241d22}.hero h1{margin:0 0 10px;font-size:30px}.hero p{margin:0;color:#ddcdb7;line-height:1.7}.section{margin-top:24px}.section h2{font-size:20px;margin:0 0 12px}.card{display:block;text-decoration:none;color:inherit;background:#fffaf2;border:1px solid #eadfcd;border-radius:18px;padding:20px 22px;box-shadow:0 8px 24px #8d6d3c12;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#b88d43}.card strong{display:block;font-size:18px;margin-bottom:8px}.card span{color:#776b5d;line-height:1.6}.status{display:inline-flex;align-items:center;gap:8px;margin-top:16px;color:#cfe9cf;font-size:14px}.dot{width:8px;height:8px;border-radius:50%;background:#79c779;box-shadow:0 0 0 4px #79c77922}
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>主理人公社</h1>
      <p>邀请会员与邀请代理升级的业务闭环预览。用于确认关键状态、承接动作与异常分支。</p>
      <div class="status"><i class="dot"></i>本地预览服务器已连接</div>
    </header>
    <section class="section">
      <h2>可查看的流程</h2>
      <a class="card" href="/invite-upgrade-flow.html">
        <strong>邀请会员 &amp; 邀请代理升级闭环</strong>
        <span>生成邀请 → 确认归属 → 支付/激活 → 入群服务；资格识别 → 申请 → 审核签约 → 开通代理工作台</span>
      </a>
    </section>
  </main>
</body>
</html>
