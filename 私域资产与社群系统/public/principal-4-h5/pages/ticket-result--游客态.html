<style>.tr-hero{ display: flex; align-items: center; gap: 6.88px; padding: 17.2px 13.76px 17.2px 17.2px; }
.tr-tags{ display: flex; flex-wrap: wrap; gap: 5.733px; }
.tr-title{
  display: block; margin-top: 10.32px;

.pg{ display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pg-step{ position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 2.293px; }
.pg-step--link::before{
  content: ""; position: absolute; top: 10.893px; left: 50%; right: -50%;
  height: 1.147px; background: var(--line-strong);
}
.pg-step--lit::before{ background: var(--signal-500); }
.pg-node{
  position: relative; z-index: 1;
  width: 22.933px; height: 22.933px; border-radius: 50%; box-sizing: border-box;
  display: flex; align-items: center; justify-content: center;
  background: var(--card-bg); border: 1.147px solid var(--line-strong);
}
.pg-step--done .pg-node{ background: var(--signal-500); border-color: var(--signal-500); }
.pg-step--active .pg-node{ border-color: var(--signal-500); box-shadow: 0 0 0 4.587px var(--signal-wash); }
.pg-step--active .pg-node::after{
  content: ""; width: 9.173px; height: 9.173px; border-radius: 50%; background: var(--signal-500);
}
.pg-step--fail .pg-node{ background: var(--danger-fill); border-color: var(--danger-fill); }
.pg-t{ margin-top: 9.173px; font-size: var(--fs-meta); font-weight: 400; color: var(--ink-900); }
.pg-step--todo .pg-t{ color: var(--ink-600); font-weight: 500; }
.pg-s{ margin-top: 2.293px; font-size: var(--fs-tiny); color: var(--ink-600); }
.pg-step--active .pg-s{ color: var(--pulse-600); font-weight: 500; }
.pg-step--fail .pg-s{ color: var(--danger); font-weight: 500; }
.pg-d{ margin-top: 1.147px; font-size: var(--fs-micro); color: var(--ink-500); }


.tr-info .ic-row{ padding: 12.613px 0; }
.tr-info .ic-l{ color: var(--ink-600); }
.tr-info .col-h + .ic-row{ border-top: none; }
.tr-copy{ position: relative; display: flex; align-items: center; gap: 4.587px; min-height: 36.693px; }


.tr-desc{ display: block; font-size: var(--fs-h4); color: var(--ink-800); line-height: 1.8; white-space: pre-line; }

.tr-person{ gap: 12.04px; }
.tr-person-name{ gap: 6.88px; }
.tr-wait-row{ gap: 6.88px; }

.tr-event-t{ display: block; font-size: var(--fs-h4); font-weight: 500; color: var(--ink-900); }
.tr-event{ padding-top: 5.733px; }

.tr-tip{ padding: 11.467px 0; min-height: 50.453px; }
.tr-tip-t{ display: block; font-size: var(--fs-body); font-weight: 500; color: var(--ink-900); }


.tr-hit{ position: relative; }
.tr-hit::after{ content: ""; position: absolute; top: -9.173px; bottom: -9.173px; left: -4.587px; right: -4.587px; }


.rv-wait{ padding-top: 16.053px; }
.rv-blank{ padding: 22.933px 11.467px 11.467px; }
.rv-lead{ display: block; margin-top: 6.88px; font-size: var(--fs-sec); color: var(--ink-600); line-height: 1.6; }
.rv-svc{
  display: flex; align-items: center; gap: 11.467px;

}
.rv-svc-t{ display: block; font-size: var(--fs-h4); font-weight: 500; color: var(--ink-900); }
.rv-svc-m{ display: block; margin-top: 2.293px; font-size: var(--fs-tiny); color: var(--ink-600); }

.rv-rate{ display: flex; align-items: center; justify-content: space-between; margin-top: 10.32px; }
.rv-stars{ display: flex; margin-left: -9.173px; }

.rv-star{ padding: 9.173px; }
.rv-label{ font-family: var(--font-serif); font-size: var(--fs-h3); font-weight: 500; color: var(--pulse-600); }

.rv-sec{ margin-top: 14.907px; }
.rv-k{ display: block; margin-bottom: 8.027px; font-size: var(--fs-sec); font-weight: 500; color: var(--ink-900); }
.rv-k-sub{ font-weight: 400; color: var(--ink-600); }
.rv-tags{ display: flex; flex-wrap: wrap; gap: 8.027px; }
.rv-chip{ position: relative; }
.rv-chip::after{ content: ""; position: absolute; top: -8.027px; bottom: -8.027px; left: 0; right: 0; }
.rv-text{ height: 96.32px; }
.rv-yn{ gap: 6.88px; }
.rv-submit{ margin-top: 20.64px; }

<script>
// 跨页跳转：data-nav 由导出脚本从 data-url / data-path / navigator 解析出来（见 render.navTarget）。
// 保留当前查询串，这样在 shell 里点进去的下一页仍然是 embed / 整页态。
(function () {
  var SLUG = "ticket-result--游客态";
  try { if (parent !== window) parent.postMessage({ mpScreen: SLUG }, "*"); } catch (e) {}
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el) return;
    e.preventDefault();
    var t = el.getAttribute("data-nav");
    if (t === "__back__") {
      // 深链进来时没有上一页可回；交给宿主 shell 打开页面清单，而不是静默什么都不发生
      if (history.length > 1) history.back();
      else { try { if (parent !== window) parent.postMessage({ mpBack: true }, "*"); } catch (e2) {} }
      return;
    }
    location.href = t + ".html" + location.search;
  });
})();
</script>
