.chap-row--first{ border-top: none; }
.chap-row:active{ opacity: 0.7; }

.chap-row--cur::before{

.chap-t{ display: block; font-size: var(--fs-h4); color: var(--ink-900); }
.chap-row--cur .chap-t{ font-weight: 500; }
.play-circle{
  width: 29.813px; height: 29.813px; flex: 0 0 29.813px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 0.573px solid var(--line-signal); box-sizing: border-box;

.cs-more{ min-height: 36.693px; }
.mat-row{
  display: flex; align-items: center; gap: 11.467px;

}
.mat-t{ display: block; font-size: var(--fs-sec); font-weight: 500; color: var(--ink-900); }


.hit{ position: relative; }

<script>
// 跨页跳转：data-nav 由导出脚本从 data-url / data-path / navigator 解析出来（见 render.navTarget）。
// 保留当前查询串，这样在 shell 里点进去的下一页仍然是 embed / 整页态。
(function () {
  var SLUG = "course--读取失败";
  try { if (parent !== window) parent.postMessage({ mpScreen: SLUG }, "*"); } catch (e) {}
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el) return;
    e.preventDefault();
    var t = el.getAttribute("data-nav");
    if (t === "__back__") {
      // 深链进来时没有上一页可回；交给宿主 shell 打开页面清单，而不是静默什么都不发生
      if (history.length > 1) history.back();
      else { try { if (parent !== window) parent.postMessage({ mpBack: true }, "*"); } catch (e2) {} }
      return;
    }
    location.href = t + ".html" + location.search;
  });
})();
</script>
