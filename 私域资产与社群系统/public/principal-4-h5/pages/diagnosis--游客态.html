<style>.dg-now{ padding: 17.2px 16.053px 5.733px; }
.dg-now-head{ gap: 9.173px; }

.dg-now-title{ font-family: var(--font-serif); font-size: 24.08px; font-weight: 600; color: var(--ink-900); letter-spacing: 1.147px; }
.dg-now-desc{ display: block; margin-top: 4.587px; font-size: var(--fs-sec); color: var(--ink-700); line-height: 1.6; }

.dg-eta{
  display: inline-flex; align-items: center; gap: 4.587px;
  margin-top: 9.173px; padding: 4.587px 10.32px;
  border-radius: var(--r-pill);
  background: var(--pulse-wash); color: var(--pulse-600);
  font-size: var(--fs-meta); font-weight: 400;
}
.dg-steps{ margin-top: 17.2px; justify-content: space-between; }
.dg-step-on{ color: var(--ink-900); font-weight: 500; }


.dg-now-report{
  display: flex; align-items: center; gap: 6.88px;
  min-height: 50.453px; margin-top: 13.76px; padding: 0 11.467px;
  border-radius: var(--r-box);
  background: var(--ok-wash); border: 0.573px solid var(--ok-line);
  font-size: var(--fs-sec); color: var(--ink-900);
}
.dg-now-go{ font-size: var(--fs-meta); font-weight: 400; color: var(--ink-800); }


.dg-now-foot{
  display: flex; justify-content: space-between; align-items: center;

.dg-fold{
  display: flex; align-items: center; gap: 3.44px;

}
.dg-fold-ico{ display: flex; transition: transform 200ms ease; }
.dg-fold-ico--up{ transform: rotate(180deg); }

.dg-detail{ padding: 3.44px 0 13.76px; border-top: 0.573px solid var(--line-soft); }
.dg-detail-head{ margin: 10.32px 0 2.293px; }

.dg-detail .ic-row{ padding-left: 0; padding-right: 0; }
.dg-sub{ display: block; font-family: var(--font-serif); font-size: var(--fs-h4); font-weight: 500; color: var(--ink-900); }
.dg-sub--gap{ margin: 16.053px 0 2.293px; }
.dg-copy{
  display: flex; align-items: center; gap: 3.44px;

}
.dg-advisor{ gap: 10.32px; padding: 8.027px 0 2.293px; }
.dg-advisor-n{ display: block; font-size: var(--fs-h4); font-weight: 500; color: var(--ink-900); }

.dg-swap{
  display: flex; align-items: flex-start; gap: 6.88px;
  margin-top: 9.173px; padding: 10.32px 11.467px;
  border-radius: var(--r-box); background: var(--sunk);
  font-size: var(--fs-tiny); color: var(--ink-700); line-height: 1.6;
}
.dg-wait{ margin-top: 13.76px; padding: 10.32px 11.467px; border-radius: var(--r-box); background: var(--sunk-3); }

.dg-now-err{ display: flex; align-items: center; justify-content: space-between; gap: 9.173px; }


.dg-hero{ padding: 17.2px 16.053px 13.76px; overflow: hidden; }
.dg-hero-row{ gap: 4.587px; }

.dg-title{ display: block; font-family: var(--font-serif); font-size: 28.093px; font-weight: 600; color: var(--ink-900); letter-spacing: 1.147px; margin-bottom: 5.733px; }
.dg-explain{
  display: inline-flex; align-items: center; gap: 2.293px;
  min-height: 41.28px; margin-top: 2.293px;
  font-size: var(--fs-meta); font-weight: 400; color: var(--ink-800);
}
.dg-quota{
  display: flex; align-items: center; gap: 9.173px;
  margin-top: 8.027px; padding-top: 10.32px;
  border-top: 0.573px solid var(--line);
}

.dg-quota-hint{ display: block; margin-top: 2.293px; font-size: var(--fs-tiny); color: var(--ink-700); }


.dg-score{ gap: 8.027px; }
.dg-grade{ flex: 0 0 91.733px; }

.dg-grade-v{ display: block; font-size: 56.187px; line-height: 1; color: var(--ink-900); }
.dg-pct{ font-size: var(--fs-sec); color: var(--ink-900); }
.dg-rings{ gap: 3.44px; }
.dg-metric-v{ display: block; margin-top: 3.44px; font-size: 18.92px; color: var(--ink-900); }
.dg-summary{
  display: block; margin-top: 12.613px; padding-top: 11.467px;
  border-top: 0.573px solid var(--line-soft);
  font-size: var(--fs-meta); color: var(--ink-700); line-height: 1.7;
}
.dg-advice-t{ display: block; font-size: var(--fs-body); font-weight: 500; color: var(--ink-900); }
.issue-row{ display: flex; align-items: center; gap: 10.32px; padding: 8.027px 0; border-top: 0.573px solid var(--line-soft); }
.issue-row:first-of-type{ border-top: none; }
.issue-dot{ width: 6.307px; height: 6.307px; border-radius: 50%; flex: 0 0 6.307px; background: var(--pulse-400); }



.dg-rec{ min-height: 50.453px; }
.dg-rec--on{ margin: 0 -8.027px; padding-left: 8.027px; padding-right: 8.027px; border-radius: var(--r-box); background: var(--sunk-3); }
.dg-keep{
  display: block; margin-top: 8.027px; padding-top: 10.32px;
  border-top: 0.573px solid var(--line-soft);
  font-size: var(--fs-tiny); color: var(--ink-600); line-height: 1.6;
}


.action-bar .cta--ghost{ background: var(--card-bg); }



.dg-step{
  display: flex; align-items: flex-start; gap: 10.32px;
  padding: 12.04px 0; border-top: 0.573px solid var(--line-soft);
}
.dg-step-n{
  flex: 0 0 25.227px; width: 25.227px; height: 25.227px; border-radius: 50%;
  background: var(--sunk-3); color: var(--ink-900);
  font-size: var(--fs-sec); line-height: 25.227px; text-align: center;
}
.dg-sheet-note{ margin-top: 8.027px; padding: 10.32px 11.467px; border-radius: var(--r-box); background: var(--sunk); }</style>

// 保留当前查询串，这样在 shell 里点进去的下一页仍然是 embed / 整页态。
(function () {
  var SLUG = "diagnosis--游客态";
  try { if (parent !== window) parent.postMessage({ mpScreen: SLUG }, "*"); } catch (e) {}
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el) return;
    e.preventDefault();
    var t = el.getAttribute("data-nav");
    if (t === "__back__") {
      // 深链进来时没有上一页可回；交给宿主 shell 打开页面清单，而不是静默什么都不发生
      if (history.length > 1) history.back();
      else { try { if (parent !== window) parent.postMessage({ mpBack: true }, "*"); } catch (e2) {} }
      return;
    }
    location.href = t + ".html" + location.search;
  });
})();
