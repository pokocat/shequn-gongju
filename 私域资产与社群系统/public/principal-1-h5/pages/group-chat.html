<style>:root{ --brand:#7C3AED; }

.chat-bub{ max-width:76%; padding:9.173px 12.04px; box-sizing:border-box; border-radius:14.907px; background:var(--card-bg); border:0.573px solid var(--line); box-shadow:var(--sh-1); font-size:var(--fs-sec); color:var(--ink-800); line-height:1.65; word-break:break-word; }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function resolveGroup() {
    var g = "";
    try { g = new URLSearchParams(location.search).get("g") || ""; } catch (e) {}
    return GROUPS[g] || GROUPS["ca1-growth"];
  }

  function avaHtml(src) {
    return '<div class="chat-ava wx-view"><div class="avatar wx-view" style="width:36.4px;height:36.4px;"><img class="avatar-img wx-image" src="' + esc(src) + '" alt=""/></div></div>';
  }
  function mineAvaHtml() {
    return '<div class="chat-ava wx-view"><div class="avatar avatar--ring wx-view" style="width:36.4px;height:36.4px;"><span class="avatar-ini wx-text" style="font-size:15.48px;">我</span></div></div>';
  }
  function cardHtml(c) {
    return '<div class="chat-card wx-view">' +
      '<div class="chat-card-h wx-view"><div class="chat-card-ico wx-view"><div class="wxc wxc-icon"><div class="ico wx-view" style="width:14.907px;height:14.907px;background-image:' + icoUrl(c.ico) + ';background-size:100% 100%;background-repeat:no-repeat;flex-shrink:0;"></div></div></div>' +
      '<span class="chat-card-t wx-text">' + esc(c.title) + "</span></div>" +
      '<div class="chat-card-b wx-view">' + c.rows.map(function (r) {
        return '<div class="chat-kv wx-view"><span class="chat-kv-l wx-text">' + esc(r[0]) + '</span><span class="chat-kv-v mono wx-text">' + esc(r[1]) + "</span></div>";
      }).join("") + "</div>" +
      '<div class="chat-card-f wx-view">' + c.ctas.map(function (cta, i) {
        return '<div class="chat-cta ' + (i === 0 ? "chat-cta--pri" : "chat-cta--ghost") + ' wx-view"><span class="wx-text">' + esc(cta[0]) + "</span></div>";
      }).join("") + "</div></div>";
  }

  function render(group) {
    document.getElementById("chat-name").textContent = group.name;
    document.getElementById("chat-count").textContent = group.count + " 人";
    var unlocked = false;
    try { unlocked = localStorage.getItem("member-unlocked-" + getGroupId()) === "1"; } catch (e) {}
    var html = "";
    if (group.syncLabel) {
      html += '<div class="sync-note wx-view"><strong class="wx-text">' + esc(group.syncLabel) + '</strong><span class="wx-text">同步时间：' + esc(group.syncTime) + ' · 同步范围：' + esc(group.syncScope) + '</span></div>';
    }
    html += group.msgs.map(function (m) {
      if (m.t) return '<div class="chat-time wx-view"><span class="mono wx-text">' + esc(m.t) + "</span></div>";
      if (m.me) return '<div class="chat-row chat-row--mine wx-view">' + mineAvaHtml() + '<div class="chat-bub wx-view"><span class="wx-text">' + esc(m.text) + "</span></div></div>";
      return '<div class="chat-row wx-view">' + avaHtml(m.ava) + '<div class="chat-col wx-view"><span class="chat-from wx-text">' + esc(m.from) + '</span><div class="chat-bub wx-view"><span class="wx-text">' + esc(m.text) + '</span></div></div></div>';
    }).join("");
    if (group.lockedMessages && !unlocked) {
      html += group.lockedMessages.map(function (m) {
        return '<div class="chat-row locked-row wx-view">' + avaHtml(m.ava) + '<div class="chat-col wx-view"><span class="chat-from wx-text">' + esc(m.from) + '</span><div class="locked-label wx-text">会员专属内容 · 已锁定</div><div class="chat-bub locked-bub wx-view"><span class="wx-text">升级会员后查看完整消息</span></div></div></div>';
      }).join("");
      html += '<div class="unlock-card wx-view"><strong class="wx-text">升级会员查看完整内容</strong><p class="wx-text">解锁企业微信群中的完整讨论、名单与复盘资料。</p><div class="unlock-cta wx-view" data-chat-unlock="' + esc(getGroupId()) + '"><span class="wx-text">立即升级</span></div></div>';
    } else if (group.lockedMessages) {
      html += group.lockedMessages.map(function (m) {
        return '<div class="chat-row wx-view">' + avaHtml(m.ava) + '<div class="chat-col wx-view"><span class="chat-from wx-text">' + esc(m.from) + '</span><div class="chat-bub wx-view"><span class="wx-text">' + esc(m.text) + '</span></div></div></div>';
      }).join("");
    }
    html += '<div class="chat-new wx-view"><span class="wx-text">以下是新消息</span></div>';
    var card = group.card;
    if (unlocked && group.lockedMessages) {
      card = {
        ico: group.card.ico,
        title: group.card.title.replace(" · 部分可见", " · 完整内容").replace(" · 参会提醒", " · 完整资料").replace(" · 报名入口", " · 完整资料"),

        ctas: [["完整内容已解锁", null]],
        note: "会员专属内容已解锁，可查看完整群消息与资料。"
      };
    }
    html += '<div class="chat-row wx-view">' + avaHtml(group.host) + '<div class="chat-stack wx-view">' + cardHtml(card) + '<div class="chat-bub wx-view"><span class="wx-text">' + esc(card.note) + "</span></div></div></div>";
    document.getElementById("chat-flow").innerHTML = html;
  }

  function getGroupId() {
    try { return new URLSearchParams(location.search).get("g") || "ca1-growth"; } catch (e) { return "ca1-growth"; }
  }

  var currentGroup = null;
  function renderAi(group) {
    currentGroup = group;
    var text = (group.msgs || []).filter(function (m) { return m.text; }).map(function (m) { return m.text; }).join(" ");
    var groups = [
      ["核心话题", text.match(/[^。！？]*(?:直播|投票|选品|续费|峰会|供应链|文案)[^。！？]*/g) || []],
      ["已确认结论", text.match(/[^。！？]*(?:已定|定了|结论|统一用|确定|胜出|领先)[^。！？]*/g) || []],
      ["我的待办", text.match(/[^。！？]*(?:我[^。！？]*(?:收到|完成|筛选|跟|发|确认|参加|投票))[^。！？]*/g) || []],
      ["关注事项", text.match(/[^。！？]*(?:截止|优先|提醒|报名|调整|详细)[^。！？]*/g) || []]
    ];
    var list = document.getElementById("ai-list"); list.innerHTML = "";
    groups.forEach(function (g) { var sec = document.createElement("section"); sec.className = "gc-summary-group"; var h = document.createElement("div"); h.className = "gc-summary-label"; h.textContent = g[0]; sec.appendChild(h); var items = g[1].filter(function (v, i, a) { return v && a.indexOf(v) === i; }); if (!items.length) { var empty = document.createElement("div"); empty.className = "gc-summary-empty"; empty.textContent = "暂无可确认内容"; sec.appendChild(empty); } else items.forEach(function (v) { var p = document.createElement("div"); p.className = "gc-summary-item"; p.textContent = v; sec.appendChild(p); }); list.appendChild(sec); });
  }
  function answer(question, key) {
    var text = (currentGroup.msgs || []).filter(function (m) { return m.text; }).map(function (m) { return m.text; }).join(" ");
    if (key === "hot" || /热议|话题|讨论/.test(question)) return text.match(/[^。！？]*(?:直播|投票|选品|续费|峰会|供应链|文案)[^。！？]*/g)?.join("；") || "当前可见同步记录没有足够的热议话题信息。";
    if (key === "todo" || /待办|任务|截止|提醒/.test(question)) return text.match(/[^。！？]*(?:截止|优先|报名|提醒|我[^。！？]*(?:收到|完成|筛选|跟|发|确认|参加))[^。！？]*/g)?.join("；") || "当前可见同步记录没有确认到待办。";
    if (key === "decision" || /结论|决定|确认/.test(question)) return text.match(/[^。！？]*(?:已定|定了|结论|统一用|确定|胜出|领先)[^。！？]*/g)?.join("；") || "当前可见同步记录无法确认明确的结论或决定。";
    return "当前可见同步记录无法确认这件事。";
  }
  function showAnswer(question, key) { document.getElementById("gc-answer-t").textContent = answer(question, key); document.getElementById("gc-answer-source").textContent = "回答来源：当前群已同步且可见的消息；未读取会员专属锁定内容。"; document.getElementById("gc-answer").hidden = false; }

  render(resolveGroup());
  renderAi(resolveGroup());
  document.querySelectorAll(".gc-q-chip").forEach(function (c) { c.addEventListener("click", function () { showAnswer(c.textContent, c.getAttribute("data-q")); }); });
  document.getElementById("gc-send").addEventListener("click", function () { var input = document.getElementById("gc-input"), q = input.textContent.trim(); if (!q) { input.focus(); input.classList.add("is-focus"); return; } showAnswer(q, ""); });
  document.getElementById("gc-input").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); document.getElementById("gc-send").click(); } });
  var sumPanel = document.getElementById("gc-sum"), askPanel = document.getElementById("gc-ask"), sumBtn = document.getElementById("gc-btn-sum"), askBtn = document.getElementById("gc-btn-ask");
  function toggle(panel, btn, other, otherBtn) { var on = !panel.classList.contains("is-open"); other.classList.remove("is-open"); otherBtn.classList.remove("is-on"); panel.classList.toggle("is-open", on); btn.classList.toggle("is-on", on); btn.setAttribute("aria-expanded", on ? "true" : "false"); }
  sumBtn.addEventListener("click", function () { toggle(sumPanel, sumBtn, askPanel, askBtn); }); askBtn.addEventListener("click", function () { toggle(askPanel, askBtn, sumPanel, sumBtn); });

  try { if (parent !== window) parent.postMessage({ mpScreen: SLUG }, "*"); } catch (e) {}
  document.querySelectorAll("[data-nav]").forEach(function (el) {
    if (!el.hasAttribute("role")) el.setAttribute("role", "link");
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
  });
  document.addEventListener("keydown", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    el.click();
  });
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el) return;
    e.preventDefault();
    var t = el.getAttribute("data-nav");
    if (t === "__back__") {
      if (history.length > 1) history.back();
      else { try { if (parent !== window) parent.postMessage({ mpBack: true }, "*"); } catch (e2) {} }
      return;
    }
    if (parent !== window) {
      parent.postMessage({ mpNavigate: t, search: location.search }, "*");
    } else {
      location.href = t + ".html" + location.search;
    }
  });
})();
