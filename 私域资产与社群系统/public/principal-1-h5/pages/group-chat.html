.chat-col{ display:flex; flex-direction:column; max-width:76%; min-width:0; }
.chat-from{ display:block; margin:0 0 3.44px 2.293px; font-size:var(--fs-micro); color:var(--ink-500); }
.chat-stack{ display:flex; flex-direction:column; gap:8.027px; max-width:76%; min-width:0; }
.chat-bub{ max-width:76%; padding:9.173px 12.04px; box-sizing:border-box; border-radius:14.907px; background:var(--card-bg); border:0.573px solid var(--line); box-shadow:var(--sh-1); font-size:var(--fs-sec); color:var(--ink-800); line-height:1.65; word-break:break-word; }
.chat-col .chat-bub, .chat-stack .chat-bub{ max-width:100%; }
.chat-row:not(.chat-row--mine) .chat-bub{ border-top-left-radius:4.587px; }
.chat-row--mine .chat-bub{ border-top-right-radius:4.587px; background:linear-gradient(135deg,#8B5CF6 0%,#7C3AED 100%); border-color:transparent; color:var(--on-signal); box-shadow:0 1.72px 6.88px rgba(124,58,237,0.22); }
.chat-card{ background:#FFFEFA; border:0.573px solid var(--line); border-radius:11.467px; overflow:hidden; box-shadow:var(--sh-1); }
.chat-card-h{ display:flex; align-items:center; gap:6.88px; padding:9.173px 11.467px; background:var(--sunk); border-bottom:0.573px solid var(--line-soft); }
.chat-card-ico{ flex:0 0 auto; width:25.227px; height:25.227px; border-radius:7.453px; background:var(--sunk-3); border:0.573px solid var(--line-brand); display:flex; align-items:center; justify-content:center; }
.chat-card-t{ font-size:var(--fs-sec); font-weight:700; color:var(--ink-900); line-height:1.3; }
.chat-card-b{ padding:8.027px 11.467px; }
.chat-kv{ display:flex; justify-content:space-between; align-items:baseline; gap:12.04px; padding:3.44px 0; }
.chat-kv-l{ flex:0 0 auto; font-size:var(--fs-tiny); color:var(--ink-600); }
.chat-kv-v{ font-size:var(--fs-tiny); color:var(--ink-900); font-weight:600; text-align:right; }
.chat-card-f{ display:flex; gap:8.027px; padding:2.293px 11.467px 10.32px; }
.chat-cta{ flex:1; height:29.813px; display:flex; align-items:center; justify-content:center; border-radius:var(--r-pill); font-size:var(--fs-meta); font-weight:700; cursor:pointer; }
.chat-cta--pri{ background:var(--brand); color:var(--on-signal); }
.chat-cta--ghost{ background:var(--sunk-2); color:var(--brand); }
.chat-dock{ position:sticky; bottom:0; z-index:6; display:flex; align-items:center; gap:8.027px; margin:0 calc(-1 * var(--gutter)); padding:8.027px var(--gutter) calc(8.027px + var(--sab)); background:linear-gradient(180deg, rgba(255,247,236,0), rgba(255,247,236,0.94) 34%, var(--bg-base-end)); }

      if (m.t) return '<div class="chat-time wx-view"><span class="mono wx-text">' + esc(m.t) + "</span></div>";
      if (m.me) {
        return '<div class="chat-row chat-row--mine wx-view">' + mineAvaHtml() +
          '<div class="chat-bub wx-view"><span class="wx-text">' + esc(m.text) + "</span></div></div>";
      }
      return '<div class="chat-row wx-view">' + avaHtml(m.ava) +
        '<div class="chat-col wx-view"><span class="chat-from wx-text">' + esc(m.from) + "</span>" +
        '<div class="chat-bub wx-view"><span class="wx-text">' + esc(m.text) + "</span></div></div></div>";
    }).join("");
    /* 「以下是新消息」分隔 + 群富卡片（与私聊页同款卡片样式） */
    html += '<div class="chat-new wx-view"><span class="wx-text">以下是新消息</span></div>';
    html += '<div class="chat-row wx-view">' + avaHtml(group.host) +
      '<div class="chat-stack wx-view">' + cardHtml(group.card) +
      '<div class="chat-bub wx-view"><span class="wx-text">' + esc(group.card.note) + "</span></div></div></div>";
    document.getElementById("chat-flow").innerHTML = html;
  }

  render(resolveGroup());

  try { if (parent !== window) parent.postMessage({ mpScreen: SLUG }, "*"); } catch (e) {}
  document.querySelectorAll("[data-nav]").forEach(function (el) {
    if (!el.hasAttribute("role")) el.setAttribute("role", "link");
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
  });
  document.addEventListener("keydown", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el || (e.key !== "Enter" && e.key !== " ")) return;
    e.preventDefault();
    el.click();
  });
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el) return;
    e.preventDefault();
    var t = el.getAttribute("data-nav");
    if (t === "__back__") {
      if (history.length > 1) history.back();
      else { try { if (parent !== window) parent.postMessage({ mpBack: true }, "*"); } catch (e2) {} }
      return;
    }
    if (parent !== window) {
      parent.postMessage({ mpNavigate: t, search: location.search }, "*");
    } else {
      location.href = t + ".html" + location.search;
    }
  });
})();
</script>
<script src="../js/chat-interactions.js"></script>
</body></html>
