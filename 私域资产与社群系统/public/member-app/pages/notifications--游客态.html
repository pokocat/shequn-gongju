<style>.searchbar{
  display: flex; align-items: center; gap: 8.027px;
  height: 43.573px; padding: 0 12.04px; box-sizing: border-box; margin-bottom: 9.173px;
  border-radius: var(--r-pill);
  background: var(--sunk); border: 0.573px solid var(--line);
}
.searchbar-i{
  flex: 1; min-width: 0;
  font-size: var(--fs-sec); color: var(--ink-900);
}
.searchbar-ph{ color: var(--ink-500); }

.searchbar-x{
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  width: 27.52px; height: 27.52px; border-radius: var(--r-pill);
  background: var(--sunk-2);
}


.todo-rail{
  white-space: nowrap; margin-bottom: 10.32px;
  display: flex; gap: 8.027px;
}
.todo-card{
  flex: 0 0 auto; display: flex; align-items: center; gap: 6.88px;
  min-width: 172px; padding: 9.173px 11.467px; box-sizing: border-box;
  border-radius: var(--r-card);
  background: var(--card-bg); border: 0.573px solid var(--line);
}
.todo-ico{
  flex: none; width: 27.52px; height: 27.52px; border-radius: 8.027px;
  display: flex; align-items: center; justify-content: center;
  background: var(--sunk-3); border: 0.573px solid var(--line-brand);
}
.todo-t{ display: block; font-size: var(--fs-meta); font-weight: 700; color: var(--ink-900); }
.todo-d{ display: block; margin-top: 2.293px; font-size: var(--fs-micro); color: var(--ink-600); }


.msg-head{ margin-bottom: 8.027px; min-height: 29.813px; }
.msg-sum{ font-size: var(--fs-meta); font-weight: 700; color: var(--ink-700); }


.msg-filters{
  white-space: nowrap; margin-bottom: 9.173px;
  display: flex; gap: 6.88px;
}
.msg-filters .chip{ flex: 0 0 auto; }


.msg-row{
  display: flex; align-items: center; gap: 11.467px;
  padding: 11.467px 0; border-top: 0.573px solid var(--line-soft);
}
.msg-row:first-of-type{ border-top: none; padding-top: 2.293px; }
.msg-ava{ position: relative; flex: 0 0 48.16px; height: 48.16px; }

.msg-badge{
  position: absolute; right: -4.587px; top: -4.587px;
  min-width: 17.2px; height: 17.2px; padding: 0 4.587px; box-sizing: border-box;
  border-radius: var(--r-pill);
  background: var(--danger); color: var(--on-signal);
  font-size: var(--fs-micro); font-weight: 700; line-height: 17.2px; text-align: center;
  border: 1.147px solid var(--card-bg);
}
.msg-name{ font-size: var(--fs-h4); font-weight: 700; color: var(--ink-900); }
.msg-title{ font-size: var(--fs-sec); font-weight: 600; color: var(--ink-800); }


.th-name{ display: block; font-size: var(--fs-h4); font-weight: 700; color: var(--ink-900); }
.msg-item{
  display: flex; gap: 11.467px; align-items: flex-start;
  padding: 11.467px 0; border-top: 0.573px solid var(--line-soft);
}
.msg-item:first-of-type{ border-top: none; }
.msg-item-t{ font-size: var(--fs-sec); font-weight: 700; color: var(--ink-900); }


.browse-more{ display: flex; align-items: center; gap: 10.32px; }

.sub-banner{ display: flex; align-items: center; gap: 10.32px; padding: 13.76px; }
.sub-t{ display: block; font-size: var(--fs-h4); font-weight: 700; color: var(--on-signal); }
.sub-d{ display: block; font-size: var(--fs-tiny); color: var(--on-signal-2); margin-top: 2.867px; }
.sub-btn{
  flex-shrink: 0; display: flex; align-items: center; gap: 4.587px;
  height: 33.253px; padding: 0 13.76px; border-radius: var(--r-pill);
  background: var(--on-signal-wash);
  color: var(--on-signal); font-size: var(--fs-sec); font-weight: 700;
}


.msg-hint{
  display: block; margin: -3.44px 0 8.027px;
  font-size: var(--fs-tiny); color: var(--ink-600); line-height: 1.5;
}


.msg-role{ font-size: var(--fs-tiny); color: var(--ink-600); }


.msg-ava-ico{
  width: 48.16px; height: 48.16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--sunk-3); border: 0.573px solid var(--line-brand);
}
.msg-ava-ico--sm{ width: 32.107px; height: 32.107px; }</style>
