<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主理台</title>
<link rel="stylesheet" href="../css/app.css?v=20260917">
<script>
var q = location.search;
if (q.indexOf('embed') >= 0) document.documentElement.className = 'mp-embed';
if (q.indexOf('full=1') >= 0) document.addEventListener('DOMContentLoaded', function () { document.body.classList.add('mp-full'); });
</script>
<style>.tk-layer{ padding-bottom: calc(22.933px + var(--sab)); }

/* ===== 身份分段器（复用全局 topseg 组件 · 置顶吸住） ===== */
.tk-topseg{
  margin:96px 10.32px 0; /* 顶部避开状态栏(54px)+胶囊(至92px) */
  position:sticky; top:96px; z-index:50;
  background:#FFFCF6; /* 实色底：吸顶时遮住滚过的内容 */
  box-shadow:0 2px 10px rgba(122,82,54,.08);
}
.tk-topseg .topseg-item{ cursor:pointer; transition:all .18s ease; }
.tk-topseg .topseg-item:active{ transform:scale(.96); }
.topseg-item--lock{ color:var(--ink-400); }
.topseg-item--lock svg{ width:12.04px; height:12.04px; flex-shrink:0; }
/* tab 页撑满机身：内容不足一屏时 tabbar 依然贴手机屏底 */
.mp-page{ min-height:100%; display:flex; flex-direction:column; }
.tabbar{ --sab:34px; } /* tabbar 移出 .mp-page 后补回安全区变量，高度与其他 tab 页一致 */
.screen--tab{ flex:1 1 auto; display:flex; flex-direction:column; }
.tk-layer{ flex:1 1 auto; }

/* ===== hero 卡内周期分段 ===== */
.tk-periods{ display:flex; gap:3.44px; padding:3.44px; border-radius:9.173px; background:var(--sunk-2); margin-bottom:11.467px; }
.tk-per{
  flex:1; text-align:center; padding:4.013px 0; border-radius:6.88px;
  font-size:var(--fs-micro); font-weight:600; color:var(--ink-600);
  cursor:pointer; transition:all .15s ease;
}
.tk-per--on{ background:#FFF; color:var(--signal-700); font-weight:700; box-shadow:0 1px 4px rgba(122,82,54,.12); }
.tk-per:active{ transform:scale(.95); }

/* ===== 工作台区（代理/团长视角内嵌） ===== */
.stat3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6.88px; padding:0 10.32px; margin-top:10.32px; }
.stat3-cell{ text-align:center; padding:10.32px 4px; border-radius:var(--r-box); background:var(--sunk); border:0.573px solid var(--line-soft); }
.stat3-v{ display:block; font-size:var(--fs-h3); font-weight:800; color:var(--ink-900); }
.stat3-l{ display:block; margin-top:2.293px; font-size:var(--fs-micro); color:var(--ink-600); }
/* 本周方向卡 */
.dir-card{ margin:10.32px 10.32px 0; padding:13.76px; border-radius:var(--r-box); background:var(--grad-hero); border:0.573px solid var(--line-brand); box-shadow:0 3px 12px rgba(124,58,237,.10); }
.dir-head{ display:flex; justify-content:space-between; align-items:center; }
.dir-tag{ font-size:var(--fs-micro); font-weight:700; color:var(--signal-700); background:rgba(124,58,237,.1); padding:2.293px 6.88px; border-radius:5.733px; }
.dir-t{ font-size:var(--fs-h3); font-weight:800; color:var(--ink-900); margin-top:6.88px; }
.dir-d{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:2.867px; line-height:1.5; }
.dir-chips{ display:flex; gap:5.16px; margin-top:8.027px; flex-wrap:wrap; }
.dir-chip{ font-size:var(--fs-micro); color:var(--ink-700); background:rgba(255,255,255,.55); padding:2.867px 8.027px; border-radius:5.733px; border:0.573px solid var(--line-soft); }
/* 平台分发宫格 */
.dist-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8.027px; }
.dist-tile{ text-align:center; padding:11.467px 4px; border-radius:var(--r-box); background:var(--sunk-2); border:0.573px solid var(--line-soft); position:relative; cursor:pointer; transition:transform .15s; }
.dist-tile:active{ transform:scale(.95); }
.dist-ico{ width:36.8px; height:36.8px; margin:0 auto; border-radius:10.32px; display:flex; align-items:center; justify-content:center; color:var(--signal-700); background:var(--signal-50); border:0.573px solid var(--line-brand); }
.dist-ico svg{ width:19px; height:19px; }
.dist-n{ display:block; margin-top:5.16px; font-size:var(--fs-micro); font-weight:700; color:var(--ink-800); }
.dist-c{ display:block; margin-top:1.147px; font-size:var(--fs-micro); color:var(--pulse-600); font-weight:600; }
/* 入口行 */
.entry-row{ display:flex; align-items:center; gap:10.32px; padding:10.32px 0; border-bottom:0.573px solid var(--line-soft); cursor:pointer; }
.entry-row:last-child{ border-bottom:none; }
.entry-ico{ width:34.4px; height:34.4px; border-radius:9.173px; display:flex; align-items:center; justify-content:center; color:var(--signal-700); background:var(--signal-50); border:0.573px solid var(--line-brand); flex-shrink:0; }
.entry-ico svg{ width:18px; height:18px; }
.entry-t{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.entry-d{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }
.entry-go{ color:var(--ink-400); font-size:var(--fs-meta); flex-shrink:0; }
/* 团队排行 */
.rank-row{ display:flex; align-items:center; gap:8.027px; padding:8.027px 0; border-bottom:0.573px solid var(--line-soft); }
.rank-row:last-child{ border-bottom:none; }
.rank-n{ width:20.64px; height:20.64px; border-radius:6.88px; display:flex; align-items:center; justify-content:center; font-size:var(--fs-micro); font-weight:800; color:var(--signal-700); background:var(--sunk-3); flex-shrink:0; }
.rank-n--top{ background:linear-gradient(135deg,#F7B65C,#E88C4A); color:#FFF; }
.rank-info{ flex:1; min-width:0; }
.rank-t{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.rank-d{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }
.rank-v{ font-size:var(--fs-meta); font-weight:800; color:var(--pulse-600); }

/* ===== 工作台子应用（方案C）：数据头条 + 子页签 + 底部动作栏 ===== */
.substat{ display:flex; margin:10.32px 10.32px 0; padding:9.173px 0; border-radius:var(--r-box); background:var(--sunk); border:0.573px solid var(--line-soft); }
.substat-cell{ flex:1; text-align:center; min-width:0; }
.substat-cell + .substat-cell{ border-left:0.573px solid var(--line-soft); }
.substat-v{ display:block; font-size:var(--fs-h4); font-weight:800; color:var(--ink-900); }
.substat-l{ display:block; margin-top:1.147px; font-size:var(--fs-micro); color:var(--ink-600); }
/* 子页签（轻量导航，与身份 topseg 形成层级差） */
.subtab{ display:flex; gap:4.587px; padding:10.32px 10.32px 8.027px; }
.subtab-pill{
  flex:1; text-align:center; padding:6.307px 0; border-radius:7.45px;
  font-size:14px; font-weight:600; line-height:1.2; color:var(--ink-600);
  background:var(--sunk-2); border:0.573px solid var(--line-soft);
  cursor:pointer; transition:all .15s ease;
}
.subtab-pill--on{ background:#FFF; color:var(--signal-700); font-size:15px; font-weight:700; border-color:var(--line-brand); box-shadow:0 1px 5px rgba(124,58,237,.10); }
.subtab-pill:active{ transform:scale(.95); }
/* 子页内容区 */
.subbody{ min-height:200px; }
/* 底部动作栏（常驻 tabbar 上方） */
.actbar{
  position:sticky; bottom:calc(51.6px + var(--sab)); z-index:60; display:flex; gap:6.88px;
  padding:10.32px 10.32px 8.027px;
  background:linear-gradient(180deg,rgba(255,247,236,0),rgba(255,247,236,.97) 45%);
}
.actbar-btn{ flex:1; text-align:center; padding:10.32px 0; border-radius:10.893px; font-size:var(--fs-sec); font-weight:800; cursor:pointer; }
.actbar-btn--pri{ background:linear-gradient(90deg,var(--signal-600),var(--signal-800)); color:#FFF; box-shadow:0 4px 14px rgba(109,40,217,.3); }
.actbar-btn--ghost{ background:rgba(255,255,255,.94); color:var(--signal-700); border:0.573px solid var(--line-signal); }
.actbar-btn:active{ transform:scale(.97); }

/* ===== 数据驾驶舱（照参考图排版：渐变头部 + 周期下划线tab + 日期行 + 表格明细） ===== */
.rep-head{
  margin:10.32px 10.32px 0; border-radius:var(--r-box);
  background:linear-gradient(160deg,#5B21B6 0%,#7C3AED 48%,#A98BF5 100%);
  padding:14.907px 14.907px 0; color:#FFF7EC;
  box-shadow:0 6px 22px rgba(91,33,182,.28);
}
.rep-l{ font-size:var(--fs-micro); font-weight:600; color:rgba(255,247,236,.72); }
.rep-num{ font-size:34.4px; font-weight:800; font-family:var(--font-mono); line-height:1.25; margin-top:1.147px; }
.rep-sub{ display:flex; justify-content:space-between; align-items:center; margin-top:2.293px; }
.rep-wd{ font-size:var(--fs-micro); color:rgba(255,247,236,.85); }
.rep-wd b{ font-family:var(--font-mono); font-weight:800; }
.rep-btn{ padding:5.16px 14.907px; border-radius:16.053px; background:rgba(255,247,236,.95); color:var(--signal-800); font-size:var(--fs-micro); font-weight:800; cursor:pointer; }
.rep-btn:active{ transform:scale(.95); }
/* 周期下划线 tab（嵌在渐变头部内，参考「日报/月报」样式） */
.rep-tabs{ display:flex; margin-top:11.467px; }
.rep-tab{ flex:1; text-align:center; padding:6.88px 0 8.6px; font-size:var(--fs-meta); font-weight:600; color:rgba(255,247,236,.62); cursor:pointer; position:relative; transition:color .15s; }
.rep-tab--on{ color:#FFF7EC; font-weight:800; }
.rep-tab--on::after{ content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:24.08px; height:2.293px; border-radius:1.147px; background:#F7B65C; }
/* 日期行 */
.rep-date{ display:flex; align-items:center; gap:5.733px; margin:8.027px 10.32px 0; padding:7.45px 11.467px; border-radius:9.173px; background:#FFF; border:0.573px solid var(--line-soft); font-size:var(--fs-micro); color:var(--ink-700); font-weight:600; cursor:pointer; }
.rep-date svg{ width:12.04px; height:12.04px; color:var(--ink-500); flex-shrink:0; }
.rep-date .d-arrow{ margin-left:auto; color:var(--ink-400); }
/* 三列收益分解（表格式，白卡内分列） */
.rep-split{ display:grid; grid-template-columns:repeat(3,1fr); }
.rep-split-cell{ text-align:center; padding:9.173px 2px; min-width:0; }
.rep-split-cell + .rep-split-cell{ border-left:0.573px solid var(--line-soft); }
.rep-split-v{ display:block; font-size:var(--fs-h4); font-weight:800; color:var(--ink-900); font-family:var(--font-mono); }
.rep-split-l{ display:block; margin-top:1.147px; font-size:var(--fs-micro); color:var(--ink-600); }
/* 团队发展漏斗（白底格，可下钻） */
.funnel-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6.88px; }
.funnel-cell{ text-align:center; padding:10.32px 2px 8.6px; border-radius:10.32px; background:#FFF; border:0.573px solid var(--line-soft); cursor:pointer; transition:transform .15s; position:relative; }
.funnel-cell:active{ transform:scale(.95); }
.funnel-v{ display:block; font-size:var(--fs-h3); font-weight:800; color:var(--signal-800); font-family:var(--font-mono); }
.funnel-l{ display:block; margin-top:1.72px; font-size:var(--fs-micro); font-weight:600; color:var(--ink-600); }
.funnel-go{ position:absolute; top:5.16px; right:6.88px; color:var(--ink-400); font-size:9px; }
/* 收益状态三格 */
.status-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:6.88px; }
.status-cell{ text-align:center; padding:9.173px 2px; border-radius:10.32px; background:var(--sunk); border:0.573px solid var(--line-soft); }
.status-v{ display:block; font-size:var(--fs-h4); font-weight:800; color:var(--ink-900); font-family:var(--font-mono); }
.status-l{ display:block; font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }
.status-v--ok{ color:var(--ok); }
/* 类别明细表格（参考「类别|订单量|预估收益」表头+下钻行） */
.rep-table-h{ display:grid; grid-template-columns:1.5fr 1fr 1.1fr 16px; gap:4px; padding:6.88px 9.173px; border-radius:8.027px; background:rgba(124,58,237,.09); font-size:var(--fs-micro); font-weight:700; color:var(--signal-800); }
.rep-table-r{ display:grid; grid-template-columns:1.5fr 1fr 1.1fr 16px; gap:4px; padding:8.6px 9.173px; font-size:var(--fs-micro); color:var(--ink-800); border-bottom:0.573px solid var(--line-soft); align-items:center; }
.rep-table-r:last-child{ border-bottom:none; }
.rep-table-r .m{ font-family:var(--font-mono); font-weight:700; }
.rep-table-r .r-go{ color:var(--ink-400); text-align:right; }
/* 团长方向入口条 */
.dir-strip{ margin:10.32px 10.32px 0; padding:10.32px 12.04px; border-radius:var(--r-box); background:var(--sunk); border:0.573px solid var(--line-soft); display:flex; align-items:center; gap:8.027px; cursor:pointer; }
.dir-strip:active{ transform:scale(.98); }
.dir-strip-ico{ width:30.16px; height:30.16px; border-radius:8.027px; background:linear-gradient(135deg,var(--signal-600),var(--signal-800)); color:#FFF; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.dir-strip-ico svg{ width:15px; height:15px; }
.dir-strip-t{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.dir-strip-d{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }

/* ===== 预计收入分析：环形图（参考我的影响力） ===== */
.donut-wrap{ display:flex; align-items:center; gap:13.76px; }
.donut{ flex-shrink:0; position:relative; width:126.5px; height:126.5px; }
.donut svg{ transform:rotate(-90deg); }
.donut-c{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut-cv{ font-size:var(--fs-h4); font-weight:800; color:var(--ink-900); font-family:var(--font-mono); }
.donut-cl{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }
.donut-legend{ flex:1; min-width:0; }
.donut-li{ display:flex; align-items:center; gap:5.733px; padding:3.44px 0; font-size:var(--fs-micro); color:var(--ink-700); }
.donut-dot{ width:8.027px; height:8.027px; border-radius:2.867px; flex-shrink:0; }
.donut-li .dv{ margin-left:auto; font-family:var(--font-mono); font-weight:700; color:var(--ink-900); }

/* ===== 影响力详情表格（参考我的影响力：3×3 + 彩点列头 + 红+N） ===== */
.inf-table{ width:100%; border-collapse:collapse; }
.inf-table th{ font-size:var(--fs-micro); font-weight:700; color:var(--ink-700); padding:5.16px 4px; text-align:center; border-bottom:0.573px solid var(--line-soft); }
.inf-table th .th-dot{ display:inline-block; width:6.88px; height:6.88px; border-radius:50%; margin-right:3.44px; vertical-align:0.5px; }
.inf-table td{ font-size:var(--fs-micro); color:var(--ink-800); padding:7.45px 4px; text-align:center; border-bottom:0.573px solid var(--line-soft); font-family:var(--font-mono); }
.inf-table tr:last-child td{ border-bottom:none; }
.inf-table td.row-h{ font-family:inherit; color:var(--ink-600); text-align:left; padding-left:2.293px; }
.inf-add{ display:inline-block; margin-left:2.293px; color:#D93025; font-weight:800; font-size:9px; }
.inf-note{ display:flex; align-items:center; gap:4.587px; margin-top:6.88px; font-size:var(--fs-micro); color:var(--ink-500); }
.inf-plus{ width:12.04px; height:12.04px; border-radius:50%; background:rgba(217,48,37,.1); color:#D93025; font-weight:800; display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0; }
/* 旗下团队行（团长，参考旗下运营商） */
.team-row{ display:flex; align-items:center; gap:8.027px; padding:8.6px 0; border-bottom:0.573px solid var(--line-soft); cursor:pointer; }
.team-row:last-child{ border-bottom:none; }
.team-row-t{ flex:1; font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.team-row-v{ font-size:var(--fs-meta); font-weight:800; color:var(--signal-700); font-family:var(--font-mono); }
.team-row-go{ color:var(--ink-400); font-size:var(--fs-meta); }
.application-row{ align-items:flex-start; }
.application-row .team-row-t{ line-height:1.45; }
.application-meta{ display:block; margin-top:3px; color:var(--ink-500); font-size:10px; font-weight:500; }
.application-status{ color:var(--signal-700); font-size:10px; font-weight:800; white-space:nowrap; }
.application-detail{ padding:12px 14px 20px; }
.application-detail-card{ background:#fff; border:1px solid var(--line-soft); border-radius:12px; padding:14px; }
.application-detail-label{ color:var(--ink-500); font-size:11px; margin-bottom:5px; }
.application-detail-value{ color:var(--ink-900); font-size:14px; line-height:1.55; font-weight:700; }
.application-actions{ display:flex; gap:10px; margin-top:14px; }
.application-action{ flex:1; border:0; border-radius:10px; padding:11px 8px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
.application-action--approve{ background:#34A37A; color:#fff; }
.application-action--reject{ background:#FFF0EA; color:#B94A2C; }
.application-empty{ padding:22px 8px; text-align:center; color:var(--ink-500); font-size:12px; }

/* ===== 团队页：影响力双指标卡（参考我的影响力：渐变底+白卡两列） ===== */
.inf-hero{
  margin:8.027px 10.32px 0; padding:12.04px; border-radius:var(--r-box);
  background:linear-gradient(160deg,#5B21B6 0%,#7C3AED 48%,#A98BF5 100%);
  box-shadow:0 5px 18px rgba(91,33,182,.24);
}
.inf-hero-card{
  background:rgba(255,252,246,.96); border-radius:10.893px; padding:11.467px 0;
  display:flex; align-items:stretch;
}
.inf-hero-cell{ flex:1; text-align:center; min-width:0; }
.inf-hero-cell + .inf-hero-cell{ border-left:0.573px solid var(--line-soft); }
.inf-hero-v{ display:block; font-size:var(--fs-h2); font-weight:800; color:var(--ink-900); font-family:var(--font-mono); line-height:1.2; }
.inf-hero-l{ display:block; margin-top:1.72px; font-size:var(--fs-micro); color:var(--ink-600); }
.influence-scope-tabs{ margin:0 10.32px; padding:8.027px 0 6.88px; overflow-x:auto; scrollbar-width:none; }
.influence-scope-tabs::-webkit-scrollbar{ display:none; }
.influence-scope-tabs .subtab-pill{ flex:0 0 auto; min-width:72px; padding-left:8px; padding-right:8px; }
.influence-metrics{ display:grid; grid-template-columns:repeat(2,1fr); gap:6.88px; margin-top:10.32px; }
.influence-metrics--standalone{ margin:8.027px 10.32px 0; }
.influence-metric{ position:relative; overflow:hidden; padding:10.32px; border-radius:10.32px; background:rgba(255,252,246,.96); color:var(--ink-900); border:0.573px solid var(--line-soft); }
.influence-metric::after{ content:''; position:absolute; width:34px; height:34px; right:-12px; top:-12px; border-radius:50%; background:rgba(124,58,237,.08); }
.influence-metric-v{ display:block; font-family:var(--font-mono); font-size:var(--fs-h2); font-weight:800; line-height:1.15; }
.influence-metric-l{ display:block; margin-top:1.72px; font-size:var(--fs-tiny); color:var(--ink-600); }
.team-functions{ margin:8.027px 10.32px 0; padding:8.027px; border-radius:var(--r-box); background:#FFF; border:0.573px solid var(--line-soft); }
.influence-card-note{ flex:0 1 auto; min-width:0; font-size:var(--fs-tiny); color:var(--ink-500); text-align:right; line-height:1.35; }
.team-growth-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6.88px; }
.team-growth-item{ display:flex; align-items:center; gap:5.733px; min-height:50px; padding:8.027px; border-radius:9.173px; background:linear-gradient(145deg,#FFF 0%,var(--sunk) 100%); border:0.573px solid var(--line-soft); cursor:pointer; }
.team-growth-item:active{ background:var(--signal-50); }
.team-growth-icon{ width:26px; height:26px; flex:0 0 26px; display:flex; align-items:center; justify-content:center; border-radius:8.027px; background:rgba(124,58,237,.1); color:var(--signal-700); }
.team-growth-icon svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.team-growth-copy{ min-width:0; flex:1; }
.team-growth-title{ display:block; font-size:var(--fs-meta); font-weight:800; color:var(--ink-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ===== AI 军师悬浮球 ===== */
.ai-fab{
  position:absolute; right:14.907px; bottom:calc(103.253px + var(--sab));
  width:47.013px; height:47.013px; border-radius:50%; z-index:95;
  background:linear-gradient(135deg,#8B5CF6,#5B21B6);
  box-shadow:0 6px 18px rgba(91,33,182,.4), inset 0 1px 0 rgba(255,255,255,.25);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#FFF; cursor:pointer; transition:transform .15s;
}
.ai-fab:active{ transform:scale(.92); }
.ai-fab svg{ width:19px; height:19px; }
.ai-fab-t{ font-size:6.4px; font-weight:700; margin-top:1px; letter-spacing:.5px; }

/* ===== 身份解锁弹层（居中弹窗） ===== */
.unlock-mask{
  position:fixed; inset:0; z-index:120; background:rgba(51,33,15,.42);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.unlock-mask.is-open{ opacity:1; pointer-events:auto; }
.unlock-sheet{
  width:315.6px; border-radius:16.053px; background:#FFF7EC; padding:17.2px 16.053px;
  transform:scale(.8); transition:transform .2s;
  box-shadow:0 20px 50px rgba(51,33,15,.25);
}
.unlock-mask.is-open .unlock-sheet{ transform:scale(1); }
.unlock-h{ font-size:var(--fs-h3); font-weight:800; color:var(--ink-900); text-align:center; }
.unlock-d{ font-size:var(--fs-micro); color:var(--ink-600); text-align:center; margin-top:4.013px; }
.unlock-list{ margin:12.04px 0; }
.unlock-li{
  display:flex; align-items:center; gap:8.027px; padding:6.88px 9.173px;
  border-radius:8.027px; background:var(--sunk-2); margin-bottom:5.16px;
  font-size:var(--fs-meta); color:var(--ink-800);
}
.unlock-li svg{ width:13.76px; height:13.76px; color:var(--ink-500); flex-shrink:0; }
.unlock-btns{ display:flex; gap:6.88px; margin-top:12.04px; }
.unlock-btn{ flex:1; text-align:center; padding:8.6px 0; border-radius:9.173px; font-size:var(--fs-meta); font-weight:700; cursor:pointer; }
.unlock-btn--pri{ background:linear-gradient(90deg,var(--signal-600),var(--signal-800)); color:#FFF; }
.unlock-btn--ghost{ background:var(--sunk-2); color:var(--ink-700); }

.tk-hero{ padding: 16.053px; }
.tk-count{ gap: 6.88px; align-items: baseline; }
.tk-num{ font-size: var(--fs-display); font-weight: 700; line-height: 1.1; }
.tk-total{ font-size: var(--fs-h3); color: var(--ink-600); }
.tk-award{ font-size: var(--fs-meta); font-weight: 700; color: var(--pulse-600); }

.tk-row{
  display: flex; align-items: flex-start; gap: 12.613px;
  padding: 12.613px 0; border-top: 0.573px solid var(--line-soft);
  transition: opacity 180ms ease;
}
.tk-row:first-child{ border-top: none; }
.tk-row:active{ opacity: 0.6; }
.tk-row--done{ opacity: 0.55; }

.tk-check{
  width: 21.787px; height: 21.787px; flex: 0 0 21.787px; border-radius: 50%;
  margin-top: 2.293px; box-sizing: border-box;
  border: 1.72px solid var(--ink-400);
  display: flex; align-items: center; justify-content: center;
}
.tk-check--urgent{ border-color: var(--danger); }
.tk-check--done{ border-color: var(--ok-fill); background: var(--ok-fill); }
.tk-arrow{ flex:0 0 auto; margin-top:4.587px; }

.tk-title{ display: block; font-size: var(--fs-h4); font-weight: 700; color: var(--ink-900); line-height: 1.4; }
.tk-title--done{ color: var(--ink-600); text-decoration: line-through; }
.tk-meta{ gap: 9.173px; margin-top: 6.88px; }
.tk-clock{ gap: 4.587px; }
.tk-pt{ font-size: var(--fs-meta); font-weight: 600; color: var(--pulse-600); }
.tk-pt--muted{ color: var(--ink-500); }

.tk-meta .tag:not([class*="tag--"]){
  background: var(--sunk-3); color: var(--signal-800); border-color: var(--line-signal);
}
.growth-path{ margin:10.32px 10.32px 0; padding:12.04px; border-radius:var(--r-box); background:linear-gradient(145deg,#FFF 0%,var(--sunk) 100%); border:0.573px solid var(--line-soft); }
.growth-path-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8.027px; }
.growth-path-title{ font-size:var(--fs-h4); font-weight:800; color:var(--ink-900); }
.growth-path-note{ font-size:var(--fs-micro); color:var(--signal-700); white-space:nowrap; }
.growth-path-steps{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4.013px; margin-top:12.04px; }
.growth-path-step{ position:relative; text-align:center; min-width:0; }
.growth-path-step:not(:last-child)::after{ content:''; position:absolute; top:10px; left:60%; width:80%; height:1.72px; background:var(--line-soft); }
.growth-path-dot{ position:relative; z-index:1; width:20.64px; height:20.64px; margin:0 auto; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--sunk-3); color:var(--ink-500); border:0.573px solid var(--line-soft); font-size:var(--fs-micro); font-weight:800; }
.growth-path-step--done .growth-path-dot,.growth-path-step--active .growth-path-dot{ background:var(--signal-700); color:#FFF; border-color:var(--signal-700); }
.growth-path-step--done:not(:last-child)::after{ background:var(--signal-700); }
.growth-path-label{ display:block; margin-top:4.013px; font-size:var(--fs-micro); color:var(--ink-600); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.growth-path-step--active .growth-path-label{ color:var(--signal-800); font-weight:800; }
.growth-path-current{ margin-top:10.32px; padding:8.027px; border-radius:9.173px; background:rgba(124,58,237,.07); }
.growth-path-current strong{ display:block; font-size:var(--fs-meta); color:var(--ink-900); }
.growth-path-current span{ display:block; margin-top:2.293px; font-size:var(--fs-micro); line-height:1.45; color:var(--ink-600); }
.learning-grid,.mentor-grid,.group-grid{ display:grid; gap:6.88px; }
.learning-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.learning-card,.mentor-card,.group-card{ min-width:0; padding:9.173px; border-radius:9.173px; background:#FFF; border:0.573px solid var(--line-soft); }
.learning-card{ cursor:pointer; }
.learning-card:active,.mentor-card:active,.group-card:active{ background:var(--signal-50); }
.learning-top,.mentor-top,.group-top{ display:flex; align-items:center; gap:6.88px; }
.learning-icon,.mentor-avatar,.group-icon{ width:28px; height:28px; flex:0 0 28px; border-radius:8.027px; display:flex; align-items:center; justify-content:center; background:var(--signal-50); color:var(--signal-700); font-size:var(--fs-meta); font-weight:800; }
.learning-icon svg,.group-icon svg{ width:15px; height:15px; }
.learning-title,.mentor-name,.group-title{ min-width:0; flex:1; font-size:var(--fs-meta); font-weight:800; color:var(--ink-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.learning-meta,.mentor-role,.group-meta{ margin-top:4.587px; font-size:var(--fs-micro); line-height:1.4; color:var(--ink-600); }
.learning-progress{ margin-top:7.45px; }
.mentor-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.mentor-card{ cursor:pointer; }
.mentor-avatar{ border-radius:50%; background:linear-gradient(135deg,#F7B65C,#E88C4A); color:#FFF; }
.mentor-role{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.group-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.group-card{ cursor:pointer; }
.group-icon{ border-radius:50%; background:rgba(52,163,122,.12); color:#27855E; }
.group-title{ display:block; margin-top:6.88px; }
.group-meta{ min-height:28px; }
.group-go{ display:block; margin-top:6.88px; font-size:var(--fs-micro); color:var(--signal-700); font-weight:700; }
@media (max-width:390px){
  .growth-path{ padding:9.173px; }
  .growth-path-label{ font-size:9px; }
  .mentor-grid,.group-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:4.013px; }
  .mentor-card,.group-card{ padding:7.45px 5.733px; }
  .mentor-avatar,.group-icon{ width:24px; height:24px; flex-basis:24px; }
}
@media (max-width:340px){
  .growth-path-steps{ gap:2px; }
  .growth-path-label{ font-size:8px; }
  .learning-grid{ grid-template-columns:1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .tk-row{ transition: none; }
  .role-pill{ transition: none; }

    el.innerHTML = h;
    renderHero('subBody');
    renderSections('subBody');

  el.innerHTML = h;
}

    html += '<div class="card card-pad gap wx-view" style="margin-top:10.32px;"><div class="f-between mb-8 wx-view"><span class="col-h wx-text">课程 / 实训进度</span><span class="t-tiny wx-text mp-nav" data-nav="course-list" style="cursor:pointer;">全部课程 ›</span></div><div class="learning-grid"><div class="learning-card mp-nav" data-nav="course"><div class="learning-top"><span class="learning-icon">课</span><span class="learning-title">社群服务标准</span></div><div class="learning-meta">已学 68% · 剩 14 分钟</div><div class="prog-track learning-progress"><div class="prog-fill" style="width:68%;"></div></div></div><div class="learning-card mp-nav" data-nav="course"><div class="learning-top"><span class="learning-icon">练</span><span class="learning-title">首群经营实训</span></div><div class="learning-meta">已完成 3 / 6 章 · 待提交作业</div><div class="prog-track learning-progress"><div class="prog-fill" style="width:50%;"></div></div></div></div></div>';
    html += '<div class="card card-pad gap wx-view" style="margin-top:10.32px;"><div class="f-between mb-8 wx-view"><span class="col-h wx-text">三类导师</span><span class="t-tiny wx-text">按阶段获得辅导</span></div><div class="mentor-grid"><div class="mentor-card mp-nav" data-nav="advisor"><div class="mentor-top"><span class="mentor-avatar">成</span><span class="mentor-name">成长导师</span></div><div class="mentor-role">陪你完成入门与训练</div></div><div class="mentor-card mp-nav" data-nav="advisor"><div class="mentor-top"><span class="mentor-avatar">课</span><span class="mentor-name">课程导师</span></div><div class="mentor-role">答疑课程与实训作业</div></div><div class="mentor-card mp-nav" data-nav="advisor"><div class="mentor-top"><span class="mentor-avatar">经</span><span class="mentor-name">经营导师</span></div><div class="mentor-role">陪跑社群经营结果</div></div></div></div>';
    html += '<div class="card card-pad gap wx-view" style="margin-top:10.32px;"><div class="f-between mb-8 wx-view"><span class="col-h wx-text">加入训练社群</span><span class="t-tiny wx-text">选择适合你的群</span></div><div class="group-grid"><div class="group-card mp-nav" data-nav="group-qr"><span class="group-icon">群</span><span class="group-title">入门群</span><span class="group-meta">了解规则与成长路径</span><span class="group-go">查看入群 ›</span></div><div class="group-card mp-nav" data-nav="group-qr"><span class="group-icon">班</span><span class="group-title">班级训练群</span><span class="group-meta">跟着课程完成实训</span><span class="group-go">查看入群 ›</span></div><div class="group-card mp-nav" data-nav="group-qr"><span class="group-icon">陪</span><span class="group-title">经营陪跑群</span><span class="group-meta">复盘经营与持续答疑</span><span class="group-go">查看入群 ›</span></div></div></div>';

      '<span class="t-tiny wx-text">' + esc(sec.sub) + '</span></div>';
    sec.tasks.forEach(function(task){ html += rowHtml(task, sec.type); });
    html += '</div>';
  });
  var el = document.getElementById(targetId);
  if (targetId === 'tkSections') el.innerHTML = html;
  else el.insertAdjacentHTML('beforeend', html);
}

function renderAll(){
  renderPills();
  if (ROLE === 'member') {
    document.getElementById('tkWork').innerHTML = '';
    renderHero('tkHeroZone');
    renderSections('tkSections');
  } else {
    document.getElementById('tkHeroZone').innerHTML = '';
    document.getElementById('tkSections').innerHTML = '';
    renderWorkbench();
    if (ROLE === 'agent') loadPendingApplications();
  }
}

// 身份切换（校验解锁）
function switchRole(r){
  if (!ROLES[r]) return;
  if (!UNLOCKED[r]) { openUnlock(r); return; }
  if (ROLE === r) return;
  closeTeamFullscreen();
  ROLE = r;
  SUBTAB = 'team';
  INFLUENCE_TAB = r === 'agent' ? 'team' : 'community';
  NETWORK_SCOPE = 'all';
  renderAll();
}

// 解锁弹层
var PENDING_ROLE = null;
function openUnlock(r){
  PENDING_ROLE = r;
  var rule = UNLOCK_RULES[r];
  if (!rule) return;
  document.getElementById('unlockH').textContent = rule.title;
  document.getElementById('unlockD').textContent = rule.desc;
  var list = '';
  rule.conds.forEach(function(c){
    list += '<div class="unlock-li"><svg viewBox="0 0 24 24" style="background-image:' + ICO_LOCK + ';background-size:100% 100%;"></svg>' + esc(c) + '</div>';
  });
  document.getElementById('unlockList').innerHTML = list;
  document.getElementById('unlockMask').classList.add('is-open');
  // 视口小于机身时，让弹层对齐可视区中心
  requestAnimationFrame(function(){
    var sb = document.querySelector('.unlock-sheet').getBoundingClientRect();
    var delta = (sb.top + sb.height / 2) - (window.innerHeight / 2);
    if (Math.abs(delta) > 4) window.scrollBy(0, delta);
  });
}
document.getElementById('unlockClose').addEventListener('click', function(){
  document.getElementById('unlockMask').classList.remove('is-open');
});
document.getElementById('unlockGo').addEventListener('click', function(){
  if (PENDING_ROLE) { UNLOCKED[PENDING_ROLE] = true; switchRole(PENDING_ROLE); PENDING_ROLE = null; }
  document.getElementById('unlockMask').classList.remove('is-open');
});

// AI 军师悬浮球 → ai.html
document.getElementById('aiFab').addEventListener('click', function(){
  location.href = 'ai.html' + location.search;
});

// 事件委托：身份分段器 + 子页签 + 去分发 + 周期分段（全局）
document.getElementById('roleSw').addEventListener('click', function(e){
  var p = e.target.closest ? e.target.closest('.topseg-item') : null;
  if (p) switchRole(p.getAttribute('data-role'));
});
document.getElementById('tkWork').addEventListener('click', function(e){
  var applicationAction = e.target.closest ? e.target.closest('[data-application-action]') : null;
  if (applicationAction) {
    var applicationId = applicationAction.getAttribute('data-application-id');
    var approved = applicationAction.getAttribute('data-application-action') === 'approve';
    var rejectReason = approved ? '' : window.prompt('请输入拒绝原因', '资料或资格未通过');
    if (!approved && rejectReason === null) return;
    applicationAction.disabled = true;
    reviewApplication(applicationId, approved, rejectReason).then(function(){
      closeTeamFullscreen();
      loadPendingApplications();
      loadTeamTree();
    }).catch(function(error){
      applicationAction.disabled = false;
      window.alert(error.message || '审核失败');
    });
    return;
  }
  var applicationRow = e.target.closest ? e.target.closest('[data-application-id]') : null;
  if (applicationRow) {
    var application = AGENT_APPLICATIONS.applications.filter(function(item){ return item.id === applicationRow.getAttribute('data-application-id'); })[0];
    if (application) openApplication(application);
    return;
  }
  var applicationFilter = e.target.closest ? e.target.closest('[data-application-filter]') : null;
  if (applicationFilter) {
    var filter = applicationFilter.getAttribute('data-application-filter');
    var list = document.querySelector('[data-application-list]');
    if (list) {
      list.innerHTML = applicationListHtml();
      list.style.display = 'block';
      list.querySelectorAll('[data-application-id]').forEach(function(row){
        var item = AGENT_APPLICATIONS.applications.filter(function(application){ return application.id === row.getAttribute('data-application-id'); })[0];
        row.style.display = filter === 'all' || (filter === 'leader' && item.identity === '团长') || (filter === 'agent' && item.identity === '代理') ? '' : 'none';
      });
    }
    return;
  }
  var influenceTab = e.target.closest ? e.target.closest('[data-influence-tab]') : null;
  if (influenceTab) {
    INFLUENCE_TAB = influenceTab.getAttribute('data-influence-tab');
    renderSubBody();
    return;
  }
  var teamPage = e.target.closest ? e.target.closest('[data-team-page]') : null;
  if (teamPage) {
    openTeamPage({
      type: teamPage.getAttribute('data-team-page'),
      title: teamPage.getAttribute('data-team-title') || '我的团队',
      scope: teamPage.getAttribute('data-team-scope') || '全部',
      metric: teamPage.getAttribute('data-team-metric') || '',
      count: teamPage.getAttribute('data-team-count') || '',
      weeklyAdd: teamPage.getAttribute('data-team-weekly-add') || 0,
      potential: teamPage.getAttribute('data-team-potential') || 0,
      keyword: '',
      filter: '本周'
    });
    return;
  }
  var pill = e.target.closest ? e.target.closest('#subTab .subtab-pill[data-sub]') : null;
  if (pill) {
    SUBTAB = pill.getAttribute('data-sub');
    renderWorkbench();
    return;
  }
  // 页内跳子页签（如团队页代理审核入口 → 审核子页）
  var gosub = e.target.closest ? e.target.closest('[data-gosub]') : null;
  if (gosub) {
    SUBTAB = gosub.getAttribute('data-gosub');
    document.querySelectorAll('#subTab .subtab-pill[data-sub]').forEach(function(p){
      p.classList.toggle('subtab-pill--on', p.getAttribute('data-sub') === SUBTAB);
    });
    renderSubBody();
    var f = document.querySelector('.mp-frame');
    if (f) f.scrollTo({ top: 0 });
    window.scrollTo(0, 0);
    return;
  }
  // 漏斗格下钻 → 打开新增成员列表页
  var fcell = e.target.closest ? e.target.closest('[data-funnel]') : null;
  if (fcell) {
    var fLabel = fcell.getAttribute('data-funnel');
    var fPool = getMemberPool(fLabel);
    var fCount = fcell.querySelector('.funnel-v');
    openTeamPage({
      type: 'metric',
      title: fPool.label,
      scope: '全部',
      metric: fLabel,
      count: fCount ? fCount.textContent : fPool.members.length,
      weeklyAdd: Math.max(1, Math.floor(fPool.members.length / 2)),
      potential: 0,
      keyword: '',
      relTab: '全部'
    });
    return;
  }
  var act = e.target.closest ? e.target.closest('[data-act="dist"]') : null;
  if (act) {
    SUBTAB = 'promotion';
    document.querySelectorAll('#subTab .subtab-pill[data-sub]').forEach(function(p){
      p.classList.toggle('subtab-pill--on', p.getAttribute('data-sub') === SUBTAB);
    });
    renderSubBody();
    // 平滑回顶，兜底瞬时滚顶（兼容 smooth 不生效的环境）；外层 window 同步回顶
    try { document.querySelector('.mp-frame').scrollTo({ top: 0, behavior: 'smooth' }); } catch (err) {}
    window.scrollTo(0, 0);
    setTimeout(function(){
      var f = document.querySelector('.mp-frame');
      if (f && f.scrollTop > 4) f.scrollTop = 0;
    }, 500);
  }
});

document.getElementById('teamFullscreen').addEventListener('click', function(e){
  var back = e.target.closest ? e.target.closest('[data-team-full-back]') : null;
  if (back) {
    backTeamPage();
    return;
  }
  // 复制按钮
  var copyBtn = e.target.closest ? e.target.closest('[data-copy]') : null;
  if (copyBtn) {
    e.stopPropagation();
    var text = copyBtn.getAttribute('data-copy');
    try {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    } catch (err) {}
    var tip = document.createElement('div');
    tip.textContent = '已复制';
    tip.style.cssText = 'position:fixed;top:40%;left:50%;transform:translateX(-50%);background:rgba(51,33,15,.82);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:99999;white-space:nowrap;';
    document.body.appendChild(tip);
    setTimeout(function(){ tip.remove(); }, 1200);
    return;
  }
  // 查看资料按钮 → 进入该成员详情
  var viewBtn = e.target.closest ? e.target.closest('[data-team-view-profile]') : null;
  if (viewBtn) {
    e.stopPropagation();
    var vName = viewBtn.getAttribute('data-team-view-profile');
    var curPage = TEAM_PAGE_STACK[TEAM_PAGE_STACK.length - 1];
    pushTeamPage({ type: 'member', title: vName, member: vName, metric: curPage.metric || '', scope: curPage.scope || '全部' });
    return;
  }
  var expandRow = e.target.closest ? e.target.closest('[data-team-expand]') : null;
  if (expandRow) {
    TEAM_TREE_EXPANDED[expandRow.getAttribute('data-team-expand')] = !TEAM_TREE_EXPANDED[expandRow.getAttribute('data-team-expand')];
    renderTeamPage();
    return;
  }
  var member = e.target.closest ? e.target.closest('[data-team-member]') : null;
  if (member) {
    var memberName = member.getAttribute('data-team-member');
    var currentPage = TEAM_PAGE_STACK[TEAM_PAGE_STACK.length - 1];
    pushTeamPage({ type: 'member', title: memberName, member: memberName, metric: currentPage.metric || '', scope: currentPage.scope || '全部' });
    return;
  }
  var nextLevel = e.target.closest ? e.target.closest('[data-team-next-level]') : null;
  if (nextLevel) {
    var parentName = nextLevel.getAttribute('data-team-next-level');
    pushTeamPage({ type: 'next', title: parentName + '的下一级关系', parent: parentName, keyword: '' });
    return;
  }
  var searchSubmit = e.target.closest ? e.target.closest('[data-team-search-submit]') : null;
  if (searchSubmit) {
    var input = document.querySelector('#teamFullscreen [data-team-search]');
    var pg = TEAM_PAGE_STACK[TEAM_PAGE_STACK.length - 1];
    pg.keyword = input ? input.value : '';
    renderTeamPage();
    return;
  }
  // 关系类型 Tab 切换
  var relTab = e.target.closest ? e.target.closest('[data-team-rel-tab]') : null;
  if (relTab) {
    var p = TEAM_PAGE_STACK[TEAM_PAGE_STACK.length - 1];
    p.relTab = relTab.getAttribute('data-team-rel-tab');
    renderTeamPage();
    return;
  }
  // 团队等级 Tab 切换（总览页）
  var levelTab = e.target.closest ? e.target.closest('[data-team-level-tab]') : null;
  if (levelTab) {
    var lp = TEAM_PAGE_STACK[TEAM_PAGE_STACK.length - 1];
    lp.levelTab = levelTab.getAttribute('data-team-level-tab');
    renderTeamPage();
    return;
  }
  // 查看推荐 → 打开推荐人页
  var refBtn = e.target.closest ? e.target.closest('[data-team-referral]') : null;
  if (refBtn) {
    pushTeamPage({ type: 'referral', title: '查看推荐人' });
    return;
  }
  var filter = e.target.closest ? e.target.closest('[data-team-filter]') : null;
  if (filter) {
    var page = TEAM_PAGE_STACK[TEAM_PAGE_STACK.length - 1];
    page.filter = filter.getAttribute('data-team-filter');
    renderTeamPage();
  }
});

// 周期切换（两处独立）：.rep-tab=收益报表周期 PERIOD；.tk-per=任务进度周期 TPERIOD
document.addEventListener('click', function(e){
  var isRep = e.target.closest ? e.target.closest('.rep-tab') : null;
  if (isRep) {
    PERIOD = isRep.getAttribute('data-period');
    renderSubBody();
    return;
  }
  var c = e.target.closest ? e.target.closest('.tk-per') : null;
  if (!c) return;
  TPERIOD = c.getAttribute('data-period');
  if (ROLE === 'member') renderHero('tkHeroZone');
  else renderSubBody();
});

renderAll();
</script>
