<style>.class-hero{ padding: 13.76px; overflow: hidden; }
.class-name{
  font-size: 28.093px; font-weight: 700;
  max-width: 217.867px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.class-count{ display: block; font-size: 20.067px; font-weight: 700; color: var(--ink-900); margin-top: 2.293px; }
.mini-t{ display: block; font-size: var(--fs-sec); font-weight: 700; color: var(--ink-900); }
.mini-d{ display: block; font-size: var(--fs-tiny); color: var(--ink-600); margin-top: 1.147px; }


.class-meta{
  display: grid; grid-template-columns: 103.2px minmax(0, 1fr); gap: 6.88px;
  align-items: stretch;
}
.class-count-box{ padding: 9.173px 10.32px; }
.class-contacts{ min-width: 0; padding: 6.88px 10.32px; display: flex; flex-direction: column; justify-content: center; }
.class-contact{ min-width: 0; display: flex; align-items: center; gap: 6.88px; }
.class-contact--second{ margin-top: 5.733px; padding-top: 5.733px; border-top: 0.573px solid var(--line-soft); }


.gs-row{ gap: 6.88px; padding-top: 8.6px; padding-bottom: 8.6px; }
.gs-v{ font-size: var(--fs-sec); font-weight: 700; }


.big-action{
  position: relative; border-radius: var(--r-card); padding: 16.053px 13.76px;
  min-height: 91.733px; display: flex; flex-direction: column; gap: 10.32px;
  box-sizing: border-box;
}
.big-action--grad{
  background: var(--grad-primary-d);
  border: 0.573px solid var(--line-signal);
  box-shadow: var(--sh-signal-sm);
}
.big-action--ghost{
  background: rgba(255, 247, 236, 0.9);
  border: 0.573px solid rgba(247, 182, 92, 0.4);
}
.ba-t{ display: block; font-size: 17.2px; font-weight: 700; color: var(--ink-900); }
.ba-d{ display: block; font-size: var(--fs-tiny); color: var(--ink-700); margin-top: 2.867px; }
.ba-t--on{ color: var(--on-signal); }
.ba-d--on{ color: var(--on-signal-2); }


.roster{ display: flex; gap: 13.76px; overflow-x: auto; padding-bottom: 4.587px; }
.roster-i{ flex: 0 0 auto; width: 55.04px; text-align: center; }
.roster-n{
  display: block; margin-top: 5.16px; font-size: var(--fs-tiny); color: var(--ink-900);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.me-pill{
  display: inline-block; margin-top: 2.867px;
  font-size: var(--fs-micro); color: var(--signal-600);
  padding: 1.147px 6.88px; border-radius: 5.16px;
  background: rgba(124, 58, 237, 0.12); border: 0.573px solid var(--line-brand);
}

.more-disc{
  
  width: 48.16px; height: 48.16px; margin: 0 auto; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--sunk-2); border: 0.573px solid var(--line-brand);
}



.sq-hero{ padding: 16.053px; display: flex; align-items: flex-start; gap: 11.467px; }

.sq-title{ display: block; font-size: 29.813px; font-weight: 800; line-height: 1.2; }
.sq-tools{ display: flex; flex-wrap: wrap; gap: 6.88px; }

.sq-post-t{ font-size: 17.2px; font-weight: 700; color: var(--ink-900); line-height: 1.4; }

.sq-note{
  display: flex; align-items: flex-start; gap: 6.88px;
  padding: 11.467px 13.76px; border-radius: 9.173px;
  background: var(--sunk); border: 0.573px solid var(--line-soft);
  font-size: var(--fs-tiny); line-height: 1.6; color: var(--ink-600);
}

.group-boundary{ margin-bottom: 10.32px; }


.roster-note{
  display: flex; align-items: flex-start; gap: 5.733px;
  margin-top: 8.027px;
  font-size: var(--fs-tiny); line-height: 1.5; color: var(--ink-600);
}


.task-t{ display: block; font-size: var(--fs-body); font-weight: 600; color: var(--ink-900); }
.task-st{ font-size: var(--fs-meta); font-weight: 700; }


.act-row{
  display: grid; grid-template-columns: 100.333px minmax(0, 1fr);
  align-items: start; gap: 8.027px 12.04px;
}
.act-thumb{
  position: relative; width: 100.333px; height: 84.28px; border-radius: 10.32px;
  padding: 10.32px; box-sizing: border-box;
  display: flex; align-items: flex-end;
  background: var(--grad-thumb); border: 0.573px solid var(--line-strong);
}
.act-badge{ position: absolute; left: 5.733px; top: 5.733px; }
.act-cover{ font-size: var(--fs-meta); font-weight: 700; color: var(--signal-800); line-height: 1.3; }
.act-main{ min-width: 0; }
.act-t{ display: block; font-size: var(--fs-h4); font-weight: 700; color: var(--ink-900); }
.act-side{
  grid-column: 2; display: flex; align-items: center; justify-content: flex-start;
  flex-wrap: wrap; gap: 4.587px 6.88px; text-align: left;
}
.act-cd{ font-size: var(--fs-sec); font-weight: 700; color: var(--ink-900); }



.act-sheet-t{ display: block; font-size: 24.08px; font-weight: 700; color: var(--ink-900); line-height: 1.3; }
.info-line{
  display: flex; align-items: flex-start; gap: 8.027px;
  padding: 8.027px 0; border-bottom: 0.573px solid var(--line-soft);
  font-size: var(--fs-sec); color: var(--ink-700); line-height: 1.5;
}
.info-line:last-child{ border-bottom: none; }


.sq-stats{ flex: 0 0 108.933px; display: flex; flex-direction: column; gap: 4.587px; }
.sq-stat{
  padding: 5.733px 9.173px; border-radius: 8.027px;
  background: var(--sunk-2); border: 0.573px solid var(--line-brand);
}
.sq-stat-v{ display: block; font-size: var(--fs-h4); font-weight: 700; color: var(--ink-900); }
.sq-stat-l{ display: block; margin-top: 1.147px; font-size: var(--fs-micro); color: var(--ink-600); }


.sq-post{
  display: flex; gap: 10.32px; align-items: flex-start;
  padding: 12.613px 0; border-top: 0.573px solid var(--line-soft);
}
.sq-post:first-of-type{ border-top: none; padding-top: 2.293px; }

.sq-post-top{ gap: 6.88px; }
.sq-name{ flex: none; font-size: var(--fs-sec); font-weight: 700; color: var(--ink-900); }
.sq-group{ min-width: 0; font-size: var(--fs-tiny); color: var(--signal-800); }
.sq-topic{ font-size: var(--fs-tiny); font-weight: 700; color: var(--signal-600); }


.act-cancel{ font-size: var(--fs-tiny); color: var(--ink-600); text-decoration: underline; }</style>
