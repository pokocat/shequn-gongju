/* ===== 会员卡横滑 ===== */
.swiper{ display:flex; gap:8.027px; padding:4.013px 10.32px 4.587px; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; }

.s-card{ width:280px; flex-shrink:0; border-radius:16px; padding:11.467px 12.04px 9.173px; scroll-snap-align:center; position:relative; overflow:hidden; cursor:pointer; transition:opacity .25s,transform .25s,box-shadow .25s; box-sizing:border-box; }
.s-card--on{ opacity:1; transform:scale(1); box-shadow:0 6px 24px rgba(126,92,150,.12), var(--sheen); border:0.573px solid var(--line-signal); }
.s-card--off{ opacity:.8; transform:scale(.95); box-shadow:0 2px 10px rgba(122,82,54,.08); border:0.573px solid var(--line); }
.s-badge{ position:absolute; top:8.6px; right:8.6px; min-width:26.453px; height:19.533px; border-radius:11.467px; display:flex; align-items:center; justify-content:center; font-size:var(--fs-micro); font-weight:800; padding:0 5.733px; }
.s-name{ font-size:var(--fs-h4); font-weight:800; margin:0 0 1.147px; }
.s-dur{ font-size:var(--fs-tiny); margin-bottom:3.44px; opacity:.85; }
.s-dur--exp{ color:var(--signal-700); font-weight:700; opacity:1; }
.s-price{ font-size:var(--fs-h2); font-weight:800; margin:0 0 3.44px; }
.s-price .cur{ font-size:var(--fs-meta); font-weight:600; }
.s-feat{ font-size:var(--fs-micro); padding:2.293px 0; border-top:0.573px solid; display:flex; gap:4.013px; align-items:center; }
.s-feat:last-child{ border-bottom:0.573px solid; padding-bottom:2.293px; }
.s-dot{ width:4.013px; height:4.013px; border-radius:50%; flex-shrink:0; }
/* 四档卡片配色（全部浅色，对齐我的页面风格） */
.card-starter{ background:linear-gradient(135deg,#FAF6F0 0%,#F3EDE3 100%); color:var(--ink-900); }
.card-starter .s-badge{ background:var(--track); color:var(--ink-600); }
.card-starter .s-feat{ border-color:rgba(122,82,54,.1); color:var(--ink-700); }
.card-starter .s-dot{ background:var(--ink-400); }
.card-pro{ background:var(--grad-hero); color:var(--ink-900); }
.card-pro .s-badge{ background:linear-gradient(135deg,#7C3AED,#A98BF5); color:#FFF; }
.card-pro .s-feat{ border-color:rgba(124,58,237,.12); color:var(--ink-800); }
.card-pro .s-dot{ background:var(--signal-400); }
.card-elite{ background:var(--grad-hero-2); color:var(--ink-900); }
.card-elite .s-badge{ background:rgba(124,58,237,.18); color:var(--signal-800); }
.card-elite .s-feat{ border-color:rgba(124,58,237,.12); color:var(--ink-800); }
.card-elite .s-dot{ background:var(--signal-400); }
.card-creator{ background:var(--grad-hero-3); color:var(--ink-900); }
.card-creator .s-badge{ background:linear-gradient(135deg,#92400E,#D97A35); color:#FFF; }
.card-creator .s-feat{ border-color:rgba(146,64,14,.14); color:var(--ink-800); }
.card-creator .s-dot{ background:var(--pulse-500); }
/* 圆点指示器 */
.dots-row{ display:flex; justify-content:center; gap:5.16px; padding:2.293px 0 8.027px; }
.dot{ width:5.16px; height:5.16px; border-radius:50%; background:var(--line); transition:all .2s; }
.dot--on{ width:17.2px; background:var(--signal-600); border-radius:3.44px; }
.swiper-hint{ display:none; }

/* ===== 通用区块卡片 ===== */
.sec-card{ margin:10.32px 10.32px 14.907px; padding:12.04px; border-radius:var(--r-box); background:var(--sunk); border:0.573px solid var(--line); }
.sec-h{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8.027px; }
.sec-title{ font-size:var(--fs-h4); font-weight:700; color:var(--ink-900); }
.sec-count{ font-size:var(--fs-micro); color:var(--signal-700); font-weight:600; }
.sec-divider{ margin:18.92px 10.32px 8.027px; display:flex; align-items:center; gap:6.88px; }
.sec-divider::before{ content:''; width:3.44px; height:16.053px; background:linear-gradient(180deg,var(--signal-600),var(--signal-800)); border-radius:2.293px; }
.sec-divider span{ font-size:var(--fs-h4); font-weight:800; color:var(--ink-900); }

/* ===== 权益网格 ===== */
.rights-sub{ font-size:var(--fs-micro); font-weight:700; color:var(--ink-600); margin:8.027px 0 4.013px; display:flex; align-items:center; gap:4px; }
.rights-sub::before{ content:''; width:2px; height:10px; border-radius:1px; background:var(--signal-400); }
.rights-sub--lock::before{ background:var(--ink-400); }
.rights-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6.88px; }
.right-tile{ text-align:center; padding:8.027px 2px; border-radius:10.32px; background:var(--sunk-2); border:0.573px solid var(--line-soft); transition:transform .15s; }
.right-tile:active{ transform:scale(.96); }
.right-tile--lock{ background:transparent; border-color:transparent; }
.right-ico{ margin:0 auto; color:var(--signal-700); display:flex; justify-content:center; }
.right-tile--lock .right-ico{ color:var(--ink-400); }
.right-ico svg{ width:24px; height:24px; }
.right-t{ display:block; margin-top:5.16px; font-size:var(--fs-micro); font-weight:600; color:var(--ink-800); line-height:1.25; }
.right-tile--lock .right-t{ color:var(--ink-500); }
.right-st{ display:inline-block; margin-top:2.867px; font-size:9px; font-weight:700; padding:1.147px 5.16px; border-radius:4px; line-height:1.35; white-space:nowrap; }
.right-st--ok{ background:rgba(34,197,94,.12); color:var(--ok); }
.right-st--use{ background:rgba(124,58,237,.1); color:var(--signal-700); }
.right-st--lock{ background:rgba(122,82,54,.1); color:var(--ink-600); }
/* 本周推荐 */
.rec-row{ display:flex; align-items:center; gap:10.32px; padding:8.027px; border-radius:var(--r-box); background:var(--sunk-2); margin-top:8.027px; }
.rec-ico{ display:flex; align-items:center; color:var(--signal-700); flex-shrink:0; }
.rec-ico svg{ width:22px; height:22px; }
.rec-info{ flex:1; min-width:0; }
.rec-name{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.rec-desc{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }
.rec-go{ font-size:var(--fs-micro); color:var(--signal-700); font-weight:600; flex-shrink:0; }
/* 使用三步 */
.steps{ display:flex; gap:6.88px; margin-top:8.027px; }

.step-n{ width:20.64px; height:20.64px; border-radius:50%; margin:0 auto 4.013px; display:grid; place-items:center; font-size:var(--fs-micro); font-weight:800; color:#FFF; background:linear-gradient(135deg,var(--signal-600),var(--signal-800)); }
.step-t{ font-size:var(--fs-micro); color:var(--ink-700); font-weight:600; }

/* ===== 专属服务 ===== */
.svc-item{ display:flex; align-items:center; gap:10.32px; padding:10.32px 0; border-bottom:0.573px solid var(--line-soft); }
.svc-item:last-child{ border-bottom:none; }
.svc-ico{ display:flex; align-items:center; color:var(--signal-700); flex-shrink:0; }
.svc-ico svg{ width:22px; height:22px; }
.svc-info{ flex:1; min-width:0; }
.svc-name{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.svc-desc{ font-size:var(--fs-micro); color:var(--ink-600); margin-top:1.147px; }
.svc-count{ font-size:var(--fs-micro); color:var(--signal-700); font-weight:600; margin-top:1.147px; }
.svc-btn{ padding:5.733px 12.04px; border-radius:8.6px; background:var(--signal-600); color:#FFF; font-size:var(--fs-micro); font-weight:600; flex-shrink:0; }

.svc-empty{ text-align:center; padding:12.04px; font-size:var(--fs-micro); color:var(--ink-500); }

/* ===== AI 建议一行卡（页面末尾，预留底部操作栏空间） ===== */

var TIER_ORDER = ['starter','pro','elite','creator'];
var CURRENT = 'pro';
var USER_TIER = 'pro'; // 用户实际持有的等级（卡片上显示有效期）

// ===== 渲染会员卡横滑 =====
function renderSwiper(){
  var sw = document.getElementById('cardSwiper');
  var dots = document.getElementById('cardDots');
  sw.innerHTML = ''; dots.innerHTML = '';
  TIER_ORDER.forEach(function(key, i){
    var t = TIERS[key];
    var on = key === CURRENT;
    var card = document.createElement('div');
    card.className = 's-card ' + t.colorClass + (on ? ' s-card--on' : ' s-card--off');
    card.setAttribute('data-tier', key);
    card.innerHTML =
      '<span class="s-badge">'+t.tag+'</span>'+
      '<div class="s-name">'+t.name+'</div>'+
      '<div class="s-dur'+(key===USER_TIER&&t.expire?' s-dur--exp':'')+'">'+(key===USER_TIER&&t.expire?'有效期至 '+t.expire:t.dur)+'</div>'+
      '<div class="s-price"><span class="cur">¥</span>'+t.price+'<span style="font-size:var(--fs-micro);font-weight:500;opacity:.7">'+t.priceUnit+'</span></div>'+
      '<div class="s-feat"><span class="s-dot"></span>'+(key==='creator'?'终身权益':'权益逐年生效')+'</div>'+
      '<div class="s-feat"><span class="s-dot"></span>'+(key==='starter'?'升级可解锁全部':'专属服务可用')+'</div>';
    card.addEventListener('click', function(){ switchTier(key); });
    sw.appendChild(card);
    var dot = document.createElement('div');
    dot.className = 'dot' + (on ? ' dot--on' : '');
    dot.setAttribute('data-tier', key);
    dot.addEventListener('click', function(){ switchTier(key); });
    dots.appendChild(dot);
  });
  // 滚动到当前卡居中
  setTimeout(function(){
    var cur = sw.querySelector('.s-card--on');
    if(cur){ var sl = cur.offsetLeft - (sw.clientWidth - cur.offsetWidth)/2; sw.scrollTo({left:sl, behavior:'smooth'}); }
  }, 50);
}

// ===== 切换等级 =====
function switchTier(key){
  if(CURRENT === key) return;
  CURRENT = key;
  // 更新卡片状态
  var sw = document.getElementById('cardSwiper');
  sw.querySelectorAll('.s-card').forEach(function(c){
    var on = c.getAttribute('data-tier') === key;
    c.className = c.className.replace(/s-card--(on|off)/g,'') + (on ? ' s-card--on' : ' s-card--off');
  });
  var dots = document.getElementById('cardDots');
  dots.querySelectorAll('.dot').forEach(function(d){
    var on = d.getAttribute('data-tier') === key;
    d.className = 'dot' + (on ? ' dot--on' : '');
  });
  renderContent();
}

function makeSvg(paths){ return SVG_WRAP.replace('{d}', paths || '<circle cx="12" cy="12" r="9"/>'); }
function getRightStatus(r){
  // 三态统一：锁定=升级（棕灰）、开放类=绿、配额类=紫（前缀"剩"）
  if(r.lock) return {cls:'right-st--lock', t:'升级'};
  if(r.s==='可用' || r.s==='可约' || r.s==='优先' || r.s==='无限') return {cls:'right-st--ok', t:r.s};
  return {cls:'right-st--use', t:/\d/.test(r.s) ? '剩' + r.s : r.s};
}
function renderContent(){
  var t = TIERS[CURRENT];
  // 权益 - 分已解锁/待解锁两组
  document.getElementById('rightsTitle').textContent = t.name + ' · 全部权益';
  var avail = t.rights.filter(function(r){ return !r.lock; }).length;
  var locked = t.rights.length - avail;
  document.getElementById('rightsCount').textContent = avail + '项可用' + (locked ? ' / ' + locked + '项待解锁' : '');
  var rg = document.getElementById('rightsGrid');
  var unlocked = t.rights.filter(function(r){ return !r.lock; });
  var lockedList = t.rights.filter(function(r){ return r.lock; });
  var html = '';
  if(unlocked.length){
    html += '<div class="rights-sub">已解锁 · '+unlocked.length+'项</div>';
    html += '<div class="rights-grid">' + unlocked.map(function(r){
      var st = getRightStatus(r);
      return '<div class="right-tile">'+
        '<div class="right-ico">'+makeSvg(RIGHT_SVGS[r.n])+'</div>'+
        '<span class="right-t">'+r.n+'</span>'+
        '<span class="right-st '+st.cls+'">'+st.t+'</span>'+
        '</div>';
    }).join('') + '</div>';
  }
  if(lockedList.length){
    html += '<div class="rights-sub rights-sub--lock">待解锁 · '+lockedList.length+'项</div>';
    html += '<div class="rights-grid">' + lockedList.map(function(r){
      var st = getRightStatus(r);
      return '<div class="right-tile right-tile--lock">'+
        '<div class="right-ico">'+makeSvg(RIGHT_SVGS[r.n])+'</div>'+
        '<span class="right-t">'+r.n+'</span>'+
        '<span class="right-st right-st--lock">'+st.t+'</span>'+
        '</div>';
    }).join('') + '</div>';
  }
  rg.innerHTML = html;
  // 本周推荐
  document.getElementById('recRow').innerHTML =
    '<div class="rec-ico">'+makeSvg('<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>')+'</div>'+
    '<div class="rec-info"><div class="rec-name">'+t.rec.name+'</div><div class="rec-desc">'+t.rec.desc+'</div></div>'+
    '<span class="rec-go">查看 ›</span>';
  // 服务
  var sl = document.getElementById('svcList');
  if(t.services.length === 0){
    sl.innerHTML = '<div class="svc-empty">体验会员暂未开通专属服务，升级 PRO 即可预约</div>';
  } else {
    sl.innerHTML = t.services.map(function(s){
      return '<div class="svc-item">'+
        '<div class="svc-ico">'+makeSvg(SVC_SVGS[s.n])+'</div>'+
        '<div class="svc-info"><div class="svc-name">'+s.n+'</div><div class="svc-desc">'+s.d+'</div><div class="svc-count">'+s.c+'</div></div>'+
        '<div class="svc-btn'+(s.used?' svc-btn--used':'')+'">'+s.btn+'</div>'+
        '</div>';
    }).join('');
  }
  // AI 建议一行卡（续费/升级动作由底部常驻按钮承担，按钮文字随等级联动）

    '<b>✦ AI 建议</b>' + r.ai + ' <em>' + r.bonus.t + '：' + r.bonus.d + '</em>';
  // 底部主按钮：按选中等级与用户等级的关系显示动作（当前=续费 / 更高=升级 / 更低=成为会员）

}
