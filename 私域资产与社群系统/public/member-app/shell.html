<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主理人公社 · 会员小程序</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(76% 48% at 50% 0%, rgba(185,255,61,.18), transparent 64%), #f4f6ee;
  color: #252922;
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  overflow: hidden;
}
.sh-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
/* 页面本身固定 430×932（设计稿画布）。宿主 tab 的高度不固定，所以整机等比缩放，
   而不是让页面自己去适配——改页面宽度就不再是「所见即设计稿」了。 */
.sh-phone {
  width: 430px; height: 932px; flex: 0 0 auto;
  transform-origin: center center;
  border-radius: 46px; overflow: hidden; background: #FFF7EC;
  box-shadow: 0 0 0 9px #fff, 0 0 0 10px rgba(25,33,16,.12), 0 28px 72px rgba(35,45,20,.18);
}
.sh-phone iframe { display: block; width: 430px; height: 932px; border: 0; }

.sh-meta {
  position: fixed; left: 14px; bottom: 14px; z-index: 20;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  max-width: calc(100% - 120px);
  padding: 7px 12px; border-radius: 999px;
  background: rgba(255,255,255,.94); border: 1px solid rgba(25,33,16,.12);
  box-shadow: 0 8px 22px rgba(45,61,29,.10);
}
.sh-meta b { font-size: 12px; color: #20251d; }
.sh-meta code { font: 10px/1 "SF Mono", Menlo, monospace; color: #79826f; }
.sh-meta .sh-tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #efffd1; border: 1px solid #cbe99a; color: #4e7700; }
.sh-meta button {
  all: unset; cursor: pointer; font-size: 10px; font-weight: 700; letter-spacing: .02em;
  padding: 3px 9px; border-radius: 999px; border: 1px solid #dce8cb; color: #39452e; background: #fff;
}
.sh-meta button.on { background: #b9ff3d; border-color: #b9ff3d; color: #101509; }

.sh-fab {
  all: unset; cursor: pointer;
  position: fixed; right: 16px; bottom: 16px; z-index: 30;
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(145deg, #b9ff3d, #9bea22); color: #090a0a;
  box-shadow: 0 8px 22px rgba(154,230,30,.28), inset 0 1px 0 rgba(255,255,255,.72);
}
.sh-fab svg { display: block; }
.sh-fab.open { transform: rotate(45deg); }

.sh-panel {
  position: fixed; right: 16px; bottom: 74px; z-index: 30;
  width: 300px; max-height: min(72vh, 620px);
  display: none; flex-direction: column;
  border-radius: 16px; overflow: hidden;
  background: rgba(255,255,255,.97); border: 1px solid rgba(25,33,16,.14);
  box-shadow: 0 18px 50px rgba(35,45,20,.18);
}
.sh-panel.open { display: flex; }
.sh-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 13px; border-bottom: 1px solid rgba(25,33,16,.1);
  font-size: 12px; font-weight: 700; color: #090a0a;
}
.sh-head span em { font-style: normal; font-weight: 400; color: #79826f; margin-left: 5px; }
.sh-head button { all: unset; cursor: pointer; width: 22px; height: 22px; text-align: center; color: #687062; font-size: 15px; }
.sh-search { padding: 9px 13px 0; }
.sh-search input {
  width: 100%; padding: 6px 10px; font: inherit; font-size: 12px;
  border-radius: 9px; border: 1px solid #dce8cb; background: #fbfcf6; color: #252922;
}
.sh-scroll { overflow-y: auto; padding: 9px 13px 13px; }
.sh-scroll::-webkit-scrollbar { width: 6px; }
.sh-scroll::-webkit-scrollbar-thumb { background: rgba(116,156,21,.42); border-radius: 3px; }
.sh-grp-t { margin: 11px 0 6px; font-size: 10px; font-weight: 700; letter-spacing: .06em; color: #729d08; }
.sh-grp:first-child .sh-grp-t { margin-top: 2px; }
.sh-list { display: flex; flex-wrap: wrap; gap: 5px; }
.sh-item {
  all: unset; cursor: pointer;
  padding: 5px 9px; border-radius: 8px; font-size: 11.5px;
  color: #4b5148; background: #fbfcf6; border: 1px solid rgba(25,33,16,.1);
}
.sh-item.on { color: #090a0a; background: #b9ff3d; border-color: #9bea22; font-weight: 700; }
.sh-item i { font-style: normal; color: #79826f; }
.sh-item.on i { color: #3c5200; }
.sh-empty { padding: 14px 2px; font-size: 12px; color: #79826f; }
</style>
</head><body>

<div class="sh-stage"><div class="sh-phone" id="phone"><iframe id="frame" title="会员小程序页面"></iframe></div></div>

<div class="sh-meta">
  <b id="curTitle">—</b><span class="sh-tag" id="curVariant" hidden></span><code id="curRoute"></code>
  <button id="toggleFull" type="button">整页</button>
</div>

<button class="sh-fab" id="fab" type="button" aria-label="跳转到页面">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
</button>

<div class="sh-panel" id="panel">
  <div class="sh-head"><span>跳转到页面<em id="count"></em></span><button id="close" type="button" aria-label="关闭">×</button></div>
  <div class="sh-search"><input id="q" type="search" placeholder="搜页面名或状态" autocomplete="off"></div>
  <div class="sh-scroll" id="list"></div>
</div>

var ALL = GROUPS.reduce(function (a, g) { return a.concat(g.items); }, []);
var frame = document.getElementById("frame");
var phone = document.getElementById("phone");
var panel = document.getElementById("panel");
var fab = document.getElementById("fab");
var full = false;
var current = "";

function scale() {
  // 舞台留 28px 余量；只缩不放，桌面上宽裕时保持 1:1（1:1 时量到的数才是设计稿的数）
  var k = Math.min(1, (innerHeight - 28) / 932, (innerWidth - 28) / 430);
  phone.style.transform = "scale(" + k + ")";
}
addEventListener("resize", scale);

// 页面内点出去的跳转由 iframe 自己完成（见页面里的 data-nav 脚本），shell 只跟着更新
// 标题条与清单高亮 —— 否则点了几层之后底部那条信息就是错的，而错的比没有更糟。
function setCurrent(slug) {
  var item = ALL.filter(function (i) { return i.slug === slug; })[0];
  if (!item) return null;
  current = item.slug;
  document.getElementById("curTitle").textContent = item.title;
  document.getElementById("curRoute").textContent = item.route;
  var v = document.getElementById("curVariant");
  v.textContent = item.variant; v.hidden = !item.variant;
  document.title = item.title + (item.variant ? " · " + item.variant : "") + " · 会员小程序";
  var url = new URL(location.href);
  url.searchParams.set("screen", item.slug);
  history.replaceState({ screen: item.slug }, "", url);
  render();
  return item;
}

function show(slug) {
  var item = setCurrent(slug) || setCurrent(ALL[0].slug);
  if (!item) return;
  frame.src = "pages/" + encodeURIComponent(item.slug) + ".html?embed=1" + (full ? "&full=1" : "");
}

addEventListener("message", function (e) {
  var d = e.data || {};
  if (d.mpScreen) setCurrent(d.mpScreen);
  if (d.mpBack) { panel.classList.add("open"); fab.classList.add("open"); document.getElementById("q").focus(); }
});

function render() {
  var kw = document.getElementById("q").value.trim().toLowerCase();
  var host = document.getElementById("list");
  var shown = 0;
  host.innerHTML = GROUPS.map(function (g) {
    var items = g.items.filter(function (i) {
      if (!kw) return true;
      return (i.title + " " + i.variant + " " + i.route + " " + i.slug).toLowerCase().indexOf(kw) >= 0;
    });
    shown += items.length;
    if (!items.length) return "";
    return '<div class="sh-grp"><div class="sh-grp-t">' + g.name + "</div><div class=\"sh-list\">" +
      items.map(function (i) {
        return '<button class="sh-item' + (i.slug === current ? " on" : "") + '" data-slug="' +
          i.slug.replace(/"/g, "&quot;") + '">' + i.title +
          (i.variant ? " <i>· " + i.variant + "</i>" : "") + "</button>";
      }).join("") + "</div></div>";
  }).join("") || '<div class="sh-empty">没有匹配的页面</div>';
  document.getElementById("count").textContent = kw ? shown + " / " + ALL.length + " 屏" : ALL.length + " 屏";
}

document.getElementById("list").addEventListener("click", function (e) {
  var b = e.target.closest(".sh-item");
  if (b) { show(b.dataset.slug); panel.classList.remove("open"); fab.classList.remove("open"); }
});
document.getElementById("q").addEventListener("input", render);
fab.addEventListener("click", function () {
  panel.classList.toggle("open"); fab.classList.toggle("open");
  if (panel.classList.contains("open")) document.getElementById("q").focus();
});
document.getElementById("close").addEventListener("click", function () {
  panel.classList.remove("open"); fab.classList.remove("open");
});
document.getElementById("toggleFull").addEventListener("click", function () {
  full = !full;
  this.classList.toggle("on", full);
  this.textContent = full ? "一屏" : "整页";
  show(current);
});
addEventListener("keydown", function (e) {
  if (e.key === "Escape") { panel.classList.remove("open"); fab.classList.remove("open"); }
});

scale();
show(new URLSearchParams(location.search).get("screen") || ALL[0].slug);
</script>
</body></html>
