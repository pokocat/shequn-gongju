  function render() {
    var g = "ca1";
    try {
      var m = location.search.match(/[?&]g=([^&]+)/);

    if (cntEl) cntEl.textContent = cnt ? cnt[1] + " 条" : "已生成";

    list.innerHTML = "";
    s.ai.forEach(function (line) {

      li.textContent = line;
      list.appendChild(li);
    });
    var box = $("#msg-list");
    box.innerHTML = "";

        var t = document.createElement("div");
        t.className = "chat-time";
        var span = document.createElement("span");
        span.className = "mono wx-text";
        span.textContent = m[1];
        t.appendChild(span);
        box.appendChild(t);
        return;

      var row = document.createElement("div");
      row.className = "chat-row" + (mine ? " chat-row--mine" : "");

      ava.className = "chat-ava";

  function initJump() {
    var flow = $(".chat-flow");
    if (!flow) return;
    var jump = document.createElement("button");
    jump.type = "button";
    jump.className = "chat-jump";
    jump.textContent = "回到底部";
    jump.setAttribute("aria-label", "回到最新消息");
    $(".chat-screen").appendChild(jump);
    function update() {
      if (flow.scrollHeight - flow.scrollTop - flow.clientHeight < 18) {
        jump.classList.remove("is-show");
      } else {
        jump.classList.add("is-show");
      }
    }
    jump.addEventListener("click", function () {
      flow.scrollTo({ top: flow.scrollHeight, behavior: "smooth" });
      update();
    });
    flow.addEventListener("scroll", update);
    flow.scrollTop = flow.scrollHeight;
    update();
  }

  var sumPanel = $("#gc-sum");
  var askPanel = $("#gc-ask");
  var btnSum = $("#gc-btn-sum");
  var btnAsk = $("#gc-btn-ask");
  var flowEl = $(".chat-flow");

  function closePanels() {
    sumPanel.classList.remove("is-open");
    askPanel.classList.remove("is-open");
    btnSum.classList.remove("is-on");
    btnAsk.classList.remove("is-on");
    btnSum.setAttribute("aria-expanded", "false");
    btnAsk.setAttribute("aria-expanded", "false");
  }
  function togglePanel(panel, btn) {
    var willOpen = !panel.classList.contains("is-open");
    closePanels();
    if (willOpen) {
      panel.classList.add("is-open");
      btn.classList.add("is-on");
      btn.setAttribute("aria-expanded", "true");
      var jump = document.querySelector(".chat-jump");
      if (jump) jump.classList.remove("is-show");
    } else if (flowEl) {
      flowEl.dispatchEvent(new Event("scroll")); // 收起后重新计算「回到底部」状态
    }
  }
  btnSum.addEventListener("click", function () { togglePanel(sumPanel, btnSum); });
  btnAsk.addEventListener("click", function () { togglePanel(askPanel, btnAsk); });
  flowEl.addEventListener("click", function () { closePanels(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closePanels();
  });

    if (!hasQ) {
      inp.textContent = "试试点击上面的预设问题（演示）";
      inp.classList.add("is-focus");
      setTimeout(function () { inp.classList.remove("is-focus"); }, 800);
      return;
    }
    var t = $("#gc-answer-t");
    t.textContent = "演示环境：已收到你的问题，正式版将由群聊 AI 基于同步记录回答。";
    $("#gc-answer").hidden = false;
  });

  render();
  initJump();
})();
</script>
</body></html>
