<style>
.wd-layer{ padding-bottom: 20px; display:flex; flex-direction:column; min-height:100%; box-sizing:border-box; }
/* 转出方式 tab（下划线式，参考图） */
.wd-tabs{ display:flex; margin:10.32px 10.32px 0; background:#FFF; border-radius:var(--r-box); border:0.573px solid var(--line-soft); padding:0 5.16px; }
.wd-tab{ flex:1; text-align:center; padding:11.467px 0 9.173px; font-size:var(--fs-meta); font-weight:600; color:var(--ink-600); cursor:pointer; position:relative; }
.wd-tab--on{ color:var(--signal-700); font-weight:800; }
.wd-tab--on::after{ content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:0; width:28.64px; height:2.293px; border-radius:1.147px; background:var(--signal-600); }
/* 账户行 */
.wd-acct{ display:flex; align-items:center; gap:9.173px; margin:10.32px 10.32px 0; padding:11.467px 12.04px; border-radius:var(--r-box); background:#FFF; border:0.573px solid var(--line-soft); cursor:pointer; }
.wd-acct:active{ transform:scale(.99); }
.wd-acct-ico{ width:33.253px; height:33.253px; border-radius:8.6px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#FFF; font-size:14px; font-weight:800; }
.wd-acct-ico--ali{ background:linear-gradient(135deg,#7C3AED,#A98BF5); }
.wd-acct-ico--bank{ background:linear-gradient(135deg,#6D28D9,#8B5CF6); }
.wd-acct-info{ flex:1; min-width:0; }
.wd-acct-t{ font-size:var(--fs-meta); font-weight:700; color:var(--ink-900); }
.wd-acct-d{ font-size:var(--fs-micro); color:var(--ink-500); margin-top:1.147px; }
.wd-acct-go{ color:var(--ink-400); font-size:var(--fs-meta); flex-shrink:0; }
/* 金额输入区 */
.wd-amt{ margin:10.32px 10.32px 0; padding:14.907px 12.04px 12.04px; border-radius:var(--r-box); background:#FFF; border:0.573px solid var(--line-soft); }
.wd-amt-l{ font-size:var(--fs-micro); font-weight:700; color:var(--ink-700); }
.wd-amt-row{ display:flex; align-items:center; gap:6.88px; margin-top:6.88px; border-bottom:0.573px solid var(--line); padding-bottom:8.6px; }
.wd-amt-cur{ font-size:28.093px; font-weight:800; color:var(--ink-900); font-family:var(--font-mono); }
.wd-amt-v{ flex:1; min-width:0; font-size:28.093px; font-weight:800; color:var(--ink-900); font-family:var(--font-mono); white-space:nowrap; overflow:hidden; }
.wd-amt-v.is-empty{ color:var(--ink-400); }
.wd-amt-cursor{ width:1.72px; height:24.08px; background:var(--signal-600); flex-shrink:0; animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }
.wd-all{ flex-shrink:0; font-size:var(--fs-meta); font-weight:700; color:var(--signal-700); cursor:pointer; padding:2.293px 5.16px; }
.wd-amt-tip{ font-size:var(--fs-micro); color:var(--ink-500); margin-top:7.45px; }
/* 确认按钮 */
.wd-confirm{ margin:13.76px 10.32px 0; text-align:center; padding:12.04px 0; border-radius:11.467px; font-size:var(--fs-sec); font-weight:800; background:linear-gradient(90deg,var(--signal-600),var(--signal-800)); color:#FFF; box-shadow:0 4px 14px rgba(109,40,217,.3); cursor:pointer; transition:opacity .2s; }
.wd-confirm.is-disabled{ opacity:.4; box-shadow:none; }
.wd-confirm:active{ transform:scale(.98); }
/* 规则说明（银行卡态） */
.wd-rules{ margin:12.04px 10.32px 0; padding:0 2.293px; }
.wd-rule{ display:flex; gap:5.16px; font-size:var(--fs-micro); color:var(--ink-500); line-height:1.7; }
.wd-rule b{ font-weight:700; flex-shrink:0; }
/* 数字键盘（参考图：3×4 带字母映射） */
.wd-pad{ margin-top:auto; background:#F3EDE3; border-radius:14.907px 14.907px 0 0; padding:8.027px 6.88px calc(10.32px + 6px); }
.wd-pad-row{ display:flex; gap:5.733px; }
.wd-key{
  flex:1; height:44.853px; border-radius:8.6px; background:#FFF;
  border:0.573px solid rgba(122,82,54,.12);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; transition:background .1s;
}
.wd-key:active{ background:var(--sunk-2); }
.wd-key-n{ font-size:17.2px; font-weight:700; color:var(--ink-900); line-height:1.1; font-family:var(--font-mono); }
.wd-key-l{ font-size:7px; color:var(--ink-400); letter-spacing:.5px; margin-top:1px; }
.wd-key--fn .wd-key-n{ font-size:20px; font-family:inherit; }
/* toast */
.wd-toast{ position:fixed; top:38%; left:50%; transform:translateX(-50%); z-index:999; background:rgba(51,33,15,.85); color:#FFF; font-size:var(--fs-meta); padding:8.6px 18.92px; border-radius:20.64px; pointer-events:none; opacity:0; transition:opacity .2s; white-space:nowrap; }
.wd-toast.is-on{ opacity:1; }
</style>

<script>
// 跨页跳转
(function () {
  var SLUG = "withdraw";
  try { if (parent !== window) parent.postMessage({ mpScreen: SLUG }, "*"); } catch (e) {}
  document.addEventListener("click", function (e) {
    var el = e.target && e.target.closest ? e.target.closest("[data-nav]") : null;
    if (!el) return;
    e.preventDefault();
    var t = el.getAttribute("data-nav");
    if (t === "__back__") { if (history.length > 1) history.back(); else location.href = "tasks.html" + location.search; return; }
    location.href = t + ".html" + location.search;
  });
})();
</script>
<script>
// ===== 提现页（参考提现流程设计，小程序配色） =====
var CHANNEL = 'ali'; // ali | bank
var BALANCE = 425.64;
var amount = '';

var ACCTS = {
  ali: { ico: '支', cls: 'wd-acct-ico--ali', t: '支付宝', d: '138****6789 · 已绑定' },
  bank: { ico: '卡', cls: 'wd-acct-ico--bank', t: '中国工商银行', d: '尾号 1351 · 已绑定' }
};

var KEYS = [
  ['1', ''], ['2', 'ABC'], ['3', 'DEF'],
  ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'],
  ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'],
  ['.', ''], ['0', ''], ['del', '']
];

function toast(msg){
  var t = document.getElementById('wdToast');
  t.textContent = msg;
  t.classList.add('is-on');
  setTimeout(function(){ t.classList.remove('is-on'); }, 1600);
}

function renderAcct(){
  var a = ACCTS[CHANNEL];
  document.getElementById('wdAcct').innerHTML =
    '<div class="wd-acct-ico ' + a.cls + '">' + a.ico + '</div>' +
    '<div class="wd-acct-info"><div class="wd-acct-t">' + a.t + '</div><div class="wd-acct-d">' + a.d + '</div></div>' +
    '<span class="wd-acct-go">›</span>';
}

function renderPad(){
  var html = '';
  for (var r = 0; r < 4; r++) {
    html += '<div class="wd-pad-row">';
    for (var c = 0; c < 3; c++) {
      var k = KEYS[r * 3 + c];
      var fn = k[0] === 'del' ? ' wd-key--fn' : '';
      var label = k[0] === 'del' ? '⌫' : k[0];
      html += '<div class="wd-key' + fn + '" data-key="' + k[0] + '" role="button">' +
        '<span class="wd-key-n">' + label + '</span>' +
        (k[1] ? '<span class="wd-key-l">' + k[1] + '</span>' : '') +
        '</div>';
    }
    html += '</div>';
  }
  document.getElementById('wdPad').innerHTML = html;
}

function updateAmt(){
  var el = document.getElementById('wdVal');
  if (!amount) { el.textContent = '请输入金额'; el.classList.add('is-empty'); }
  else { el.textContent = amount; el.classList.remove('is-empty'); }
  var ok = /^[1-9]\d{2,}$/.test(amount) && parseInt(amount, 10) <= Math.floor(BALANCE);
  document.getElementById('wdConfirm').classList.toggle('is-disabled', !ok);
}

function pressKey(k){
  if (k === 'del') { amount = amount.slice(0, -1); }
  else if (k === '.') { toast('仅支持整数提现'); return; }
  else { if (amount.length < 6) amount += k; }
  updateAmt();
}

// 通道切换
document.getElementById('wdTabs').addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('.wd-tab') : null;
  if (!t) return;
  CHANNEL = t.getAttribute('data-ch');
  document.querySelectorAll('.wd-tab').forEach(function(x){
    x.classList.toggle('wd-tab--on', x === t);
  });
  renderAcct();
  document.getElementById('wdRules').hidden = CHANNEL !== 'bank';
});

// 账户行（示意）
document.getElementById('wdAcct').addEventListener('click', function(){ toast('正式版可更换绑定账户'); });

// 全部
document.getElementById('wdAll').addEventListener('click', function(){
  amount = String(Math.floor(BALANCE));
  updateAmt();
});

// 键盘
document.getElementById('wdPad').addEventListener('click', function(e){
  var k = e.target.closest ? e.target.closest('.wd-key') : null;
  if (k) pressKey(k.getAttribute('data-key'));
});

// 确认
document.getElementById('wdConfirm').addEventListener('click', function(){
  if (document.getElementById('wdConfirm').classList.contains('is-disabled')) {
    if (!/^[1-9]\d{2,}$/.test(amount)) toast('请输入 100 元以上整数金额');
    else toast('超出可提现余额');
    return;
  }
  toast('提现申请已提交，审核通过后 24 小时内到账');
  amount = '';
  updateAmt();
});

renderAcct();
renderPad();
updateAmt();
</script>
